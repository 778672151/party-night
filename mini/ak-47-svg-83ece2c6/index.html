  <style><![CDATA[
    text{font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none}
    .num{font-variant-numeric:tabular-nums}
    .cloud{animation:drift 52s ease-in-out infinite alternate}
    .cloud.b{animation-duration:74s;animation-delay:-18s}
    .cloud.c{animation-duration:63s;animation-delay:-31s}
    @keyframes drift{from{transform:translateX(-46px)}to{transform:translateX(118px)}}
    .bird{animation:fly 46s linear infinite}
    .bird.b{animation-duration:61s;animation-delay:-24s}
    @keyframes fly{from{transform:translate(60px,0)}to{transform:translate(-1420px,-46px)}}
    .grass{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
    @keyframes sway{0%,100%{transform:rotate(-3.2deg)}50%{transform:rotate(3.2deg)}}
    .blink{animation:blink 0.9s steps(2,end) infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.15}}
    .ui{cursor:pointer}
    .btn:hover .btn-bg{filter:brightness(1.2)}
    .btn:active .btn-bg{filter:brightness(0.85)}
    .fadeUp{animation:fadeUp 0.95s ease-out forwards}
    @keyframes fadeUp{0%{opacity:0;transform:translateY(6px) scale(0.8)}18%{opacity:1;transform:translateY(0) scale(1.08)}
      60%{opacity:1;transform:translateY(-16px) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(0.95)}}
    .puff{animation:puff 0.75s ease-out forwards}
    @keyframes puff{0%{opacity:1;transform:scale(0.35)}100%{opacity:0;transform:scale(1.7)}}
    .tracer{animation:tfade 0.13s linear forwards}
    @keyframes tfade{from{opacity:0.95}to{opacity:0}}
    .hitmk{animation:hm 0.4s ease-out forwards}
    @keyframes hm{0%{opacity:0;transform:scale(1.7)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0.85)}}
    .smoke{animation:sm 1.9s ease-out forwards}
    @keyframes sm{0%{opacity:0.55;transform:translate(0,0) scale(0.5)}
      100%{opacity:0;transform:translate(38px,-56px) scale(2.4)}}
    .comboPop{animation:cp 0.5s ease-out}
    @keyframes cp{0%{transform:scale(1.6)}100%{transform:scale(1)}}
  ]]></style>

function hitCircle(t,ox,oy,dx,dy){
  var mx=ox-t.x,my=oy-t.y,b=mx*dx+my*dy,c=mx*mx+my*my-t.r*t.r,disc=b*b-c;
  if(disc<0) return -1; var s=Math.sqrt(disc),tt=-b-s; if(tt<0) tt=-b+s; return tt<0?-1:tt;
}
function hitRect(t,ox,oy,dx,dy){
  var t0=-1e9,t1=1e9,a,b,tm;
  if(Math.abs(dx)<1e-6){ if(ox<t.x0||ox>t.x1) return -1; }
  else{ a=(t.x0-ox)/dx; b=(t.x1-ox)/dx; if(a>b){tm=a;a=b;b=tm;} if(a>t0)t0=a; if(b<t1)t1=b; }
  if(Math.abs(dy)<1e-6){ if(oy<t.y0||oy>t.y1) return -1; }
  else{ a=(t.y0-oy)/dy; b=(t.y1-oy)/dy; if(a>b){tm=a;a=b;b=tm;} if(a>t0)t0=a; if(b<t1)t1=b; }
  if(t0>t1||t1<0) return -1; return t0<0?0:t0;
}
function hitTest(t,ox,oy,dx,dy){ return t.kind==='c'?hitCircle(t,ox,oy,dx,dy):hitRect(t,ox,oy,dx,dy); }

/* ================= 射击 ================= */
function fireRay(ang){
  var ox=PIVOT.x,oy=PIVOT.y,dx=Math.cos(ang),dy=Math.sin(ang),bt=1e9,best=null,i,t,tt;
  for(i=0;i<targets.length;i++){
    t=targets[i];
    if(!t.alive) continue;
    if(t.type==='popper'&&t.down>0.5) continue;
    tt=hitTest(t,ox,oy,dx,dy);
    if(tt>=0&&tt<bt){bt=tt;best=t;}
  }
  var ground=false;
  if(dy>0.0001){
    var tg=(GY-oy)/dy;
    if(tg>0&&tg<bt){var gx=ox+tg*dx; if(gx>-40&&gx<1320){bt=tg;best=null;ground=true;}}
  }
  if(bt>1e8) bt=1600;
  return {t:bt,target:best,x:ox+bt*dx,y:oy+bt*dy,ang:ang,ground:ground};
}
function onHit(r){
  var t=r.target,x=r.x,y=r.y,pts=0,label='',col='#ffe9a8',size=24;
  if(t.type==='paper'){
    if(dst(input.x,input.y,t.cx,t.cy)<=t.r*1.06){x=input.x;y=input.y;}
    var d=dst(x,y,t.cx,t.cy), ring=d<t.r*0.2?10:(d<t.r*0.45?9:(d<t.r*0.72?8:7));
    addHole(t,x,y);
    pts=ring; label='+'+ring; col=ring===10?'#ff8ad8':(ring>=9?'#ffe9a8':'#cfe0ee');
    if(ring===10){label='10 环 +10';size=30;}
    sfx('pop'); sparks(x,y,4);
  } else if(t.type==='steel'){
    pts=20;t.swingV=-4.6;sfx('ping');sparks(x,y,14);label='钢靶 +20';size=28;col='#bfe8ff';
  } else if(t.type==='popper'){
    pts=35;t.down=1;sfx('ping');sparks(x,y,16);label='钢碟 +35';size=28;col='#bfe8ff';
  } else if(t.type==='rail'){
    pts=25;sfx('ping');sparks(x,y,10);label='移动靶 +25';size=26;col='#bfe8ff';
  } else if(t.type==='clay'){
    pts=25;sfx('break');shards(x,y,'#e07a2c');killTarget(t);label='飞碟 +25';size=26;col='#ffb46a';
  } else if(t.type==='balloon'){
    pts=18;sfx('pop');confetti(x,y,t.col);killTarget(t);label='气球 +18';size=24;col=t.col;
  }
  G.hits++; G.combo++; G.comboT=2.6;
  if(G.combo>G.bestCombo) G.bestCombo=G.combo;
  var mult=Math.min(5,1+Math.floor(G.combo/3));
  G.score+=pts*mult;
  popText(x,y-14,(mult>1?('x'+mult+' '):'')+label,col,size);
  if(mult>1&&G.combo%3===0) popText(x,y-48,'连击 x'+mult,'#7fd4ff',22);
  hitMark();
  updateHUD();
}

  clearTimeout(flashT); flashT=setTimeout(function(){f.setAttribute('opacity','0');},50);
}
function shoot(){
  if(!G.running||G.paused||G.reloading) return;
  if(G.ammo<=0){ sfx('empty'); emptyWarn(); return; }
  G.ammo--; G.shots++;
  G.recoil+=0.030+Math.random()*0.012;
  G.kick=Math.min(7,G.kick+5.5);
  G.spread=Math.min(0.075,G.spread+0.0115);
  doFlash(); smoke(); ejectCasing(); sfx('shot');
  var ang=totalAngle()+(Math.random()-0.5)*G.spread*2;
  var r=fireRay(ang);
  var m=gunPt(GUN_LEN+8,0);
  tracer(m.x,m.y,r.x,r.y);
  if(r.target) onHit(r); else onMiss(r);
  if(G.ammo===0) emptyWarn();
  updateHUD();
}
function emptyWarn(){
  var h=$('hint');
  h.textContent='弹匣已空 —— 按 R 键换弹';
  h.setAttribute('fill','#ff9a6a'); h.setAttribute('class','blink');
}
function resetHint(){
  var h=$('hint');
  h.removeAttribute('class'); h.setAttribute('fill','#b9cadb');
  h.textContent='移动鼠标瞄准 · 按住左键射击 · R 换弹 · B 切换单发/连发 · M 静音';
}

/* ================= 换弹 ================= */
function reload(){
  if(!G.running||G.paused||G.reloading||G.ammo===MAG_SIZE) return;
  G.reloading=true; G.reloadT=0; sfx('click');
  $('reloadUI').setAttribute('opacity','1');
  var mag=$('magGrp');
  var drop=mk('g',{},$('casings'));
  var inner=mk('g',{},drop);
  var shp=mk('g',{transform:'scale('+GS+')'},inner);
  mk('path',{d:'M-50,32 Q-60,110 0,168 L-108,190 Q-135,110 -150,32 Z',fill:'url(#magGrad)',stroke:'#2f1a07','stroke-width':1.6},shp);
  mk('path',{d:'M0,168 L-108,190 L-112,178 L-4,157 Z',fill:'#8a4f14',stroke:'#2f1a07','stroke-width':1.4},shp);
  var p=gunPt(-100,60), rot=totalAngle()*57.2958;
  inner.setAttribute('transform','translate('+p.x.toFixed(0)+','+p.y.toFixed(0)+') rotate('+rot.toFixed(0)+')');
  addEnt({type:'dropmag',node:drop,inner:inner,x:p.x,y:p.y,vy:-30,rot:rot,vr:rnd(120,230),life:2.0,max:2.0});
  mag.setAttribute('opacity','0');
  reloadTimers.push(setTimeout(function(){sfx('click');},520));
  reloadTimers.push(setTimeout(function(){mag.setAttribute('opacity','1');sfx('click');},1450));
  reloadTimers.push(setTimeout(function(){sfx('click');rackBolt();},1780));
  reloadTimers.push(setTimeout(function(){
    G.ammo=MAG_SIZE; G.reloading=false; $('reloadUI').setAttribute('opacity','0');
    $('reloadBar').setAttribute('width','0'); resetHint(); updateHUD();
  },2300));
}
function rackBolt(){
  var b=$('bolt'), c=$('charge'), n=0;
  var id=setInterval(function(){
    n++; var k=n%2?1:0;
    b.setAttribute('x',(-126+k*18).toString());
    c.setAttribute('x',(-160+k*18).toString());
    if(n>5){clearInterval(id);b.setAttribute('x','-126');c.setAttribute('x','-160');}
  },62);
}

/* ================= 飞靶 ================= */

/* ================= 主循环 ================= */
var last=0;
function update(dt){
  G.t+=dt;
  var i,e,t,a,gun;
  if(G.running&&!G.paused){
    G.time-=dt;
    if(G.time<=0){G.time=0;endRound();}
  }
  var dx=input.x-PIVOT.x, dy=input.y-PIVOT.y;
  var base=clamp(Math.atan2(dy,dx),-0.60,0.60);
  if(!G.running) base=-0.05+Math.sin(G.t*0.7)*0.022;
  G.disp+=(base-G.disp)*Math.min(1,dt*16);
  G.recoil*=Math.exp(-dt*6.5);
  G.kick*=Math.exp(-dt*10);
  G.spread*=Math.exp(-dt*2.2);
  if(G.spread<0.005) G.spread=0.005;
  a=totalAngle();
  gun=$('gunRig');
  var kx=-G.kick*GS*0.9*Math.cos(a), ky=-G.kick*GS*0.9*Math.sin(a);
  gun.setAttribute('transform','translate('+kx.toFixed(2)+','+ky.toFixed(2)+') translate('+PIVOT.x+','+PIVOT.y+
    ') rotate('+(a*57.2958).toFixed(3)+') scale('+GS+')');
  var md=clamp(dst(input.x,input.y,PIVOT.x,PIVOT.y),90,1500);
  var cxp=PIVOT.x+Math.cos(a)*md, cyp=PIVOT.y+Math.sin(a)*md;
  $('crosshair').setAttribute('transform','translate('+cxp.toFixed(1)+','+cyp.toFixed(1)+')');
  $('chCircle').setAttribute('r',(13+G.spread*540).toFixed(1));
  var hov=hoverTarget(), colr=hov?'#ff5040':'#ffffff';
  $('chT').setAttribute('stroke',colr);
  $('chCircle').setAttribute('stroke',colr);
  if(input.down&&G.running&&!G.paused&&!G.reloading&&G.auto){
    if(G.t-G.lastShot>FIRE_MS/1000){G.lastShot=G.t;shoot();}
  }
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0&&G.combo>0){G.combo=0;updateHUD();}}
  if(G.running&&!G.paused){
    clayT-=dt;balT-=dt;
    if(clayT<=0&&flyers.length<6){clayT=rnd(2.3,3.6);spawnClay();}
    if(balT<=0&&flyers.length<8){balT=rnd(3.0,4.8);spawnBalloon();}
  }
  for(i=flyers.length-1;i>=0;i--){
    t=flyers[i];
    if(t.type==='clay'){t.vy+=430*dt;t.x+=t.vx*dt;t.y+=t.vy*dt;t.rot+=t.vr*dt;}
    else {t.ph+=dt*2.2;t.y+=t.vy*dt;t.x+=t.vx*dt+Math.sin(t.ph)*24*dt;}
    t.node.setAttribute('transform','translate('+t.x.toFixed(1)+','+t.y.toFixed(1)+')'+(t.type==='clay'?' rotate('+t.rot.toFixed(0)+')':''));
    if(t.y>GY+60||t.x>1300||t.y<-60||t.x<-40){ killTarget(t); }
  }
  if(gong){
    gong.swingV+=(-gong.swing*22-gong.swingV*3.4)*dt;
    gong.swing+=gong.swingV*dt;
    gong.node.setAttribute('transform','rotate('+(gong.swing*2.8).toFixed(2)+' '+gong.x+' '+gong.pivotY+')');
  }
  if(rail){
    rail.x+=rail.vx*dt;
    if(rail.x>rail.x1-20){rail.x=rail.x1-20;rail.vx*=-1;}
    if(rail.x<rail.x0+20){rail.x=rail.x0+20;rail.vx*=-1;}
    rail.node.setAttribute('transform','translate('+rail.x.toFixed(1)+','+rail.y+')');
  }
  if(pop1&&pop1.down>0){
    pop1.down=Math.max(0,pop1.down-dt*0.3);
    pop1.node.setAttribute('transform','rotate('+((1-pop1.down)*84).toFixed(2)+' '+pop1.x+' '+(pop1.base-6)+')');
  }
  var arm=$('launchArm');
  if(arm) arm.setAttribute('transform','rotate('+(Math.sin(G.t*1.6)*3).toFixed(2)+')');
  var fl=$('flagCloth');
  if(fl) fl.setAttribute('transform','skewY('+(Math.sin(G.t*2.4)*5.5).toFixed(2)+')');
  updateEnts(dt);
  if(G.running){
    $('timeVal').textContent=Math.ceil(G.time);
    $('timeBar').setAttribute('width',(232*clamp(G.time/ROUND_TIME,0,1)).toFixed(1));
  }
  if(G.reloading){
    G.reloadT+=dt;
    $('reloadBar').setAttribute('width',(300*clamp(G.reloadT/G.reloadDur,0,1)).toFixed(1));
  }
}
function updateEnts(dt){
  for(var i=ents.length-1;i>=0;i--){
    var e=ents[i]; e.life-=dt;
    if(e.life<=0){rm(e.node);ents.splice(i,1);continue;}
    var k=e.life/e.max;
    if(e.type==='casing'){
      if(!e.landed){
        e.vy+=1500*dt; e.x+=e.vx*dt; e.y+=e.vy*dt; e.rot+=e.vr*dt;
        var gy=(e.x<548)?560:602;
        if(e.y>gy){e.y=gy;e.landed=true;e.vx=0;e.vy=0;e.rot=rnd(-100,-70);}
      }
      e.node.setAttribute('transform','translate('+e.x.toFixed(1)+','+e.y.toFixed(1)+') rotate('+e.rot.toFixed(0)+')');
      if(e.life<1.4) e.node.setAttribute('opacity',(e.life/1.4).toFixed(2));
    } else if(e.type==='smoke'){
      e.y-=13*dt;e.x+=7*dt;e.r+=24*dt;
      e.node.setAttribute('cy',e.y.toFixed(1));e.node.setAttribute('cx',e.x.toFixed(1));
      e.node.setAttribute('r',e.r.toFixed(1));e.node.setAttribute('opacity',(0.5*k).toFixed(3));
    } else if(e.type==='dust'){
      e.vy+=95*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.r+=22*dt;
      e.node.setAttribute('cx',e.x.toFixed(1));e.node.setAttribute('cy',e.y.toFixed(1));
      e.node.setAttribute('r',e.r.toFixed(1));e.node.setAttribute('opacity',(0.6*k).toFixed(3));
    } else if(e.type==='spark'){
      e.vy+=520*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;
      e.node.setAttribute('x1',e.x.toFixed(1));e.node.setAttribute('y1',e.y.toFixed(1));
      e.node.setAttribute('x2',(e.x-e.vx*0.022).toFixed(1));e.node.setAttribute('y2',(e.y-e.vy*0.022).toFixed(1));
      e.node.setAttribute('opacity',k.toFixed(2));
    } else if(e.type==='flashdot'){
      e.node.setAttribute('r',(e.r+24*(1-k)).toFixed(1));e.node.setAttribute('opacity',k.toFixed(2));
    } else if(e.type==='shard'){
      e.vy+=620*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.rot+=e.vr*dt;
      e.node.setAttribute('transform','translate('+e.x.toFixed(1)+','+e.y.toFixed(1)+') rotate('+e.rot.toFixed(0)+')');
      e.node.setAttribute('opacity',Math.min(1,k*2).toFixed(2));
    } else if(e.type==='text'){
      e.y-=36*dt;
      e.node.setAttribute('y',e.y.toFixed(1));
      e.node.setAttribute('opacity',Math.min(1,k*1.8).toFixed(2));
    } else if(e.type==='dropmag'){
      e.vy+=1400*dt;e.y+=e.vy*dt;e.rot+=e.vr*dt;
      e.inner.setAttribute('transform','translate('+e.x.toFixed(0)+','+e.y.toFixed(0)+') rotate('+e.rot.toFixed(0)+')');
      e.node.setAttribute('opacity',Math.min(1,k*2.2).toFixed(2));
      if(e.y>556){e.y=556;e.vy*=-0.22;e.vr*=0.4;if(Math.abs(e.vy)<28)e.vy=0;}
    }
  }
}
function hoverTarget(){
  for(var i=0;i<targets.length;i++){
    var t=targets[i]; if(!t.alive) continue;
    if(t.type==='popper'&&t.down>0.5) continue;
    if(t.kind==='c'){ if(dst(input.x,input.y,t.x,t.y)<=t.r) return t; }
    else if(input.x>=t.x0&&input.x<=t.x1&&input.y>=t.y0&&input.y<=t.y1) return t;
  }
  return null;
}

/* ================= HUD / 流程 ================= */
function updateHUD(){
  $('scoreVal').textContent=G.score;
  $('comboVal').textContent='x'+Math.min(5,1+Math.floor(G.combo/3));
  $('accVal').textContent=(G.shots?Math.round(G.hits/G.shots*100):0)+'%';
  $('hitVal').textContent='命中 '+G.hits+' / 射击 '+G.shots;
  $('ammoVal').textContent=G.ammo;
  $('ammoVal').setAttribute('fill',G.ammo<=6?'#ff6a4a':'#ffd98a');
  for(var i=0;i<ammoTicks.length;i++){ ammoTicks[i].setAttribute('opacity',i<G.ammo?'1':'0.15'); }
}
function buildHUD(){
  var tk=$('ammoTicks');
  for(var i=0;i<MAG_SIZE;i++){
    ammoTicks.push(mk('rect',{x:(i*5.0).toFixed(1),y:0,width:3.6,height:11,rx:1.4,fill:'#ffd98a'},tk));
  }
}
function clearEnts(kinds){
  for(var i=ents.length-1;i>=0;i--){
    if(kinds.indexOf(ents[i].type)>=0){rm(ents[i].node);ents.splice(i,1);}
  }
}
function startGame(){
  initAudio();
  G.running=true;G.paused=false;G.score=0;G.hits=0;G.shots=0;G.combo=0;G.bestCombo=0;
  G.ammo=MAG_SIZE;G.time=ROUND_TIME;G.reloading=false;G.reloadT=0;G.spread=0.005;G.recoil=0;G.kick=0;G.started=true;
  clayT=0.8;balT=1.6;
  for(var i=0;i<reloadTimers.length;i++) clearTimeout(reloadTimers[i]);
  reloadTimers.length=0;
  $('magGrp').setAttribute('opacity','1');
  $('bolt').setAttribute('x','-126');$('charge').setAttribute('x','-160');
  $('reloadUI').setAttribute('opacity','0');$('reloadBar').setAttribute('width','0');
  $('pauseScreen').setAttribute('opacity','0');
  $('endScreen').setAttribute('opacity','0');$('endScreen').setAttribute('pointer-events','none');
  $('startScreen').setAttribute('opacity','0');$('startScreen').setAttribute('pointer-events','none');
  for(i=0;i<papers.length;i++){ while(papers[i].holes.firstChild) papers[i].holes.removeChild(papers[i].holes.firstChild); }
  for(i=flyers.length-1;i>=0;i--) killTarget(flyers[i]);
  flyers.length=0;
  clearEnts(['casing','dropmag']);
  casings.length=0;
  if(pop1) pop1.down=0;
  $('timeVal').textContent=ROUND_TIME;$('timeBar').setAttribute('width','232');
  resetHint();updateHUD();
}
function endRound(){
  G.running=false;G.paused=false;input.down=false;
  $('timeVal').textContent='0';$('timeBar').setAttribute('width','0');
  $('pauseScreen').setAttribute('opacity','0');
  var acc=G.shots?Math.round(G.hits/G.shots*100):0;
  var rank='D',txt='新兵蛋子';
  if(G.score>=5000){rank='S';txt='传奇枪王';}
  else if(G.score>=3000){rank='A';txt='神射手';}
  else if(G.score>=1600){rank='B';txt='老练射手';}
  else if(G.score>=700){rank='C';txt='合格射手';}
  $('finalScore').textContent=G.score;
  $('finalRank').textContent='评级 '+rank+' · '+txt;
  var st=$('endStats');
  while(st.firstChild) st.removeChild(st.firstChild);
  var rows=[['命中率',acc+'%'],['命中 / 射击',G.hits+' / '+G.shots],['最高连击','x'+G.bestCombo]];
  for(var i=0;i<rows.length;i++){
    mk('text',{x:-170,y:i*34,'font-size':'19',fill:'#8fb4cc'},st).textContent=rows[i][0];
    mk('text',{x:170,y:i*34,'font-size':'19',fill:'#e8f1f8','text-anchor':'end','font-weight':'700'},st).textContent=rows[i][1];
  }
  $('endScreen').setAttribute('opacity','1');
  $('endScreen').setAttribute('pointer-events','auto');
  resetHint();
}
function togglePause(){
  if(!G.running) return;
  G.paused=!G.paused;
  $('pauseScreen').setAttribute('opacity',G.paused?'1':'0');
  if(G.paused) input.down=false;
}
function toggleMode(){
  G.auto=!G.auto;
  $('modeVal').textContent=G.auto?'连发':'单发';
  sfx('click');
  $('safety').setAttribute('transform','translate(-268,2) rotate('+(G.auto?0:-9)+')');
}
function toggleMute(){
  G.muted=!G.muted;
  $('muteVal').textContent=G.muted?'音效 关':'音效 开';
  if(!G.muted){ initAudio(); sfx('click'); }
}

/* ================= 输入 ================= */
function toLocal(ev){
  try{
    var m=svg.getScreenCTM();
    if(m&&svg.createSVGPoint){var p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;var q=p.matrixTransform(m.inverse());return {x:q.x,y:q.y};}
  }catch(e){}
  var r=svg.getBoundingClientRect();
  return {x:(ev.clientX-r.left)*1280/(r.width||1280),y:(ev.clientY-r.top)*720/(r.height||720)};
}
function inUI(ev){
  var t=ev.target;
  if(!t||!t.closest) return false;
  return !!(t.closest('.ui')||t.closest('#hud'));
}
svg.addEventListener('pointermove',function(ev){
  var p=toLocal(ev); input.x=p.x; input.y=p.y;
},{passive:true});
svg.addEventListener('pointerdown',function(ev){
  var p=toLocal(ev); input.x=p.x; input.y=p.y;
  if(inUI(ev)) return;
  if(!G.running){ if(!G.started){ startGame(); } return; }
  if(G.paused){ togglePause(); return; }
  input.down=true; G.lastShot=G.t; shoot();
  if(ev.preventDefault) ev.preventDefault();
});
window.addEventListener('pointerup',function(){input.down=false;});
window.addEventListener('pointercancel',function(){input.down=false;});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('keydown',function(e){
  var k=e.key?e.key.toLowerCase():'';
  if(k===' '||k==='spacebar'){ if(G.running&&!G.paused&&!G.reloading){G.lastShot=G.t;shoot();} if(e.preventDefault)e.preventDefault(); }
  else if(k==='r'){ reload(); }
  else if(k==='b'){ toggleMode(); }
  else if(k==='m'){ toggleMute(); }
  else if(k==='p'){ togglePause(); }
  else if(k==='enter'){ if(!G.running&&!G.started) startGame(); }
});
function bindUI(){
  function on(id,fn){ var el=$(id); if(el) el.addEventListener('click',function(e){e.stopPropagation();fn();}); }
  on('btnStart',startGame); on('btnAgain',startGame); on('muteBtn',toggleMute); on('modeBtn',toggleMode);
  ['pointerdown','pointerup','click'].forEach(function(t){
    ['startScreen','endScreen','hud'].forEach(function(id){
      var el=$(id); if(el) el.addEventListener(t,function(e){e.stopPropagation();},false);
    });
  });
}

/* ================= 启动 ================= */
var FORCE_DT=location.hash.indexOf('sim')>=0?1/60:0;
function boot(){
  buildTargets();
  buildHUD();
  bindUI();
  var gun=$('gunRig');
  if(!gun.getAttribute('transform')) gun.setAttribute('transform','translate(0,0) translate(330,420) rotate(-3) scale(0.62)');
  updateHUD();
  requestAnimationFrame(function step(ts){
    var dt=FORCE_DT||(last?Math.min(0.05,(ts-last)/1000):0.016); last=ts;
    try{ update(dt); }catch(err){ showErr(err&&err.message?err.message:err); }
    requestAnimationFrame(step);
  });
  if(location.hash.indexOf('pose')>=0){
    setTimeout(function(){ startGame(); input.x=1000; input.y=418; },200);
  }
  if(location.hash.indexOf('auto')>=0){
    setTimeout(function(){
      startGame();
      var n=0,id=setInterval(function(){
        n++;
        input.x=rnd(660,1240); input.y=rnd(260,520);
        G.lastShot=G.t; shoot();
        if(n>34){clearInterval(id);}
      },110);
    },350);
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
