<script id="core-source">/* YI Go — dependency-free area-scoring rules engine. */
function createGoCore() {

  const key = b => Array.prototype.join.call(b,'');

      if(!g.libs.size) {for(const r of g.stones){next[r]=0;captured.push(r);}}

  function eye(b,n,p,color) {
    if(b[p]||!neighbors(n)[p].every(q=>b[q]===color))return false;
    const x=p%n,y=Math.floor(p/n);let corners=0,good=0;

    if(![7,9,13,19].includes(n)||!Number.isFinite(komi)||Math.abs(komi)>100)throw Error('无效棋盘或贴目');

    if(![1,2].includes(data.human)||![1,2,3,4,5].includes(data.level)||!['ai','local'].includes(data.opponent))throw Error('对局设置无效');
    if(![1,2].includes(data.first)||!Array.isArray(data.initial)||data.initial.length!==data.n*data.n||data.initial.some(v=>![0,1,2].includes(v)))throw Error('初始布局无效');

    for(const group of analyze(current(g).board,g.n).groups)if(!group.libs.size)throw Error('初始布局含有零气棋块');

    }

<script id="worker-source" type="text/plain">/* Local teaching AI: tactical policies + heuristic-guided Monte Carlo tree search.

(function(root){

function rawCandidates(b,n,color){
 const {ids,groups}=C.analyze(b,n),adj=C.neighbors(n),out=[],occupied=[];

 for(let p=0;p<b.length;p++)if(!b[p]){

function view(){
 if(ui.mode==='learn'||ui.mode==='practice'){const t=task();return {n:t.def.n,board:t.board,next:t.def.color,last:t.last,numbers:new Uint16Array(t.def.n*t.def.n),task:t,dead:[],area:t.def.showArea?C.area(t.board,t.def.n,7.5):null};}
 const g=shownGame(),s=ui.mode==='records'?g.snapshots[Math.min(ui.reviewIndex,g.moves.length)]:C.current(g);
 const finalVisible=ui.mode!=='records'||ui.reviewIndex===g.moves.length;
 const scoring=finalVisible&&(g.status==='scoring'||g.status==='finished'&&g.result?.type==='score');
 return {n:g.n,board:s.board,next:s.next,last:s.last,numbers:s.numbers,dead:scoring?g.dead:[],area:scoring?C.area(s.board,g.n,g.komi,g.dead):null,game:g,snapshot:s};
}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3400);}
let audio;
function sound(capture=false){if(!prefs.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(capture?490:360,t);o.frequency.exponentialRampToValueAtTime(110,t+.085);g.gain.setValueAtTime(.075,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);o.connect(g);g.connect(audio.destination);o.start();o.stop(t+.12);}catch{}}
function saveCurrent(){store('yi.current.v1',C.pack(game));}
function archive(g=game){if(!g.moves.length)return;const p={...C.pack(g),savedAt:new Date().toISOString()};archiveData=archiveData.filter(x=>x?.id!==g.id);archiveData.unshift(p);archiveData=archiveData.slice(0,30);store('yi.archive.v1',archiveData);}
function currentTitle(g){if(g.result){if(!g.result.winner)return '双方和棋';return (g.result.winner===1?'黑方':'白方')+(g.result.type==='resign'?'胜 · 对方认输':'胜 '+Math.abs(g.result.difference)+' 点');}return g.status==='scoring'?'待确认终局':'进行中的对局';}
function clearView(){ui.hover=-1;ui.selected=-1;ui.hints=[];ui.pending=-1;ui.animation=null;}
function cancelAI(){request++;if(worker)worker.terminate();worker=null;clearTimeout(aiTimer);aiTimer=null;ui.busy=null;ui.iterations=0;}
function stopAutoplay(){clearInterval(autoplayTimer);autoplayTimer=null;}
function changeMode(mode){if(!['learn','play','practice','records'].includes(mode))return;cancelAI();stopAutoplay();clearView();ui.mode=mode;
 if(mode==='records'){ui.reviewGame=C.unpack(C.pack(game));ui.reviewIndex=game.moves.length;}
 render();if(mode==='play')scheduleAI();
}
function startTask(kind,index){cancelAI();stopAutoplay();clearView();if(kind==='learn'){ui.mode='learn';ui.lesson=Math.max(0,Math.min(7,index));lessonTask=makeTask(D.lessons[ui.lesson]);}else{ui.mode='practice';ui.puzzle=Math.max(0,Math.min(11,index));practiceTask=makeTask(D.puzzles[ui.puzzle]);}render();}
function completeTask(){const t=task();t.complete=true;const key=ui.mode==='learn'?'lessons':'puzzles',i=ui.mode==='learn'?ui.lesson:ui.puzzle;if(!study[key].includes(i)){study[key].push(i);store('yi.study.v1',study);}sound(true);toast(ui.mode==='learn'?'这一课，学会了。':'解题成功！');render();}
function taskClick(p){const t=task(),d=t.def;if(t.complete){if(t.board[p])inspect(p);else toast('已经完成了！可以进入下一课或再练一次。');return;}
 if(d.type==='quiz'){if(t.board[p])inspect(p);else toast('请在右侧选择黑方的得分。');return;}
 if(d.type==='select'){if(t.board[p]){inspect(p);return;}if(!d.answers.includes(p)){t.wrong++;toast('这个点不是本题要找的位置，再观察一下。');return;}t.selected.add(p);if(t.selected.size===d.answers.length)completeTask();else{sound();render();}return;}
 const r=C.play(t.board,d.n,p,d.color,t.history);

 if(!r.ok){t.wrong++;toast(errorText(r.error));return;}
 if(!d.answers.includes(p)){t.wrong++;toast('这手可以落，但没有完成本题目标。先数气，再试一个点。');return;}

function errorText(code){return {bounds:'请落在棋盘的交叉点上。',occupied:'这里已经有棋子了。',suicide:'禁入点：落子后无气，也不能提掉对方棋子。',superko:'劫／全局同形：这手会重复历史棋盘局面，不能下。',ended:'当前不是落子阶段。'}[code]||'这手不合法，请选择其他位置。';}
function inspect(p){const v=view();if(!v.board[p])return;ui.selected=ui.selected===p?-1:p;const g=C.group(v.board,v.n,p);const text=(g.color===1?'黑':'白')+'棋块：'+g.stones.length+' 颗棋子，'+g.libs.size+' 口气。'+(g.libs.size===1?'正在被打吃。':'相邻的气已在棋盘上标出。');if(ui.mode==='play')ui.coach=text;toast(text);render();}
function onPoint(p,confirmed=false){if(p<0)return;const v=view();
 if(ui.mode==='learn'||ui.mode==='practice'){taskClick(p);return;}
 if(ui.mode==='records'){if(v.board[p])inspect(p);else toast('复盘模式不会落子；可以选择“从此处继续”。');return;}
 if(game.status==='scoring'){if(!v.board[p])return;const group=C.group(v.board,v.n,p).stones,dead=new Set(game.dead),remove=dead.has(p);for(const q of group)remove?dead.delete(q):dead.add(q);game.dead=[...dead];saveCurrent();render();return;}
 if(v.board[p]){inspect(p);return;}
 if(game.status!=='playing'){toast('本局已经结束。可复盘或开始新的一局。');return;}
 if(game.opponent==='ai'&&v.next!==game.human){toast('轮到 AI 思考，请观察局面。');return;}
 const r=C.play(v.board,v.n,p,v.next,game.history);if(!r.ok){toast(errorText(r.error));return;}
 if(prefs.confirm&&!confirmed&&ui.pending!==p){ui.pending=p;render();return;}

}
function playMove(p,fromAI=false){const old=C.current(game),color=old.next,r=C.move(game,p);if(!r.ok){toast(errorText(r.error));return false;}
 clearView();if(p>=0){ui.animation={start:performance.now(),p,color,captured:r.captured,old:old.board};sound(!!r.captured.length);}
 if(p===-1)ui.coach=(color===1?'黑方':'白方')+'选择停一手。'+(game.status==='scoring'?'双方连续停一手，进入死子确认与数子阶段。':'还没有连续停两手，对局继续。');
 else if(r.captured.length)ui.coach=(fromAI?'AI':'这一手')+'提走了 '+r.captured.length+' 颗棋子。提子后的空点也会成为周围棋子的气。';
 else if(r.group.libs.size===1)ui.coach='刚落下的这块棋只剩 1 口气，可能被对手提走。检查这是否是必要的弃子，或需要及时补救。';
 else if(r.group.libs.size===2)ui.coach='新落下的棋块有 2 口气。局部接触战中，要留意对方的打吃与自己的退路。';
 else if(game.moves.length<10)ui.coach='布局时兼顾角、边与棋子的间距。不要只追着对方下，也不要急着把自己的空点填满。';
 else ui.coach='轮到'+(C.current(game).next===1?'黑棋':'白棋')+'。先检查双方有没有一口气的棋，再考虑连接、切断和围地。';

}
function fallbackMove(input){let best=null,score=-Infinity;const b=Uint8Array.from(input.board),h=new Set(input.history);for(let p=0;p<b.length;p++)if(!b[p]&&!C.eye(b,input.n,p,input.color)){const r=C.play(b,input.n,p,input.color,h);if(!r.ok)continue;const x=p%input.n,y=Math.floor(p/input.n),edge=Math.min(x,y,input.n-1-x,input.n-1-y);const s=r.captured.length*30+Math.min(r.group.libs.size,5)+(edge===2?3:0)-(r.group.libs.size===1?30:0)+Math.random();if(s>score){score=s;best={p,capture:r.captured.length,libs:r.group.libs.size};}}return {p:best&&score> -10?best.p:-1,iterations:0,ms:0,top:best?[best]:[],fallback:true};}
function scheduleAI(){clearTimeout(aiTimer);if(ui.mode!=='play'||game.status!=='playing'||game.opponent!=='ai'||C.current(game).next===game.human)return;aiTimer=setTimeout(()=>searchAI('move'),200);}
function searchAI(purpose){if(ui.mode!=='play'||game.status!=='playing')return;if(purpose==='hint'&&game.opponent==='ai'&&C.current(game).next!==game.human){toast('请在轮到你时请求提示。');return;}
 cancelAI();const token=request,gid=game.id,moveCount=game.moves.length,s=C.current(game),started=performance.now();ui.busy=purpose;ui.iterations=0;ui.hints=[];
 const input={id:token,board:Array.from(s.board),n:game.n,color:s.next,komi:game.komi,history:[...game.history],level:purpose==='hint'?4:game.level,passes:s.passes,moveCount};
 render();
 const valid=()=>request===token&&ui.mode==='play'&&game.id===gid&&game.moves.length===moveCount;
 function finish(result){if(!valid())return;if(worker)worker.terminate();worker=null;
  const apply=()=>{if(!valid())return;ui.busy=null;ui.iterations=result.iterations;
   if(purpose==='move'){const legal=result.p===-1||C.play(C.current(game).board,game.n,result.p,C.current(game).next,game.history).ok;const choice=legal?result.p:fallbackMove(input).p;playMove(choice,true);}
   else{ui.hints=result.top||[];if(result.p<0)ui.coach='棋伴没有找到有益的落点，建议考虑停一手；这不是专业终局判定。';else{const a=ui.hints[0]||{},why=a.capture?'可以提走 '+a.capture+' 颗对方棋子。':a.rescue?'优先处理被打吃的己方棋块。':a.attack?'能压缩对方的气，制造局部压力。':'兼顾局部气数、连接与后续展开。';ui.coach='建议先看 '+C.coord(result.p,game.n)+'（A）：'+why+'这是本地棋伴的候选建议，不是唯一正确答案。';}render();}
   if(result.fallback)toast('当前浏览器无法启动后台搜索，已使用基础战术兼容模式。');
  };
  const delay=purpose==='move'?Math.max(0,260-(performance.now()-started)):0;aiTimer=setTimeout(apply,delay);
 }
 try{
  if(!workerURL)workerURL=URL.createObjectURL(new Blob([$('#core-source').textContent,'\n',$('#worker-source').textContent],{type:'text/javascript'}));
  worker=new Worker(workerURL);worker.onmessage=e=>{if(!valid())return;const data=e.data;if(data.type==='progress'){ui.iterations=data.iterations;const el=$('#search-status');if(el)el.textContent='正在比较后续 · 已完成 '+data.iterations+' 次模拟';}else if(data.type==='result')finish(data);else if(data.type==='error')finish(fallbackMove(input));};worker.onerror=()=>finish(fallbackMove(input));worker.postMessage(input);
 }catch{finish(fallbackMove(input));}
}
function undoGame(){if(!game.moves.length){toast('还没有可以撤回的落子。');return;}cancelAI();if(game.status==='finished'){archiveData=archiveData.filter(x=>x.id!==game.id);store('yi.archive.v1',archiveData);}

 C.undo(game,amount);clearView();ui.coach='已撤回 '+amount+' 手。重新观察：这次有没有更稳妥的选择？';saveCurrent();render();scheduleAI();
}
function finishScore(){const a=C.area(C.current(game).board,game.n,game.komi,game.dead);game.status='finished';game.result={type:'score',winner:a.difference>0?1:a.difference<0?2:0,difference:a.difference};archive();saveCurrent();render();toast('结果已确认，棋谱已保存在本机。');}
function resumeScoring(){game.status='playing';game.dead=[];game.result=null;clearView();ui.coach='已回到数子前的局面。死活有争议时，继续落子解决；再次连续停两手可重新数子。';saveCurrent();render();scheduleAI();}

 let stars=n===19?[3,9,15]:n===13?[3,9]:n===9?[2,6]:[2,4];const pts=[];for(const x of stars)for(const y of stars)pts.push([x,y]);if(n!==19)pts.push([(n-1)/2,(n-1)/2]);
 c.fillStyle='#6e5738';for(const [x,y]of pts){c.beginPath();c.arc(margin+x*step,margin+y*step,Math.max(1.8,step*.063),0,Math.PI*2);c.fill();}
 if(prefs.coordinates){c.fillStyle='rgba(105,85,56,.7)';c.font=Math.max(8,Math.min(11,w*.021))+'px '+getComputedStyle(document.body).fontFamily;c.textAlign='center';c.textBaseline='middle';for(let i=0;i<n;i++){const q=margin+i*step,label='ABCDEFGHJKLMNOPQRST'[i];c.fillText(label,q,margin*.42);c.fillText(label,q,w-margin*.37);c.fillText(String(n-i),margin*.39,q);c.fillText(String(n-i),w-margin*.38,q);}}

function stone(x,y,r,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor='rgba(67,44,24,.26)';ctx.shadowBlur=r*.27;ctx.shadowOffsetX=r*.08;ctx.shadowOffsetY=r*.16;const g=ctx.createRadialGradient(x-r*.34,y-r*.4,r*.05,x+r*.06,y+r*.08,r*1.1);if(color===1){g.addColorStop(0,'#5b6260');g.addColorStop(.28,'#414846');g.addColorStop(.62,'#272f2d');g.addColorStop(1,'#17201e');}else{g.addColorStop(0,'#fffefa');g.addColorStop(.45,'#f7f6ed');g.addColorStop(.82,'#e6e4d7');g.addColorStop(1,'#c8c8b9');}ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2);ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle=color===1?'rgba(18,31,25,.52)':'rgba(164,159,135,.55)';ctx.lineWidth=.5;ctx.stroke();ctx.restore();}
function drawBoard(){const v=view(),g=geometry(),w=g.w;if(w<1)return;const dpr=Math.min(2,window.devicePixelRatio||1);const px=Math.round(w*dpr);if(canvas.width!==px||canvas.height!==px){canvas.width=px;canvas.height=px;}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,w);ctx.drawImage(boardBackground(w,v.n,dpr),0,0,w,w);
 const {margin,step}=g,r=step*.455,xy=p=>[margin+(p%v.n)*step,margin+Math.floor(p/v.n)*step],dead=new Set(v.dead||[]),t=v.task;
 if(v.area){const a=v.area;for(let p=0;p<v.board.length;p++)if(!a.board[p]&&a.owner[p]){const [x,y]=xy(p),s=Math.max(3,step*.22);ctx.fillStyle=a.owner[p]===1?'rgba(47,65,48,.56)':'rgba(255,254,241,.88)';ctx.strokeStyle='rgba(90,94,62,.27)';ctx.lineWidth=.5;ctx.fillRect(x-s/2,y-s/2,s,s);ctx.strokeRect(x-s/2,y-s/2,s,s);}}
 if(t&&!t.complete)for(const p of t.def.target||[]){const [x,y]=xy(p);ctx.strokeStyle='rgba(68,107,67,.48)';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(x,y,r+3.3,0,Math.PI*2);ctx.stroke();}
 const a=ui.animation,elapsed=a?Math.min(1,(performance.now()-a.start)/190):1;
 if(a&&elapsed<1){for(const p of a.captured){const [x,y]=xy(p);stone(x,y,r,3-a.color,1-elapsed);}}
 for(let p=0;p<v.board.length;p++)if(v.board[p]){const [x,y]=xy(p),scale=a&&a.p===p&&elapsed<1?.77+.23*(1-Math.pow(1-elapsed,3)):1;stone(x,y,r*scale,v.board[p],dead.has(p)?.32:1);
  if(dead.has(p)){ctx.strokeStyle='#9b6149';ctx.lineWidth=Math.max(1.4,r*.1);ctx.beginPath();ctx.moveTo(x-r*.35,y-r*.35);ctx.lineTo(x+r*.35,y+r*.35);ctx.moveTo(x+r*.35,y-r*.35);ctx.lineTo(x-r*.35,y+r*.35);ctx.stroke();}
  else if(prefs.numbers&&v.numbers[p]){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='500 '+Math.min(r*.8,16)+'px '+getComputedStyle(document.body).fontFamily;ctx.fillStyle=v.board[p]===1?'#eeeeda':'#53604a';ctx.fillText(String(v.numbers[p]),x,y+.5);}
  else if(p===v.last){ctx.strokeStyle=v.board[p]===1?'#dcc398':'#9d7545';ctx.lineWidth=Math.max(1.4,r*.08);ctx.beginPath();ctx.arc(x,y,Math.max(2,r*.25),0,Math.PI*2);ctx.stroke();}
 }
 function dot(p,label='',color='#4f7b52',filled=false){const [x,y]=xy(p),rr=step*.18;ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fillStyle=filled?'rgba(54,103,66,.92)':'rgba(235,243,218,.77)';ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=1.3;ctx.stroke();if(label){ctx.fillStyle=filled?'#f2f7e5':color;ctx.font='600 '+Math.max(8,Math.min(13,step*.25))+'px '+getComputedStyle(document.body).fontFamily;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x,y+.5);}}
 if(t){for(const p of t.selected)dot(p,'✓','#5b8050',true);if(!t.complete){for(const m of t.def.markers||[])if(!v.board[m.p])dot(m.p,m.label);if(t.hinted)for(const p of t.def.answers||[])if(!v.board[p]&&!t.selected.has(p))dot(p,'·');}if(t.errorPoint>=0)dot(t.errorPoint,'×','#a7654b');}
 if(ui.selected>=0&&v.board[ui.selected]){const group=C.group(v.board,v.n,ui.selected);for(const p of group.libs)dot(p);for(const p of group.stones){const [x,y]=xy(p);ctx.strokeStyle='#a4bc7a';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(x,y,r*.85,0,Math.PI*2);ctx.stroke();}}
 if(prefs.liberties){for(const group of C.analyze(v.board,v.n).groups){const [x,y]=xy(group.stones[0]),br=Math.max(5,step*.13);ctx.fillStyle=group.libs.size===1?'#a36448':'#6e8955';ctx.beginPath();ctx.arc(x+r*.53,y-r*.56,br,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffed';ctx.font=Math.max(7,step*.18)+'px '+getComputedStyle(document.body).fontFamily;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(group.libs.size),x+r*.53,y-r*.56+.4);}}
 for(let i=0;i<ui.hints.length;i++)if(ui.hints[i].p>=0&&!v.board[ui.hints[i].p])dot(ui.hints[i].p,'ABC'[i],'#4f7546',true);
 const canHover=t?!t.complete&&t.def.type!=='quiz':ui.mode==='play'&&game.status==='playing'&&(game.opponent==='local'||v.next===game.human)&&!ui.busy;
 const hp=ui.pending>=0?ui.pending:ui.hover;
 if(canHover&&hp>=0&&!v.board[hp]){const [x,y]=xy(hp);if(t&&t.def.type==='select'){ctx.strokeStyle='#5f7c4f';ctx.lineWidth=1.5;ctx.strokeRect(x-r*.4,y-r*.4,r*.8,r*.8);}else{const legal=C.play(v.board,v.n,hp,v.next,t?t.history:game.history).ok;stone(x,y,r,v.next,.35);ctx.strokeStyle=legal?'#6b8c55':'#ae684a';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,r*.56,0,Math.PI*2);ctx.stroke();}}
 if(a&&elapsed<1)requestAnimationFrame(drawBoard);else if(a)ui.animation=null;
}
function eventPoint(e){const g=geometry();const x=Math.round((e.clientX-g.rect.left-g.margin)/g.step),y=Math.round((e.clientY-g.rect.top-g.margin)/g.step);if(x<0||x>=g.n||y<0||y>=g.n)return -1;const dx=Math.abs(e.clientX-g.rect.left-g.margin-x*g.step),dy=Math.abs(e.clientY-g.rect.top-g.margin-y*g.step);return dx<=g.step*.5&&dy<=g.step*.5?y*g.n+x:-1;}
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const p=eventPoint(e);if(p!==ui.hover){ui.hover=p;drawBoard();}});
canvas.addEventListener('pointerleave',()=>{ui.hover=-1;drawBoard();});canvas.addEventListener('click',e=>onPoint(eventPoint(e)));
canvas.addEventListener('keydown',e=>{const n=view().n;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();e.stopPropagation();if(ui.hover<0)ui.hover=Math.floor(n*n/2);else{const x=ui.hover%n,y=Math.floor(ui.hover/n),dx=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0,dy=e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0;ui.hover=Math.max(0,Math.min(n-1,y+dy))*n+Math.max(0,Math.min(n-1,x+dx));}drawBoard();$('#board-caption').textContent='键盘选择：'+C.coord(ui.hover,n)+' · 回车确认';}else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();onPoint(ui.hover<0?Math.floor(n*n/2):ui.hover);}});
new ResizeObserver(()=>drawBoard()).observe($('.board-shell'));
function openModal(title,body){const el=$('#modal');el.innerHTML='<div class="modal-head"><h2 id="modal-title">'+title+'</h2><button data-action="close-modal" aria-label="关闭">×</button></div><div class="modal-body">'+body+'</div>';if(!el.open)el.showModal();}
function closeModal(){if($('#modal').open)$('#modal').close();modalCallback=null;}
function confirmModal(title,text,cb){openModal(title,'<p>'+esc(text)+'</p><div class="modal-actions"><button class="btn secondary" data-action="close-modal">取消</button><button class="btn" data-action="modal-confirm">确认</button></div>');modalCallback=cb;}
function newGameModal(){const options=(name,vals,current)=>'<div class="segments">'+vals.map(v=>'<label><input type="radio" name="'+name+'" value="'+v[0]+'" '+(String(current)===String(v[0])?'checked':'')+'><span>'+v[1]+(v[2]?'<small>'+v[2]+'</small>':'')+'</span></label>').join('')+'</div>';
 openModal('为自己，开一局。','<form id="new-game-form"><label class="form-label">选择棋盘</label>'+options('size',[[9,'9 × 9','推荐新手'],[13,'13 × 13','过渡练习'],[19,'19 × 19','完整棋盘']],game.n)+'<label class="form-label">对弈方式</label>'+options('opponent',[['ai','AI 棋伴'],['local','本地双人']],game.opponent)+'<label class="form-label">你的执子（人机模式）</label>'+options('human',[[1,'● 执黑','你先行'],[2,'○ 执白','AI 先行']],game.human)+'<div class="form-row"><div><label class="form-label" for="new-level">棋伴级别</label><select name="level" id="new-level">'+D.levels.map((l,i)=>'<option value="'+(i+1)+'" '+(game.level===i+1?'selected':'')+'>'+l.name+' · '+l.label+'</option>').join('')+'</select></div><div><label class="form-label" for="new-komi">白方贴目（点）</label><select name="komi" id="new-komi">'+[0,.5,5.5,6.5,7.5].map(k=>'<option value="'+k+'" '+(game.komi===k?'selected':'')+'>'+k+' 点</option>').join('')+'</select></div></div><label class="form-check"><input type="checkbox" name="confirm" '+(prefs.confirm?'checked':'')+'>落子前确认一次（小屏幕推荐）</label><p class="fine">采用面积计分、禁止自杀、全局同形禁着。新建时会保留已有对局的本地棋谱。AI 分档不代表真实段级位。</p><button class="btn full" type="submit">落子，启程 '+ico('arrow')+'</button></form>');
}
function about(){openModal('黑白之间的小指南','<p><b>弈 · 棋道初启</b>是一套可离线运行的围棋入门课堂。无需注册、无需 API 密钥，也不会上传棋谱。</p><h3>规则约定</h3><p>棋子落在交叉点，黑先白后。先提掉对方零气棋块，再判断自己的棋是否有气。本项目禁止自杀落子，采用“落子后不能重复任何历史棋盘”的全局同形规则；停一手始终允许。</p><p>双方连续停一手后进入数子阶段：你先标记整块死子，再确认结果。按盘上活子 + 围住的空点计分，白方加所设贴目；中立空点不计分，提子不额外加分。这是明确约定的教学面积规则，不宣称覆盖全部赛事裁判细则。</p><h3>五档棋伴</h3><p>前两档采用带随机性的战术启发式。后三档使用战术引导的蒙特卡洛树搜索、有限深度模拟与手工局面估值；搜索次数 / 时间上限逐档增加。候选会剪枝，仍可能漏算复杂死活、劫争或征子。</p><p>它们没有经过段级位测评，不是 KataGo、AlphaGo 或职业级棋力。提示只是候选建议，不提供伪装成专业评估的胜率。浏览器禁止 Web Worker 时会明确提示降级为基础战术兼容模式。</p><h3>操作与存档</h3><p>点击空点落子，点击已有棋子查看整块棋的气。开启“看气”会显示每个棋块的气数；“手数”显示仍在盘上的落子编号。手机可开启“确认落子”。键盘聚焦棋盘后，方向键选择、回车确认。</p><p>对局与学习进度保存到当前浏览器。可导出 JSON 完整对局存档，或导出 SGF 主线棋谱。SGF 导入只取第一主变化；不支持中途改摆棋子、压缩坐标与多局合集，数值胜负不会被当作已核验结果。JSON 保存死子标记，SGF 不保存这些标记。</p><h3>规则与算法参考</h3><p><a href="https://www.britgo.org/intro/intro2.html" target="_blank" rel="noopener noreferrer">英国围棋协会：基础规则、气、眼与劫</a><br><a href="https://link.springer.com/chapter/10.1007/11871842_29" target="_blank" rel="noopener noreferrer">Kocsis &amp; Szepesvári：Bandit Based Monte-Carlo Planning</a></p><p class="fine">教学题形和界面为本项目编写。基础规则介绍与计分制度要区分：本项目采用上文明确的面积计分，而不是把参考页面的提子计分混用进来。</p>');}
function exportGame(format){const g=shownGame(),text=format==='sgf'?C.toSGF(g):JSON.stringify(C.pack(g),null,2),blob=new Blob([text],{type:format==='sgf'?'application/x-go-sgf;charset=utf-8':'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='弈棋_'+g.n+'路_'+new Date().toISOString().slice(0,10)+'.'+format;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('已生成'+(format==='sgf'?' SGF 主线棋谱。':'完整对局存档。'));}
function openRecord(id){cancelAI();stopAutoplay();try{ui.reviewGame=id===game.id?C.unpack(C.pack(game)):C.unpack(archiveData.find(a=>a.id===id));ui.mode='records';ui.reviewIndex=ui.reviewGame.moves.length;clearView();render();}catch{toast('这个本地棋谱无法读取。');}}
function branch(){confirmModal('从这一手，重新出发','将从当前复盘位置创建一个新对局，原来的当前对局会存入本地棋谱。你可以在新局中尝试不同下法。',()=>{cancelAI();stopAutoplay();archive();const data=C.pack(shownGame());data.moves=data.moves.slice(0,ui.reviewIndex);data.status='playing';data.dead=[];data.result=null;data.id='branch-'+Date.now().toString(36);data.created=new Date().toISOString();game=C.unpack(data);game.status='playing';ui.mode='play';clearView();ui.coach='这是从第 '+ui.reviewIndex+' 手开始的新分支。试试看，这次会走向怎样的局面？';saveCurrent();render();scheduleAI();});}
function reviewStep(action){const max=shownGame().moves.length;ui.reviewIndex=action==='first'?0:action==='last'?max:Math.max(0,Math.min(max,ui.reviewIndex+(action==='prev'?-1:1)));clearView();render();}
function action(name){switch(name){
 case 'home':changeMode('learn');break;
 case 'new-game':newGameModal();break;
 case 'about':about();break;
 case 'close-modal':closeModal();break;
 case 'modal-confirm':{const fn=modalCallback;closeModal();if(fn)fn();break;}
 case 'next-task':if(ui.mode==='learn'&&ui.lesson===7)newGameModal();else startTask(ui.mode,ui.mode==='learn'?ui.lesson+1:(ui.puzzle+1)%12);break;
 case 'previous-task':startTask(ui.mode,(ui.mode==='learn'?ui.lesson:ui.puzzle)-1);break;
 case 'reset-task':startTask(ui.mode,ui.mode==='learn'?ui.lesson:ui.puzzle);break;
 case 'task-hint':task().hinted=true;render();break;
 case 'hint':searchAI('hint');break;
 case 'undo':undoGame();break;
 case 'pass':if(game.status==='playing'&&(game.opponent==='local'||C.current(game).next===game.human)&&!ui.busy)playMove(-1);break;
 case 'resign':confirmModal('确定认输吗？','本局将结束并存入本地棋谱。也可以取消，继续寻找机会。',()=>{cancelAI();game.result={type:'resign',winner:3-(game.opponent==='ai'?game.human:C.current(game).next)};game.status='finished';game.dead=[];archive();saveCurrent();clearView();render();});break;
 case 'score':enterScoring();break;
 case 'confirm-score':finishScore();break;
 case 'resume-score':resumeScoring();break;
 case 'confirm-move':{const p=ui.pending;ui.pending=-1;onPoint(p,true);break;}
 case 'cancel-move':ui.pending=-1;render();break;
 case 'export-json':exportGame('json');break;
 case 'export-sgf':exportGame('sgf');break;
 case 'import':$('#import-file').click();break;
 case 'branch':branch();break;
 case 'autoplay':if(autoplayTimer)stopAutoplay();else{if(ui.reviewIndex>=shownGame().moves.length)ui.reviewIndex=0;autoplayTimer=setInterval(()=>{if(ui.mode!=='records'||ui.reviewIndex>=shownGame().moves.length){stopAutoplay();renderBoardMeta();return;}reviewStep('next');},800);}renderBoardMeta();break;
}}
document.addEventListener('click',e=>{const el=e.target.closest('button,a[data-action]');if(!el||el.disabled)return;
 if(el.dataset.mode){changeMode(el.dataset.mode);return;}
 if(el.dataset.action){e.preventDefault();action(el.dataset.action);return;}

 if(el.dataset.level){cancelAI();game.level=Number(el.dataset.level);ui.coach='已切换到棋伴“'+D.levels[game.level-1].name+'”。'+D.levels[game.level-1].method+'；不对应真实段级位。';saveCurrent();render();scheduleAI();return;}
 if(el.dataset.pref){const p=el.dataset.pref;prefs[p]=!prefs[p];store('yi.prefs.v1',prefs);if(p==='confirm')ui.pending=-1;render();return;}

 if(el.dataset.record){openRecord(el.dataset.record);return;}
 if(el.dataset.move){if(ui.mode!=='records'){cancelAI();ui.reviewGame=C.unpack(C.pack(game));ui.mode='records';}stopAutoplay();clearView();ui.reviewIndex=Number(el.dataset.move);render();return;}
 if(el.dataset.review){stopAutoplay();reviewStep(el.dataset.review);return;}
});
document.addEventListener('submit',e=>{if(e.target.id!=='new-game-form')return;e.preventDefault();const f=new FormData(e.target);cancelAI();stopAutoplay();archive();game=C.createGame({n:Number(f.get('size')),human:Number(f.get('human')),komi:Number(f.get('komi')),level:Number(f.get('level')),opponent:f.get('opponent')});prefs.confirm=f.has('confirm');store('yi.prefs.v1',prefs);ui.mode='play';clearView();ui.coach='先观察，再落子。'+(game.opponent==='local'?'这是本地双人对局，请黑白双方交替操作。':'你执'+(game.human===1?'黑棋先行。':'白棋，棋伴会先落下黑棋。'));closeModal();saveCurrent();render();scheduleAI();});

$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>2000000){toast('文件超过 2 MB，无法导入。');return;}try{const text=await file.text();const isSGF=/\.sgf$/i.test(file.name)||text.trim().startsWith('(');const parsed=isSGF?C.fromSGF(text):C.unpack(JSON.parse(text));const imported=C.unpack(C.pack(parsed));cancelAI();stopAutoplay();archive();game=imported;ui.mode='records';ui.reviewGame=C.unpack(C.pack(game));ui.reviewIndex=game.moves.length;clearView();saveCurrent();render();toast(isSGF?'已导入 SGF 第一主变化，并按本项目规则校验。数值结果请重新确认。':'已导入完整对局存档。');}catch(error){toast('导入失败：'+String(error.message||error));}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});

document.addEventListener('keydown',e=>{if($('#modal').open||['INPUT','SELECT','TEXTAREA','CANVAS'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(ui.mode==='records'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();stopAutoplay();reviewStep(e.key==='ArrowLeft'?'prev':'next');}});
