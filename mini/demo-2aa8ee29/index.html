<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小球战争 · 极速 · 特效增强版</title>
    <style>
        * {
            margin: 0;
            padding: 0
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            image-rendering: auto;
            z-index: 1
        }
        #bar {
            position: fixed;
            bottom: 6px;
            left: 6px;
            right: 6px;
            z-index: 10;
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap
        }
        .btn {
            padding: 8px 12px;
            min-width: 42px;
            min-height: 38px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            background: rgba(15, 15, 35, 0.9);
            color: #bbc;
            font-size: 13px;
            touch-action: manipulation;
            flex: 0 1 auto;
            cursor: pointer
        }
        .btn.on {
            background: rgba(60, 110, 220, 0.7);
            color: #fff;
            border-color: rgba(100, 150, 255, 0.8)
        }
        .btn.vs {
            background: rgba(200, 80, 60, 0.7);
            color: #fff;
            border-color: rgba(255, 120, 80, 0.8)
        }
        .btn.spd {
            background: rgba(80, 160, 80, 0.7);
            color: #fff;
            border-color: rgba(100, 200, 100, 0.8)
        }
        .btn.hd {
            background: rgba(200, 180, 60, 0.7);
            color: #fff;
            border-color: rgba(255, 220, 80, 0.8)
        }
        #typeBar {
            position: fixed;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 12px;
            border-radius: 20px;
            max-width: 88vw;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none
        }
        #typeBar::-webkit-scrollbar {
            display: none
        }
        .tbtn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(20, 20, 40, 0.8);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            scroll-snap-align: center;
            touch-action: manipulation
        }
        .tbtn.on {
            border-color: #fff;
            background: rgba(60, 110, 220, 0.6);
            box-shadow: 0 0 12px rgba(100, 150, 255, 0.5)
        }
        #info {
            position: fixed;
            top: 62px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8)
        }
        #speed-slider-wrap {
            position: fixed;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 18px 10px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(2px);
            pointer-events: auto
        }
        #speed-slider-wrap label {
            color: #ccc;
            font-size: 13px
        }
        #speed-slider {
            width: 140px;
            height: 4px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #4a7, #adf);
            border-radius: 4px;
            outline: none
        }
        #speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(100, 180, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3)
        }
        #speed-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none
        }
        #speed-label {
            color: #fff;
            font-weight: bold;
            min-width: 32px;
            text-align: center;
            font-size: 15px
        }
        @media (max-width:500px) {
            #speed-slider {
                width: 100px
            }
            #speed-slider-wrap {
                padding: 4px 12px 8px;
                gap: 8px
            }
        }
        .tbtn:active,
        .btn:active {
            transform: scale(0.94)
        }
        #vs-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 12px 8px 8px;
            box-sizing: border-box;
            overflow-y: auto;
            color: #eee
        }
        #vs-overlay.active {
            display: flex
        }
        #vs-title {
            font-size: 26px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 30px rgba(255, 180, 80, 0.5);
            margin: 4px 0 10px;
            letter-spacing: 2px
        }
        #vs-close {
            position: absolute;
            top: 10px;
            right: 16px;
            font-size: 30px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            background: none;
            border: none;
            touch-action: manipulation
        }
        #vs-close:hover {
            color: #fff
        }
        #vs-mode-row {
            display: flex;
            gap: 12px;
            margin: 6px 0 12px;
            flex-wrap: wrap;
            justify-content: center
        }
        .vs-mode-btn {
            padding: 8px 22px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(30, 30, 60, 0.7);
            color: #bbc;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.2s;
            min-width: 70px;
            text-align: center
        }
        .vs-mode-btn.on {
            background: rgba(60, 150, 220, 0.6);
            border-color: #6af;
            color: #fff;
            box-shadow: 0 0 24px rgba(60, 150, 220, 0.3)
        }
        .vs-mode-btn:active {
            transform: scale(0.94)
        }
        #vs-teams {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 700px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 4px 0 8px
        }
        .vs-team {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 10px 14px 14px;
            min-width: 120px;
            flex: 1 1 auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center
        }
        .vs-team-label {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px
        }
        .vs-team-slots {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 52px
        }
        .vs-slot {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
            position: relative
        }
        .vs-slot.filled {
            border-style: solid;
            border-color: rgba(255, 200, 100, 0.6);
            background: rgba(255, 200, 100, 0.12)
        }
        .vs-slot.active {
            border-color: #ffaa44;
            box-shadow: 0 0 20px rgba(255, 170, 68, 0.4);
            background: rgba(255, 170, 68, 0.15)
        }
        .vs-slot .slot-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255, 50, 50, 0.8);
            color: #fff;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: none
        }
        .vs-slot.filled .slot-remove {
            display: block
        }
        #vs-free-pool {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 52px;
            padding: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            max-width: 500px;
            margin: 0 auto
        }
        #vs-free-pool .pool-item {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            cursor: default
        }
        #vs-free-pool .pool-item .pool-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255, 50, 50, 0.8);
            color: #fff;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.3)
        }
        #vs-type-picker {
            margin: 6px 0 10px;
            width: 100%;
            max-width: 600px
        }
        #vs-type-picker .picker-label {
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-bottom: 4px
        }
        #vs-type-picker .picker-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center
        }
        #vs-type-picker .picker-btns .tbtn {
            width: 40px;
            height: 40px;
            font-size: 20px;
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(20, 20, 40, 0.6)
        }
        #vs-type-picker .picker-btns .tbtn.on {
            border-color: #ffaa44;
            background: rgba(255, 170, 68, 0.25);
            box-shadow: 0 0 16px rgba(255, 170, 68, 0.3)
        }
        #vs-start-btn {
            padding: 10px 40px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, #f90, #f60);
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 0 40px rgba(255, 150, 0, 0.3);
            transition: all 0.2s;
            margin: 4px 0 6px;
            letter-spacing: 2px
        }
        #vs-start-btn:active {
            transform: scale(0.94)
        }
        #vs-start-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none
        }
        @media (max-width:480px) {
            #vs-title {
                font-size: 20px
            }
            .vs-mode-btn {
                font-size: 15px;
                padding: 6px 16px;
                min-width: 56px
            }
            .vs-slot {
                width: 40px;
                height: 40px;
                font-size: 20px
            }
            #vs-type-picker .picker-btns .tbtn {
                width: 34px;
                height: 34px;
                font-size: 16px
            }
            #vs-start-btn {
                font-size: 18px;
                padding: 8px 28px
            }
            .vs-team {
                padding: 6px 8px 10px;
                min-width: 80px
            }
            #vs-teams {
                gap: 10px
            }
        }
        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            background: transparent;
            mix-blend-mode: screen;
        }
        #flash-color-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            background: transparent;
            mix-blend-mode: screen;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="flash-overlay"></div>
    <div id="flash-color-overlay"></div>
    <div id="typeBar">
        <button class="tbtn" id="t0">🔴</button>
        <button class="tbtn" id="t1">🔵</button>
        <button class="tbtn" id="t2">⚪</button>
        <button class="tbtn on" id="t3">😡</button>
        <button class="tbtn" id="t4">🤠</button>
        <button class="tbtn" id="t5">😐</button>
        <button class="tbtn" id="t6">🕷</button>
        <button class="tbtn" id="t7">🐲</button>
        <button class="tbtn" id="t8">😭</button>
        <button class="tbtn" id="t9">🤫</button>
        <button class="tbtn" id="t10">🤯</button>
        <button class="tbtn" id="t11">🤕</button>
        <button class="tbtn" id="t12">😏</button>
        <button class="tbtn" id="t13">😔</button>
        <button class="tbtn" id="t14">🤖</button>
        <button class="tbtn" id="t15">😈</button>
        <button class="tbtn" id="t16">🐱</button>
        <button class="tbtn" id="t17">👑</button>
        <button class="tbtn" id="t19">🎭</button>
    </div>
    <div id="info"></div>
    <div id="speed-slider-wrap">
        <label>🐢</label>
        <input type="range" id="speed-slider" min="0.5" max="5.0" step="0.1" value="1.0">
        <span id="speed-label">1.0x</span>
        <label>🐇</label>
    </div>
    <div id="bar">
        <button class="btn vs" id="b1">⚔ VS</button>
        <button class="btn" id="b2">清除</button>
        <button class="btn" id="b3">重置</button>
        <button class="btn spd" id="b5">倍速</button>
        <button class="btn" id="b6">暂停</button>
        <button class="btn hd on" id="b7">高清</button>
    </div>
    <div id="vs-overlay">
        <button id="vs-close">✕</button>
        <div id="vs-title">⚔ 对战设置</div>
        <div id="vs-mode-row">
            <button class="vs-mode-btn" data-mode="1v1">1v1</button>
            <button class="vs-mode-btn on" data-mode="2v2">2v2</button>
            <button class="vs-mode-btn" data-mode="混战">混战</button>
        </div>
        <div id="vs-teams">
            <div class="vs-team" id="vs-team-left">
                <div class="vs-team-label">🔴 左队</div>
                <div class="vs-team-slots" id="vs-slots-left"></div>
            </div>
            <div class="vs-team" id="vs-team-right">
                <div class="vs-team-label">🔵 右队</div>
                <div class="vs-team-slots" id="vs-slots-right"></div>
            </div>
        </div>
        <div id="vs-free-pool-wrap" style="display:none; width:100%; max-width:500px;">
            <div style="font-size:13px;color:#888;text-align:center;margin-bottom:4px;">🎲 混战池</div>
            <div id="vs-free-pool"></div>
        </div>
        <div id="vs-type-picker">
            <div class="picker-label">👇 点击选择球型 (点击槽位填入)</div>
            <div class="picker-btns" id="vs-picker-btns"></div>
        </div>
        <button id="vs-start-btn">⚡ 开始对战</button>
    </div>

    <script>
        (function() {
            // ===== 全局闪光（增强版） =====
            var flashOverlay = document.getElementById('flash-overlay');
            var flashColorOverlay = document.getElementById('flash-color-overlay');
            var flashAlpha = 0;
            var flashTarget = 0;
            var flashDecay = 0.86;
            var cFlashAlpha = 0;
            var cFlashTarget = 0;
            var cFlashColor = '255,150,40';
            var flashEffects = [];

            function hexToRgba(hex, a) {
                if (!hex) return 'rgba(255,255,255,' + a + ')';
                if (hex.indexOf('rgba') === 0 || hex.indexOf('rgb') === 0) return hex;
                hex = hex.replace('#', '');
                if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
                var n = parseInt(hex, 16);
                return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
            }

            function triggerFlash(intensity, color) {
                flashTarget = Math.min(1, Math.max(0, intensity));
                flashAlpha = Math.max(flashAlpha, flashTarget);
                if (color) {
                    cFlashTarget = Math.min(1, Math.max(0, intensity * 0.8));
                    cFlashAlpha = Math.max(cFlashAlpha, cFlashTarget);
                    cFlashColor = color;
                }
                flashOverlay.style.background = 'rgba(255,255,255,' + Math.min(1, flashAlpha) + ')';
                flashColorOverlay.style.background = 'rgba(' + cFlashColor + ',' + Math.min(1, cFlashAlpha) + ')';
            }

            function updateFlash() {
                flashAlpha *= flashDecay;
                if (flashAlpha < 0.002) flashAlpha = 0;
                cFlashAlpha *= 0.9;
                if (cFlashAlpha < 0.002) cFlashAlpha = 0;
                if (flashTarget > 0.01) flashTarget *= 0.95;
                if (flashTarget < 0.001) flashTarget = 0;
                if (flashAlpha > 0 || flashOverlay._glowActive) {
                    flashOverlay.style.background = 'rgba(255,255,255,' + Math.min(1, flashAlpha) + ')';
                    flashOverlay._glowActive = flashAlpha > 0;
                }
                if (cFlashAlpha > 0 || flashColorOverlay._glowActive) {
                    flashColorOverlay.style.background = 'rgba(' + cFlashColor + ',' + Math.min(1, cFlashAlpha) + ')';
                    flashColorOverlay._glowActive = cFlashAlpha > 0;
                }
            }

            function addFlash(x, y, radius, color, durationMs, rays) {
                if (flashEffects.length > 40) flashEffects.splice(0, flashEffects.length - 40);
                flashEffects.push({
                    x: x,
                    y: y,
                    radius: radius,
                    timer: durationMs || 300,
                    maxTimer: durationMs || 300,
                    color: color || '#ffffff',
                    rays: rays !== undefined ? rays : 0
                });
            }

            function updateFlashEffects(dt) {
                for (var i = flashEffects.length - 1; i >= 0; i--) {
                    var f = flashEffects[i];
                    f.timer -= dt;
                    if (f.timer <= 0) flashEffects.splice(i, 1);
                }
            }

            function drawFlashEffects() {
                if (flashEffects.length === 0) return;
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                for (var i = 0; i < flashEffects.length; i++) {
                    var f = flashEffects[i];
                    var prog = 1 - f.timer / f.maxTimer;
                    var a = Math.max(0, 1 - prog);
                    if (a <= 0.01) continue;
                    var r = f.radius * (0.3 + 0.7 * prog);
                    var grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
                    grad.addColorStop(0, 'rgba(255,255,255,' + (a * 0.95) + ')');
                    grad.addColorStop(0.35, hexToRgba(f.color, a * 0.55));
                    grad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, r, 0, 6.28318);
                    ctx.fillStyle = grad;
                    ctx.fill();
                }
                ctx.restore();
            }

            // ===== 性能优化：预渲染光晕精灵 =====
            var GLOW_SPRITE_SIZE = 64;
            var WHITE_GLOW = null;

            function makeGlowSprite() {
                if (WHITE_GLOW) return WHITE_GLOW;
                var c = document.createElement('canvas');
                c.width = GLOW_SPRITE_SIZE;
                c.height = GLOW_SPRITE_SIZE;
                var g = c.getContext('2d');
                var grad = g.createRadialGradient(GLOW_SPRITE_SIZE / 2, GLOW_SPRITE_SIZE / 2, 0, GLOW_SPRITE_SIZE / 2, GLOW_SPRITE_SIZE / 2, GLOW_SPRITE_SIZE / 2);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.25, 'rgba(255,255,255,0.55)');
                grad.addColorStop(0.6, 'rgba(255,255,255,0.12)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                g.fillStyle = grad;
                g.fillRect(0, 0, GLOW_SPRITE_SIZE, GLOW_SPRITE_SIZE);
                WHITE_GLOW = c;
                return c;
            }

            function drawGlowParticle(x, y, r, color, alpha) {
                if (!WHITE_GLOW) makeGlowSprite();
                var size = r * 4;
                ctx.globalAlpha = alpha;
                ctx.drawImage(WHITE_GLOW, x - size / 2, y - size / 2, size, size);
                ctx.globalAlpha = alpha * 0.85;
                ctx.fillStyle = color || '#ffffff';
                ctx.beginPath();
                ctx.arc(x, y, Math.max(0.5, r * 0.7), 0, 6.28318);
                ctx.fill();
            }

            var audioCtx = null;

            function initAudio() {
                try {
                    if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume()
                } catch (e) {}
            }

            function playSound(type, volume) {
                try {
                    initAudio();
                    if (!audioCtx) return;
                    var now = audioCtx.currentTime,
                        vol = volume !== undefined && volume !== null ? Math.max(0, Math.min(1, volume)) : 1,
                        osc, gain, noiseSrc, noiseGain, buf;
                    switch (type) {
                        case 'hit':
                            osc = audioCtx.createOscillator();
                            gain = audioCtx.createGain();
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(180 + Math.random() * 60, now);
                            gain.gain.setValueAtTime(0.15 * vol, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                            osc.start(now);
                            osc.stop(now + 0.08);
                            break;
                        case 'shoot':
                            osc = audioCtx.createOscillator();
                            gain = audioCtx.createGain();
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.type = 'sine';

            function updateBombBall(b, dt, moveMul) {
                b.x += b.vx * moveMul;
                b.y += b.vy * moveMul;
                var bounced = false;
                if (b.x - b.r < bx) { b.x = bx + b.r;
                    b.vx = Math.abs(b.vx) * 0.85;
                    bounced = true }
                if (b.x + b.r > bx + bw) { b.x = bx + bw - b.r;
                    b.vx = -Math.abs(b.vx) * 0.85;
                    bounced = true }
                if (b.y - b.r < by) { b.y = by + b.r;
                    b.vy = Math.abs(b.vy) * 0.85;
                    bounced = true }
                if (b.y + b.r > by + bh) { b.y = by + bh - b.r;
                    b.vy = -Math.abs(b.vy) * 0.85;
                    bounced = true }
                b.vx *= 0.998;
                b.vy *= 0.998;
                b.fuseTime -= dt;
                if (b.fuseTime <= 0) {
                    explodeBombBall(b);
                    return;
                }
                var speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                var accel = Math.sqrt(Math.pow(b.vx - b.prevVx, 2) + Math.pow(b.vy - b.prevVy, 2)) / (dt || 1);
                var stretchFactor = Math.min(0.3, speed * 0.012 / SCALE);
                var squishFactor = Math.min(0.2, accel * 0.0008 / SCALE);
                var angle = Math.atan2(b.vy, b.vx);
                if (speed > 0.3 * SCALE) {
                    var cosA = Math.cos(angle),
                        sinA = Math.sin(angle);
                    var sx = 1 + (stretchFactor * 1.2) * Math.abs(cosA) - (squishFactor * 0.6) * Math.abs(sinA);
                    var sy = 1 + (stretchFactor * 1.2) * Math.abs(sinA) - (squishFactor * 0.6) * Math.abs(cosA);
                    b.targetScaleX = Math.max(0.7, Math.min(1.3, sx));
                    b.targetScaleY = Math.max(0.7, Math.min(1.3, sy));
                } else {
                    b.targetScaleX = 1;
                    b.targetScaleY = 1;
                }
                b.scaleX += (b.targetScaleX - b.scaleX) * 0.15;
                b.scaleY += (b.targetScaleY - b.scaleY) * 0.15;
                b.prevVx = b.vx;
                b.prevVy = b.vy;
            }

            function updateMimic(ball, dt) {
                if (ball.originalType !== MIMIC_TYPE_INDEX && !ball.isMimic) return;

                if (ball.mimicState === undefined) ball.mimicState = 0;
                if (ball.mimicTarget === undefined) ball.mimicTarget = -1;

                ball.mimicTimer -= dt;
                if (ball.mimicTimer <= 0) {
                    if (ball.mimicState === 0) {
                        ball.mimicState = 1;
                        ball.mimicTimer = 6000;
                        var candidates = [];
                        for (var i = 0; i < TYPES.length; i++) {
                            if (i === ball.originalType) continue;
                            if (i === KING_TYPE_INDEX || i === GUARD_TYPE_INDEX) continue;
                            if (i === 0 || i === 1 || i === 2) continue;
                            candidates.push(i);
                        }
                        if (candidates.length === 0) {
                            ball.mimicState = 0;
                            ball.mimicTimer = 0;
                            return;
                        }
                        var targetIdx = candidates[Math.floor(Math.random() * candidates.length)];
                        ball.mimicTarget = targetIdx;
                        if (!ball._origColor) ball._origColor = ball.color;
                        if (!ball._origEmoji) ball._origEmoji = ball.emoji;
                        if (!ball._origAttack) ball._origAttack = ball.attack;
                        if (!ball._origWeaponEmoji) ball._origWeaponEmoji = ball.weaponEmoji;
                        if (!ball._origHp) ball._origHp = ball.hp;
                        if (!ball._origMaxHp) ball._origMaxHp = ball.maxHp;
                        applyMimicTransform(ball, targetIdx);
                    } else {
                        ball.mimicTimer = 6000;
                        var candidates2 = [];
                        for (var i = 0; i < TYPES.length; i++) {
                            if (i === ball.originalType) continue;
                            if (i === KING_TYPE_INDEX || i === GUARD_TYPE_INDEX) continue;
                            if (i === 0 || i === 1 || i === 2) continue;
                            candidates2.push(i);
                        }
                        if (candidates2.length === 0) {
                            ball.mimicTimer = 6000;
                            return;
                        }
                        var targetIdx2 = candidates2[Math.floor(Math.random() * candidates2.length)];
                        ball.mimicTarget = targetIdx2;
                        applyMimicTransform(ball, targetIdx2);
                    }
                }
            }

            function applyMimicTransform(ball, targetIdx) {
                var totalEffective = ball.hp + (ball.revives || 0) * 11;
                if (totalEffective < 1) totalEffective = 1;

                if (!ball._origColor) {
                    ball._origColor = ball.color;
                    ball._origEmoji = ball.emoji;
                    ball._origAttack = ball.attack;
                    ball._origWeaponEmoji = ball.weaponEmoji;
                    ball._origHp = ball.hp;
                    ball._origMaxHp = ball.maxHp;
                }

                ball.type = targetIdx;
                ball.color = TYPES[targetIdx].color;

                // ========== 绘制 ==========

                ctx.strokeStyle = 'rgba(255,255,255,0.02)';

                for (i = 0; i < projectiles.length; i++) {

                        for (var t = 0; t <= L; t += L / steps) {

                        var grad = ctx.createLinearGradient(0, 0, L * dirx, L * diry);
                        grad.addColorStop(0, 'rgba(200,240,255,0.0)');
                        grad.addColorStop(0.2, 'rgba(200,240,255,0.8)');
                        grad.addColorStop(0.6, 'rgba(255,255,255,0.95)');
                        grad.addColorStop(1, 'rgba(200,240,255,0.0)');

                    }
                    if (p.sniper) {

                        if (p.trail && p.trail.length > 2) {

                            for (var ti3 = 0; ti3 < trailLen - 1; ti3++) {

                                var progress = ti3 / trailLen;

                            }
                            var last = p.trail[trailLen - 1];
                            if (last) {
                                ctx.beginPath();
                                ctx.arc(last.x, last.y, p.r * 0.8, 0, Math.PI * 2);

                            }
                        }
                    } else {
                        var isYellow = p.owner && (p.owner.type === 4) && !p.knife && !p.bomb && !p.rocket && !p.isWeb && !p
                            .web && !p.rain;
                        if (isYellow) {
                            if (p.trail && p.trail.length > 1) {
                                var trailLen = p.trail.length;
                                for (var ti3 = 0; ti3 < trailLen - 1; ti3++) {
                                    var tpos = p.trail[ti3];
                                    var tposNext = p.trail[ti3 + 1];
                                    var progress = ti3 / trailLen;

                            ctx.lineWidth = 1 * SCALE;

                        } else if (p.bomb) {

                        swGrad.addColorStop(0.3, 'rgba(255,255,220,0.3)');

                        if (prog < 0.6) {
                            var innerR = r2 * (0.2 + 0.3 * (prog / 0.6));

                            ctx.strokeStyle = 'rgba(255,255,200,' + (0.6 * (1 - prog / 0.6)) + ')';

                        }
                        var coreR2 = r2 * 0.15 * (1 + 0.5 * (1 - prog));

                        coreGrad2.addColorStop(0, 'rgba(255,255,255,0.9)');

                        coreGrad2.addColorStop(1, 'rgba(255,180,80,0)');
                        ctx.beginPath();
                        ctx.arc(be.x, be.y, coreR2, 0, 6.28318);
                        ctx.fillStyle = coreGrad2;
                        ctx.fill();
                        ctx.globalAlpha = alpha2 * 0.9;
                        ctx.font = Math.floor(18 * SCALE + 14 * SCALE * (1 - prog)) + 'px Arial';

                    } else {

                for (i = 0; i < balls.length; i++) {

                        for (bi3 = 0; bi3 < 3; bi3++) {

                    }
                    if (b.swipeActive && b.attack && (b.attack.type === 'swipe' || b.attack.type === 'knife' || b.attack

                        sa = b.attack.type === 'knife' ? b.attack.swipe : b.attack;
                        range3 = sa.range;
                        if (b.type === CLAW_TYPE_INDEX && b.attack.type === 'claw') {
                            // 😈 爪击绘制（保留全部光晕）
                            var halfAngClaw = sa.angleDeg / 2 * Math.PI / 180;
                            var startAngleClaw = b.attackFacing - halfAngClaw;
                            var endAngleClaw = b.swipeAngle;
                            var totalAngleClaw = sa.angleDeg * Math.PI / 180;
                            var progressClaw = Math.abs(endAngleClaw - startAngleClaw) / totalAngleClaw;
                            if (progressClaw > 1) progressClaw = 1;
                            if (progressClaw < 0) progressClaw = 0;

                            var clawConfigs = [
                                { offset: -18 * Math.PI / 180, scale: 0.9 },

                                { offset: 18 * Math.PI / 180, scale: 0.9 }
                            ];
                            var baseWidth = 3 * SCALE;

                            for (var ciClaw = 0; ciClaw < clawConfigs.length; ciClaw++) {
                                var cfg = clawConfigs[ciClaw];
                                var offsetClaw = cfg.offset;
                                var scaleClaw = cfg.scale;
                                var startR = sa.range * scaleClaw;
                                var endR = sa.range * scaleClaw;
                                var lineStartAngle = startAngleClaw + offsetClaw;
                                var lineEndAngle = endAngleClaw + offsetClaw;

                                if (progressClaw <= 0) continue;

                                ctx.save();
                                ctx.shadowColor = 'rgba(255,0,0,0.6)';
                                ctx.shadowBlur = 15 * SCALE;
                                ctx.strokeStyle = '#ff3333';
                                ctx.lineCap = 'round';
                                ctx.lineJoin = 'round';

                                for (var seg = 0; seg < segments; seg++) {
                                    var t0 = seg / segments;
                                    var t1 = (seg + 1) / segments;
                                    var u0 = t0 * progressClaw;
                                    var u1 = t1 * progressClaw;

                                    function getWidthMul(u) {
                                        if (u < 0.2) {
                                            return 0.4 + (1.2 - 0.4) * (u / 0.2);
                                        } else if (u < 0.4) {
                                            return 1.2;
                                        } else if (u < 0.7) {
                                            return 1.2 - (1.2 - 0.9) * ((u - 0.4) / 0.3);
                                        } else {
                                            return 0.9 - (0.9 - 0.3) * ((u - 0.7) / 0.3);
                                        }
                                    }
                                    var wMul0 = getWidthMul(u0);
                                    var wMul1 = getWidthMul(u1);
                                    var avgWidth = (baseWidth * (wMul0 + wMul1)) / 2;

                                    var angle0 = lineStartAngle + u0 * (lineEndAngle - lineStartAngle);
                                    var angle1 = lineStartAngle + u1 * (lineEndAngle - lineStartAngle);
                                    var r0 = startR + (endR - startR) * u0;
                                    var r1 = startR + (endR - startR) * u1;
                                    var x0 = b.x + Math.cos(angle0) * r0;
                                    var y0 = b.y + Math.sin(angle0) * r0;
                                    var x1 = b.x + Math.cos(angle1) * r1;
                                    var y1 = b.y + Math.sin(angle1) * r1;

                                    ctx.beginPath();
                                    ctx.moveTo(x0, y0);
                                    ctx.lineTo(x1, y1);
                                    ctx.lineWidth = avgWidth;
                                    ctx.stroke();
                                }
                                ctx.restore();

                                for (var pIdx = 0; pIdx < 5; pIdx++) {
                                    var uRand = Math.random() * progressClaw;
                                    var angleRand = lineStartAngle + uRand * (lineEndAngle - lineStartAngle);
                                    var rRand = startR + (endR - startR) * uRand;
                                    var pxRand = b.x + Math.cos(angleRand) * rRand;
                                    var pyRand = b.y + Math.sin(angleRand) * rRand;
                                    createSplash(pxRand, pyRand, '#ff4444', 2, 1.5 * SCALE, 1.5 * SCALE, Math
                                        .random() * 2 * Math.PI, 30);
                                }
                                var endAngleLine = lineEndAngle;
                                var endRLine = endR;
                                var pxEnd = b.x + Math.cos(endAngleLine) * endRLine;
                                var pyEnd = b.y + Math.sin(endAngleLine) * endRLine;
                                for (var pIdx2 = 0; pIdx2 < 8; pIdx2++) {
                                    var angleOff2 = (Math.random() - 0.5) * 0.3;
                                    var rOff2 = (Math.random() - 0.5) * 4 * SCALE;
                                    var pxEnd2 = pxEnd + Math.cos(endAngleLine + angleOff2) * rOff2;
                                    var pyEnd2 = pyEnd + Math.sin(endAngleLine + angleOff2) * rOff2;
                                    createSplash(pxEnd2, pyEnd2, '#ff6666', 1, 1 * SCALE, 1 * SCALE, Math
                                        .random() * 2 * Math.PI, 20);
                                }
                            }
                        } else {
                            // 非 😈 近战武器：删除光晕（shadow）
                            swipeEmoji = b.weaponEmoji || b.attack.emoji || '👋';
                            ex2 = b.x + Math.cos(b.swipeAngle) * range3;

                            ctx.save();
                            ctx.translate(ex2, ey2);
                            if (b.type === 13 && b.isAngel) {

                                var rotateAngle = angleToCenter + Math.PI / 4;

                                var angleToCenter2 = Math.atan2(b.y - ey2, b.x - ex2);
                                var rotateAngle2 = angleToCenter2 + Math.PI / 4;
                                ctx.rotate(rotateAngle2);
                            } else {
                                var attackDir = Math.atan2(ey2 - b.y, ex2 - b.x);
                                ctx.rotate(attackDir + Math.PI / 2);
                                if (b.swipeSign === -1) ctx.scale(-1, 1);
                            }
                            ctx.font = 28 * SCALE + 'px Arial';
                            ctx.textAlign = 'center';

                    }
                    if (b.isChain && b.chainParts) drawChainBall(ctx, b, tickCount);
                    else drawQ弹Ball(ctx, b, tickCount);

                    if (b.parryKnives && b.parryKnives.length > 0) {

                    hpR2 = Math.max(0, Math.min(1, b.hp / b.maxHp));

                    ctx.textAlign = 'center';
                    ctx.fillText(Math.floor(b.hp), b.x, hby2 - 2 * SCALE);
                    if (b.battery != null) {

                        batR2 = b.battery / b.maxBattery;
                        batC = batR2 > 0.5 ? '#4cf' : batR2 > 0.25 ? '#fa0' : '#f44';
                        ctx.fillStyle = batC;
                        ctx.fillRect(batX, actualBatY, batW * batR2, batH);
                        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                        ctx.lineWidth = 1 * SCALE;
                        ctx.strokeRect(batX, actualBatY, batW, batH);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold ' + 7 * SCALE + 'px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('🔋' + b.battery, b.x, actualBatY - 2 * SCALE);
                        ctx.restore()
                    }
                    if (b.type === CAT_TYPE_INDEX && b.revives > 0) {
                        ctx.save();
                        ctx.globalAlpha = 0.85;
                        ctx.font = 'bold ' + 10 * SCALE + 'px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillStyle = '#ff6666';
                        ctx.fillText('❤️x' + b.revives, b.x, b.y - b.r - 22 * SCALE);
                        ctx.restore();

                    if (b.stealthActive) {
                        ctx.save();
                        ctx.globalAlpha = 0.8;
                        ctx.font = 14 * SCALE + 'px Arial';

                    }

                } else {

                        .length + ' | 弹' + projectiles.length + ' | 炸弹' + bombBalls.length + ' | ' + displaySpeedMul
                        .toFixed(1) + 'x' + (paused ? ' 暂停' : '') + (battleActive ? ' ⚔ 战斗中' : battleEndTimer >
                            0 ? ' ⏳ 即将重开' : ''));

            // ===================== 辅助函数 =====================
            function updateChain(ball, dt) {
                if (!ball.isChain || !ball.chainParts) return;
                var parts = ball.chainParts,
                    baseR = ball.r,
                    targetX = ball.x,
                    targetY = ball.y,
                    targetVx = ball.vx,
                    targetVy = ball.vy;
                for (var i = parts.length - 1; i >= 0; i--) {
                    var p = parts[i],
                        dx = targetX - p.x,
                        dy = targetY - p.y,
                        dist = Math.sqrt(dx * dx + dy * dy),

                        var dist = Math.min(bw, bh) * 0.25 + Math.random() * 0.15 * Math.min(bw, bh);
                        var x = cx + Math.cos(ang) * dist;
                        var y = cy + Math.sin(ang) * dist;
                        var idx = freeTypes[fi];
                        var teamId = fi + 2;
                        var ball = makeBall(x, y, BALL_R, 0, 0, idx, 100, null, teamId);
                        if (idx === BOMB_TYPE_INDEX) {
                            ball.bombLaunchTimer = 2000 + Math.random() * 3000;
                        }
                        balls.push(ball);
                    }
                } else {
                    var leftCount = leftTypes.length;
                    var rightCount = rightTypes.length;
                    var count = Math.max(leftCount, rightCount);
                    var positions = [];
                    for (var pi = 0; pi < count; pi++) {
                        var yOff = (pi - (count - 1) / 2) * spacingY * 0.9;
                        positions.push(yOff);
                    }
                    for (var li = 0; li < leftCount; li++) {
                        var lx = bx + bw * 0.2;
                        var ly = cy + (positions[li] || 0);
                        var idx2 = leftTypes[li];
                        var ball2 = makeBall(lx, ly, BALL_R, 0, 0, idx2, 100, null, 0);
                        if (idx2 === BOMB_TYPE_INDEX) {
                            ball2.bombLaunchTimer = 2000 + Math.random() * 3000;
                        }
                        balls.push(ball2);
                    }
                    for (var ri2 = 0; ri2 < rightCount; ri2++) {
                        var rx = bx + bw * 0.8;
                        var ry = cy + (positions[ri2] || 0);
                        var idx3 = rightTypes[ri2];
                        var ball3 = makeBall(rx, ry, BALL_R, 0, 0, idx3, 100, null, 1);
                        if (idx3 === BOMB_TYPE_INDEX) {
                            ball3.bombLaunchTimer = 2000 + Math.random() * 3000;
                        }
                        balls.push(ball3);
                    }
                }

                vsCountdownActive = true;
                vsCountdownRemaining = 5000;
                battleActive = false;
                battleEndTimer = 0;
                infoEl.textContent = '⏳ 静止倒计时: 5s';
                playSound('powerup');
                document.getElementById('vs-overlay').classList.remove('active');
                document.getElementById('vs-start-btn').disabled = true;
                document.getElementById('vs-start-btn').textContent = '⏳ 准备中...';
            }

            // ===== 启动游戏循环 =====
            var lastTime = 0;

            function gameLoop(timestamp) {
                var dt = timestamp - lastTime;
                lastTime = timestamp;
                if (dt > 50) dt = 50;
                frame(dt);
                requestAnimationFrame(gameLoop)
            }
            requestAnimationFrame(function(timestamp) { lastTime = timestamp;
                gameLoop(timestamp) });

            // ===== UI 绑定 =====
            var speedSlider = document.getElementById('speed-slider'),
                speedLabel = document.getElementById('speed-label');
            speedSlider.addEventListener('input', function() {
                var val = parseFloat(this.value);
                speedMul = val;
                speedLabel.textContent = val.toFixed(1) + 'x'
            });
            document.getElementById('b5').addEventListener('click', function(e) {
                e.stopPropagation();
                if (stepSpeedMul < 1.5) stepSpeedMul = 2;
                else if (stepSpeedMul < 2.5) stepSpeedMul = 3;
                else if (stepSpeedMul < 3.5) stepSpeedMul = 4;
                else stepSpeedMul = 1;
                this.textContent = stepSpeedMul + 'x';
                initAudio()
            });
            document.getElementById('b5').addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (stepSpeedMul < 1.5) stepSpeedMul = 2;
                else if (stepSpeedMul < 2.5) stepSpeedMul = 3;
                else if (stepSpeedMul < 3.5) stepSpeedMul = 4;
                else stepSpeedMul = 1;
                this.textContent = stepSpeedMul + 'x';
                initAudio()
            });
            var hdBtn = document.getElementById('b7');
            hdBtn.textContent = '高清';
            hdBtn.className = 'btn hd on';

            function toggleHD() {
                hdMode = !hdMode;
                renderScale = hdMode ? 2 : 1;
                hdBtn.textContent = hdMode ? '高清' : '标清';
                hdBtn.className = 'btn hd' + (hdMode ? ' on' : '');
                updateSize();
                initAudio()
            }
            hdBtn.addEventListener('click', function(e) { e.stopPropagation();
                toggleHD() });
            hdBtn.addEventListener('touchstart', function(e) { e.preventDefault();
                e.stopPropagation();
                toggleHD() });

            function selectType(idx) {
                selectedType = idx;
                for (var i = 0; i < TYPES.length; i++) {
                    var el = document.getElementById('t' + i);
                    if (el) el.className = 'tbtn' + (idx === i ? ' on' : '')
                }
                var tb = document.getElementById('t' + idx),
                    bar = document.getElementById('typeBar');
                if (tb && bar) bar.scrollLeft = tb.offsetLeft - bar.offsetWidth / 2 + tb.offsetWidth / 2;
                initAudio()
            }
            var typeBarEl = document.getElementById('typeBar'),
                scrollTimeout,
                scrollingByCode = false,
                origSelectType = selectType;
            selectType = function(idx) {
                scrollingByCode = true;
                origSelectType(idx);
                setTimeout(function() { scrollingByCode = false }, 150);
                initAudio()
            };
            typeBarEl.addEventListener('scroll', function() {
                if (scrollingByCode) return;
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(function() {
                    var tbRect = typeBarEl.getBoundingClientRect(),
                        midX = tbRect.left + tbRect.width / 2,
                        btns = typeBarEl.querySelectorAll('.tbtn'),
                        bestI = 0,
                        bestD = Infinity;
                    for (var i = 0; i < btns.length; i++) {
                        var br = btns[i].getBoundingClientRect(),
                            cx2 = br.left + br.width / 2,
                            d = Math.abs(cx2 - midX);
                        if (d < bestD) { bestD = d;
                            bestI = i }
                    }
                    if (bestI !== selectedType) origSelectType(bestI)
                }, 80)
            });
            for (var ti3 = 0; ti3 < TYPES.length; ti3++) {
                (function(idx) {
                    var el = document.getElementById('t' + idx);
                    if (!el) return;
                    el.addEventListener('click', function(e) { e.stopPropagation();
                        selectType(idx) });
                    el.addEventListener('touchstart', function(e) { e.preventDefault();
                        e.stopPropagation();
                        selectType(idx) })
                })(ti3)
            }

            function tryAddBall(cx2, cy2) {
                var rect = canvas.getBoundingClientRect(),
                    scaleX2 = W / rect.width,
                    scaleY2 = H / rect.height,
                    x2 = (cx2 - rect.left) * scaleX2,
                    y2 = (cy2 - rect.top) * scaleY2;
                if (!inBounds(x2, y2, BALL_R)) return false;
                if (y2 > H - 60) return false;
                var sp5 = 2 * SCALE + Math.random() * 3 * SCALE,
                    a3 = Math.random() * 6.28318;
                var newBall = makeBall(x2, y2, BALL_R, Math.cos(a3) * sp5, Math.sin(a3) * sp5, selectedType, 100, null,
                    -1);
                if (selectedType === BOMB_TYPE_INDEX) {
                    newBall.bombLaunchTimer = 2000 + Math.random() * 3000;
                }
                balls.push(newBall);
                initAudio();
                return true
            }
            canvas.addEventListener('click', function(e) { e.stopPropagation();
                initAudio();
                tryAddBall(e.clientX, e.clientY) });
            canvas.addEventListener('touchstart', function(e) { e.preventDefault();
                e.stopPropagation();
                initAudio();
                var t5 = e.touches[0];
                if (t5) tryAddBall(t5.clientX, t5.clientY) });

            function bindBtn(id, fn) {
                var el = document.getElementById(id);
                el.addEventListener('click', function(e) { e.stopPropagation();
                    initAudio();
                    fn() });
                el.addEventListener('touchstart', function(e) { e.preventDefault();
                    e.stopPropagation();
                    initAudio();
                    fn() })
            }
            bindBtn('b2', function() {
                balls = [];
                projectiles = [];
                bombEffects = [];
                splashes = [];
                flameParticles = [];
                smokeParticles = [];
                bombBalls = [];
                battleActive = false;
                battleEndTimer = 0;
                vsCountdownActive = false;
                vsCountdownRemaining = 0;
                lastConfig = null;
                document.getElementById('vs-start-btn').disabled = false;
                document.getElementById('vs-start-btn').textContent = '⚡ 开始对战';
                infoEl.textContent = '⚔ 点击 VS 开始对战';
            });
            bindBtn('b3', function() { doReset() });
            bindBtn('b6', function() {
                paused = !paused;
                var el = document.getElementById('b6');
                el.textContent = paused ? '继续' : '暂停';
                el.className = paused ? 'btn on' : 'btn'
            });

            function doReset() {
                balls = [];
                projectiles = [];
                bombEffects = [];
                wheelchairs = [];
                splashes = [];
                flameParticles = [];
                smokeParticles = [];
                bombBalls = [];
                paused = false;
                speedMul = 1;
                stepSpeedMul = 1;
                document.getElementById('speed-slider').value = '1.0';
                document.getElementById('speed-label').textContent = '1.0x';
                document.getElementById('b5').textContent = '倍速';
                document.getElementById('b5').className = 'btn spd';
                document.getElementById('b6').textContent = '暂停';
                document.getElementById('b6').className = 'btn';
                shakeIntensity = 0;
                shakeX = 0;
                shakeY = 0;
                battleActive = false;
                battleEndTimer = 0;
                vsCountdownActive = false;
                vsCountdownRemaining = 0;
                lastConfig = null;
                document.getElementById('vs-start-btn').disabled = false;
                document.getElementById('vs-start-btn').textContent = '⚡ 开始对战';
                infoEl.textContent = '⚔ 点击 VS 开始对战';
            }

            // ===== VS 面板逻辑 =====
            var vsOverlay = document.getElementById('vs-overlay');
            var vsClose = document.getElementById('vs-close');
            var vsModeBtns = document.querySelectorAll('.vs-mode-btn');
            var vsSlotsLeft = document.getElementById('vs-slots-left');
            var vsSlotsRight = document.getElementById('vs-slots-right');
            var vsFreePool = document.getElementById('vs-free-pool');
            var vsFreePoolWrap = document.getElementById('vs-free-pool-wrap');
            var vsPickerBtns = document.getElementById('vs-picker-btns');
            var vsStartBtn = document.getElementById('vs-start-btn');

            var vsMode = '2v2';
            var vsTeamLeft = [];
            var vsTeamRight = [];
            var vsFreePoolList = [];
            var vsActiveSlot = null;

            function buildPicker() {
                vsPickerBtns.innerHTML = '';
                for (var i = 0; i < TYPES.length; i++) {
                    if (i === GUARD_TYPE_INDEX) continue;
                    var btn = document.createElement('button');
                    btn.className = 'tbtn';
                    btn.dataset.idx = i;
                    btn.textContent = TYPES[i].emoji;
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var idx = parseInt(this.dataset.idx);
                        onPickType(idx);
                    });
                    btn.addEventListener('touchstart', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        var idx = parseInt(this.dataset.idx);
                        onPickType(idx);
                    });
                    vsPickerBtns.appendChild(btn);
                }
            }

            function onPickType(idx) {
                if (!vsActiveSlot) {
                    if (vsMode === '混战') {
                        vsFreePoolList.push(idx);
                        renderFreePool();
                        playSound('powerup');
                        return;
                    }
                    for (var i = 0; i < vsTeamLeft.length; i++) {
                        if (vsTeamLeft[i] === null || vsTeamLeft[i] === undefined) {
                            vsActiveSlot = { team: 'left', index: i };
                            break;
                        }
                    }
                    if (!vsActiveSlot) {
                        for (var j = 0; j < vsTeamRight.length; j++) {
                            if (vsTeamRight[j] === null || vsTeamRight[j] === undefined) {
                                vsActiveSlot = { team: 'right', index: j };
                                break;
                            }
                        }
                    }
                    if (!vsActiveSlot) return;
                }
                if (vsActiveSlot.team === 'left') {
                    vsTeamLeft[vsActiveSlot.index] = idx;
                } else if (vsActiveSlot.team === 'right') {
                    vsTeamRight[vsActiveSlot.index] = idx;
                }
                vsActiveSlot = null;
                renderTeams();
                playSound('powerup');
                updateStartButton();
            }

            function renderTeams() {
                vsSlotsLeft.innerHTML = '';
                vsSlotsRight.innerHTML = '';
                var leftCount = vsMode === '1v1' ? 1 : 2;
                var rightCount = vsMode === '1v1' ? 1 : 2;
                while (vsTeamLeft.length < leftCount) vsTeamLeft.push(null);
                while (vsTeamRight.length < rightCount) vsTeamRight.push(null);
                vsTeamLeft = vsTeamLeft.slice(0, leftCount);
                vsTeamRight = vsTeamRight.slice(0, rightCount);

                for (var i = 0; i < vsTeamLeft.length; i++) {
                    var slot = createSlot(vsTeamLeft[i], 'left', i);
                    vsSlotsLeft.appendChild(slot);
                }
                for (var j = 0; j < vsTeamRight.length; j++) {
                    var slot2 = createSlot(vsTeamRight[j], 'right', j);
                    vsSlotsRight.appendChild(slot2);
                }
                document.getElementById('vs-team-left').style.display = (vsMode === '混战') ? 'none' : 'block';
                document.getElementById('vs-team-right').style.display = (vsMode === '混战') ? 'none' : 'block';
                vsFreePoolWrap.style.display = (vsMode === '混战') ? 'block' : 'none';
                if (vsMode === '混战') {
                    renderFreePool();
                }
                updateStartButton();
            }

            function createSlot(value, team, index) {
                var div = document.createElement('div');
                div.className = 'vs-slot' + (value !== null && value !== undefined ? ' filled' : '');
                if (vsActiveSlot && vsActiveSlot.team === team && vsActiveSlot.index === index) {
                    div.classList.add('active');
                }
                div.textContent = (value !== null && value !== undefined) ? TYPES[value].emoji : '?';
                div.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (this.classList.contains('filled')) {
                        vsActiveSlot = { team: team, index: index };
                        renderTeams();
                        this.classList.add('active');
                        return;
                    }
                    vsActiveSlot = { team: team, index: index };
                    renderTeams();
                });
                div.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (this.classList.contains('filled')) {
                        vsActiveSlot = { team: team, index: index };
                        renderTeams();
                        this.classList.add('active');
                        return;
                    }
                    vsActiveSlot = { team: team, index: index };
                    renderTeams();
                });
                if (value !== null && value !== undefined) {
                    var removeBtn = document.createElement('span');
                    removeBtn.className = 'slot-remove';
                    removeBtn.textContent = '✕';
                    removeBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (team === 'left') vsTeamLeft[index] = null;
                        else vsTeamRight[index] = null;
                        if (vsActiveSlot && vsActiveSlot.team === team && vsActiveSlot.index === index) {
                            vsActiveSlot = null;
                        }
                        renderTeams();
                        updateStartButton();
                    });
                    removeBtn.addEventListener('touchstart', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        if (team === 'left') vsTeamLeft[index] = null;
                        else vsTeamRight[index] = null;
                        if (vsActiveSlot && vsActiveSlot.team === team && vsActiveSlot.index === index) {
                            vsActiveSlot = null;
                        }
                        renderTeams();
                        updateStartButton();
                    });
                    div.appendChild(removeBtn);
                }
                return div;
            }

            function renderFreePool() {
                vsFreePool.innerHTML = '';
                if (vsFreePoolList.length === 0) {
                    var empty = document.createElement('div');
                    empty.style.cssText = 'color:#666;font-size:13px;padding:10px;';
                    empty.textContent = '点击下方球型加入';
                    vsFreePool.appendChild(empty);
                    return;
                }
                for (var i = 0; i < vsFreePoolList.length; i++) {
                    var idx = vsFreePoolList[i];
                    var item = document.createElement('div');
                    item.className = 'pool-item';
                    item.textContent = TYPES[idx].emoji;
                    var removeBtn = document.createElement('span');
                    removeBtn.className = 'pool-remove';
                    removeBtn.textContent = '✕';
                    removeBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var index = parseInt(this.dataset.index);
                        vsFreePoolList.splice(index, 1);
                        renderFreePool();
                        updateStartButton();
                    });
                    removeBtn.addEventListener('touchstart', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        var index = parseInt(this.dataset.index);
                        vsFreePoolList.splice(index, 1);
                        renderFreePool();
                        updateStartButton();
                    });
                    removeBtn.dataset.index = i;
                    item.appendChild(removeBtn);
                    vsFreePool.appendChild(item);
                }
            }

            function updateStartButton() {
                if (vsMode === '混战') {
                    vsStartBtn.disabled = vsFreePoolList.length < 2;
                    return;
                }
                var leftOk = vsTeamLeft.every(function(v) { return v !== null && v !== undefined });
                var rightOk = vsTeamRight.every(function(v) { return v !== null && v !== undefined });
                vsStartBtn.disabled = !(leftOk && rightOk);
            }

            function setMode(mode) {
                vsMode = mode;
                vsModeBtns.forEach(function(btn) {
                    btn.classList.toggle('on', btn.dataset.mode === mode);
                });
                vsTeamLeft = [];
                vsTeamRight = [];
                vsFreePoolList = [];
                vsActiveSlot = null;
                if (mode === '1v1') {
                    vsTeamLeft = [null];
                    vsTeamRight = [null];
                } else if (mode === '2v2') {
                    vsTeamLeft = [null, null];
                    vsTeamRight = [null, null];
                } else {
                    vsFreePoolList = [];
                }
                renderTeams();
                updateStartButton();
                document.querySelectorAll('.vs-slot').forEach(function(el) { el.classList.remove('active') });
            }

            function startVsBattle() {
                if (vsStartBtn.disabled) return;
                if (vsCountdownActive) return;
                initAudio();

                balls = [];
                projectiles = [];
                bombEffects = [];
                wheelchairs = [];
                splashes = [];
                flameParticles = [];
                smokeParticles = [];
                bombBalls = [];
                battleActive = false;
                battleEndTimer = 0;
                vsCountdownActive = false;
                vsCountdownRemaining = 0;

                var leftTypes = [];
                var rightTypes = [];
                var freeTypes = [];

                if (vsMode === '混战') {
                    freeTypes = vsFreePoolList.slice();
                } else {
                    leftTypes = vsTeamLeft.filter(function(v) { return v !== null && v !== undefined });
                    rightTypes = vsTeamRight.filter(function(v) { return v !== null && v !== undefined });
                }

                lastConfig = {
                    mode: vsMode,
                    leftTypes: leftTypes,
                    rightTypes: rightTypes,
                    freeTypes: freeTypes
                };

                var margin = BALL_R * 1.8;
                var spacingX = (bw - margin * 2) / (Math.max(leftTypes.length, rightTypes.length, freeTypes.length) + 1);
                var spacingY = (bh - margin * 2) / (Math.max(leftTypes.length, rightTypes.length, freeTypes.length) + 1);

                if (vsMode === '混战') {
                    var total = freeTypes.length;
                    var angleStep = (Math.PI * 2) / total;
                    for (var fi = 0; fi < total; fi++) {
                        var ang = fi * angleStep + Math.random() * 0.3;
                        var dist = Math.min(bw, bh) * 0.25 + Math.random() * 0.15 * Math.min(bw, bh);
                        var x = cx + Math.cos(ang) * dist;
                        var y = cy + Math.sin(ang) * dist;
                        var idx = freeTypes[fi];
                        var teamId = fi + 2;
                        var ball = makeBall(x, y, BALL_R, 0, 0, idx, 100, null, teamId);
                        if (idx === BOMB_TYPE_INDEX) {
                            ball.bombLaunchTimer = 2000 + Math.random() * 3000;
                        }
                        balls.push(ball);
                    }
                } else {
                    var leftCount = leftTypes.length;
                    var rightCount = rightTypes.length;
                    var count = Math.max(leftCount, rightCount);
                    var positions = [];
                    for (var pi = 0; pi < count; pi++) {
                        var yOff = (pi - (count - 1) / 2) * spacingY * 0.9;
                        positions.push(yOff);
                    }
                    for (var li = 0; li < leftCount; li++) {
                        var lx = bx + bw * 0.2;
                        var ly = cy + (positions[li] || 0);
                        var idx2 = leftTypes[li];
                        var ball2 = makeBall(lx, ly, BALL_R, 0, 0, idx2, 100, null, 0);
                        if (idx2 === BOMB_TYPE_INDEX) {
                            ball2.bombLaunchTimer = 2000 + Math.random() * 3000;
                        }
                        balls.push(ball2);
                    }
                    for (var ri2 = 0; ri2 < rightCount; ri2++) {
                        var rx = bx + bw * 0.8;
                        var ry = cy + (positions[ri2] || 0);
                        var idx3 = rightTypes[ri2];
                        var ball3 = makeBall(rx, ry, BALL_R, 0, 0, idx3, 100, null, 1);
                        if (idx3 === BOMB_TYPE_INDEX) {
                            ball3.bombLaunchTimer = 2000 + Math.random() * 3000;
                        }
                        balls.push(ball3);
                    }
                }

                vsCountdownActive = true;
                vsCountdownRemaining = 5000;
                battleActive = false;
                battleEndTimer = 0;
                vsStartBtn.disabled = true;
                vsStartBtn.textContent = '⏳ 准备中...';
                vsOverlay.classList.remove('active');
                infoEl.textContent = '⏳ 静止倒计时: 5s';
                playSound('powerup');
            }

            document.getElementById('b1').addEventListener('click', function(e) {
                e.stopPropagation();
                initAudio();
                if (vsCountdownActive || battleActive || balls.length > 0) {
                    balls = [];
                    projectiles = [];
                    bombEffects = [];
                    wheelchairs = [];
                    splashes = [];
                    flameParticles = [];
                    smokeParticles = [];
                    bombBalls = [];
                    battleActive = false;
                    battleEndTimer = 0;
                    vsCountdownActive = false;
                    vsCountdownRemaining = 0;
                    lastConfig = null;
                    vsStartBtn.disabled = false;
                    vsStartBtn.textContent = '⚡ 开始对战';
                }
                vsOverlay.classList.add('active');
                vsActiveSlot = null;
                setMode(vsMode);
                document.querySelectorAll('#vs-picker-btns .tbtn').forEach(function(el) {
                    el.classList.remove('on');
                });
                updateStartButton();
            });
            document.getElementById('b1').addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                initAudio();
                if (vsCountdownActive || battleActive || balls.length > 0) {
                    balls = [];
                    projectiles = [];
                    bombEffects = [];
                    wheelchairs = [];
                    splashes = [];
                    flameParticles = [];
                    smokeParticles = [];
                    bombBalls = [];
                    battleActive = false;
                    battleEndTimer = 0;
                    vsCountdownActive = false;
                    vsCountdownRemaining = 0;
                    lastConfig = null;
                    vsStartBtn.disabled = false;
                    vsStartBtn.textContent = '⚡ 开始对战';
                }
                vsOverlay.classList.add('active');
                vsActiveSlot = null;
                setMode(vsMode);
                document.querySelectorAll('#vs-picker-btns .tbtn').forEach(function(el) {
                    el.classList.remove('on');
                });
                updateStartButton();
            });

            vsClose.addEventListener('click', function() {
                vsOverlay.classList.remove('active');
            });
            vsClose.addEventListener('touchstart', function(e) {
                e.preventDefault();
                vsOverlay.classList.remove('active');
            });

            vsModeBtns.forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var mode = this.dataset.mode;
                    if (vsCountdownActive) return;
                    setMode(mode);
                });
                btn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    var mode = this.dataset.mode;
                    if (vsCountdownActive) return;
                    setMode(mode);
                });
            });

            vsStartBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                startVsBattle();
            });
            vsStartBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                startVsBattle();
            });

            buildPicker();
            setMode('2v2');
            doReset();
