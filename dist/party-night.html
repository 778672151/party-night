<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fff4f9">
<meta name="pn-version" content="1.14.16">
<title>两个人的游戏厅</title>
<style id="pncss">/* ===== 两个人的游戏厅：二次元 Q 弹可爱风 =====
   设计要点：马卡龙奶油底 + 白色圆角卡片 + 二次元粗描边 +「实体按钮」按压回弹（Q 弹）+ 轻微光泽。 */
:root{
  /* 马卡龙奶油色板 */
  --bg:#fff4f9; --bg2:#ffe9f3; --card:#ffffff; --card2:#fff7fb;
  --ink:#4b3a63; --ink2:#a08cb8;
  --line:#ffd7e8; --stroke:#6b5588;
  --acc:#ff8fb8; --acc2:#8ad7ff; --good:#5fd6a8; --bad:#ff8fa3;
  --blue:#8ad7ff; --yellow:#ffd86b; --purple:#c9a7ff;
  --r:26px; --r2:18px;
  --pop:0 6px 0 rgba(107,85,136,.18), 0 14px 26px rgba(255,143,184,.22);   /* 立体贴纸感 */
  --soft:0 6px 18px rgba(255,143,184,.18);
  --spring:cubic-bezier(.34,1.56,.64,1);                                   /* 过冲回弹：Q 弹的关键 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Yuanti SC","圆体-简","Hiragino Maru Gothic ProN","HarmonyOS Sans SC","PingFang SC","MiSans",system-ui,sans-serif;
  height:100%;overscroll-behavior:none;font-weight:600}
body{
  /* 奶油粉底 + 淡淡的二次元网点 */
  background:
    radial-gradient(closest-side, rgba(255,255,255,.75), transparent) 0 0/26px 26px,
    radial-gradient(closest-side, rgba(255,214,232,.55), transparent) 13px 13px/26px 26px,
    radial-gradient(900px 520px at 50% -12%, #ffe3f1 0%, transparent 62%),
    radial-gradient(760px 480px at 92% 108%, #e6f6ff 0%, transparent 58%),
    var(--bg);
}
#pn-root{max-width:640px;margin:0 auto;min-height:100%;padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom)+70px)}
button{font:inherit;color:inherit;border:none;cursor:pointer;background:none}
input{font:inherit}
.hidden{display:none!important}

/* 顶部栏 */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:10px 2px;backdrop-filter:blur(10px);background:rgba(255,244,249,.78)}
.topbar .logo{font-size:20px;animation:qfloat 2.6s var(--spring) infinite}
.topbar .title{font-weight:900;font-size:17px;letter-spacing:.5px}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;
  background:var(--card);border:2px solid var(--line);font-size:12.5px;color:var(--ink2);
  box-shadow:0 3px 0 rgba(107,85,136,.10)}
.chip b{color:var(--ink);font-family:ui-monospace,Menlo,monospace;letter-spacing:1.5px}
.chip:active{transform:translateY(2px) scale(.97)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink2);display:inline-block}
.dot.ok{background:var(--good);box-shadow:0 0 8px var(--good)}
.dot.warn{background:var(--yellow)}

/* 落地页 */
.land{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:10vh}
.biglogo{font-size:72px;animation:qbounce 2.2s var(--spring) infinite;filter:drop-shadow(0 8px 14px rgba(255,143,184,.35))}
@keyframes qbounce{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-10px) scale(1.06) rotate(-5deg)}60%{transform:translateY(0) scale(.97)}}
@keyframes qfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.land h1{margin:10px 0 4px;font-size:27px;letter-spacing:1px;font-weight:900;
  background:linear-gradient(135deg,#ff8fb8,#c9a7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.land .sub{color:var(--ink2);font-size:13px;margin-bottom:26px}
.field{width:100%;max-width:340px;margin:0 auto 14px;text-align:left}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;padding:13px 16px;border-radius:var(--r2);border:2px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;outline:none;box-shadow:inset 0 2px 0 rgba(107,85,136,.04)}
.field input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,143,184,.18)}
.emoji-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0 10px}
.emoji-row .e{font-size:22px;padding:8px;border-radius:14px;background:var(--card);border:2px solid var(--line);
  box-shadow:0 3px 0 rgba(107,85,136,.10)}
.emoji-row .e.sel{border-color:var(--acc);background:#fff0f6;box-shadow:0 3px 0 rgba(255,143,184,.45);transform:translateY(-2px)}

/* 通用卡片 / 按钮：按钮是「实体贴纸」，按下沉下去再弹回来 = Q 弹 */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;
  box-shadow:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;
  border-radius:999px;background:var(--card);border:2px solid var(--stroke);font-weight:800;font-size:15px;
  box-shadow:0 4px 0 var(--stroke);transition:transform .12s var(--spring),box-shadow .12s ease}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--stroke)}
.btn.primary{background:linear-gradient(160deg,#ffb3cf,#ff8fb8);color:#fff;border-color:#e2679a;
  box-shadow:0 4px 0 #e2679a,0 10px 18px rgba(255,143,184,.35)}
.btn.primary:active{box-shadow:0 0 0 #e2679a}
.btn.ghost{background:rgba(255,255,255,.7);border-color:var(--line);box-shadow:0 3px 0 rgba(107,85,136,.10);color:var(--ink2)}
.btn.warn{background:#fff0f3;border-color:#ffb8c6;color:#e2607a;box-shadow:0 4px 0 #ffb8c6}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:999px;box-shadow:0 3px 0 var(--stroke)}
.btn.sm.ghost{box-shadow:0 3px 0 rgba(107,85,136,.10)}
.btn:disabled{opacity:.45;pointer-events:none;box-shadow:none}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt8{margin-top:8px}.mt16{margin-top:16px}

/* 大厅 */
.roomcode{display:flex;align-items:center;gap:10px;padding:6px}
.roomcode .code{font-size:34px;font-weight:900;letter-spacing:10px;font-family:ui-monospace,Menlo,monospace;
  color:var(--acc);text-shadow:0 3px 0 rgba(255,143,184,.28)}
.players{display:flex;flex-wrap:wrap;gap:10px}
.player{width:calc(50% - 5px);display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:12px 6px;border-radius:var(--r2);background:var(--card2);border:2px solid var(--line);position:relative;
  animation:qpop .34s var(--spring) both}
@keyframes qpop{from{opacity:0;transform:scale(.86) translateY(6px)}60%{opacity:1;transform:scale(1.03)}to{transform:scale(1)}}
.player .em{font-size:30px}
.player .nm{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .sc{font-size:11px;color:var(--ink2)}
.player.me{border-color:var(--acc);background:#fff0f6;box-shadow:0 4px 0 rgba(255,143,184,.35)}
.player.host:after{content:"房主";position:absolute;top:-8px;right:-4px;font-size:9px;padding:2px 7px;
  border-radius:999px;background:var(--yellow);color:#7a5a00;font-weight:900;border:2px solid var(--stroke)}
.player.off{opacity:.45;filter:grayscale(.7)}
.modegrid{display:grid;grid-template-columns:1fr;gap:12px}
.modecard{position:relative;padding:18px 16px;border-radius:var(--r);background:var(--card);
  border:2px solid var(--stroke);text-align:left;overflow:hidden;box-shadow:var(--pop);animation:qpop .4s var(--spring) both}
.modecard:before{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,143,184,.22),transparent)}
.modecard .ico{font-size:34px;animation:qfloat 3s var(--spring) infinite}
.modecard .nm{font-weight:900;font-size:18px;margin-top:6px}
.modecard .blurb{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.55}
.modecard .go{margin-top:12px}
.settings{display:none;margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.settings.open{display:block;animation:qpop .3s var(--spring) both}
.setrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--ink2)}
.setrow .val{color:var(--acc);font-weight:800}
.seg{display:flex;gap:4px;background:var(--bg2);padding:3px;border-radius:999px}
.seg button{padding:6px 12px;font-size:12px;border-radius:999px;color:var(--ink2);font-weight:800}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:0 2px 0 rgba(255,143,184,.35);transform:scale(1.04)}
input[type=range]{width:120px;accent-color:var(--acc)}

/* 通用游戏屏 */
.ghead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 0 6px;gap:4px}
.gh-title{font-size:23px;font-weight:900}
.gh-phase{font-size:13px;color:var(--ink2)}
.pill{display:inline-flex;padding:4px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line);
  font-size:12px;color:var(--ink2)}
.timer{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:900}
.timer.hot{animation:qwiggle .5s var(--spring) infinite}
@keyframes qwiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bigword{font-size:40px;font-weight:900;letter-spacing:4px;text-align:center;color:var(--acc);
  text-shadow:0 3px 0 rgba(255,143,184,.28);margin:10px 0;animation:qpop .4s var(--spring) both}
.center{text-align:center}
.muted{color:var(--ink2);font-size:13px}
.players-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pickable{padding:12px 14px;border-radius:var(--r2);background:var(--card);border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px;font-weight:800}
.pickable.sel{border-color:var(--acc);background:#fff0f6;transform:translateY(-2px);box-shadow:0 4px 0 rgba(255,143,184,.35)}
.pickable .em{font-size:26px}
.dead{opacity:.4;filter:grayscale(1);text-decoration:line-through}

/* 提示条 */
.toasts{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:50;pointer-events:none;display:flex;flex-direction:column;
  gap:8px;align-items:center;pointer-events:none;width:min(92vw,560px)}
.toast{background:var(--card);border:2px solid var(--stroke);padding:10px 18px;border-radius:999px;font-size:14px;
  font-weight:800;box-shadow:0 5px 0 rgba(107,85,136,.16),var(--soft);animation:qdrop .32s var(--spring)}
.toast.good{border-color:var(--good);color:#1f8f68}
.toast.bad{border-color:var(--bad);color:#d1576f}
@keyframes qdrop{from{opacity:0;transform:translateY(-14px) scale(.9)}70%{opacity:1;transform:translateY(2px) scale(1.02)}to{transform:scale(1)}}

/* 列表 */
.list{display:flex;flex-direction:column;gap:10px}
.listitem{background:var(--card2);border:2px solid var(--line);border-radius:var(--r2);padding:12px 14px}
.listitem .who{font-size:12px;color:var(--ink2);margin-bottom:4px}
.listitem .what{font-size:15px;line-height:1.5;word-break:break-word}

/* 输入条 */
.inputbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(env(safe-area-inset-bottom)+10px);
  background:linear-gradient(transparent,var(--bg) 34%);max-width:640px;margin:0 auto;display:flex;gap:8px}
.inputbar input{flex:1;padding:13px 18px;border-radius:999px;border:2px solid var(--stroke);
  background:var(--card);color:var(--ink);font-size:16px;outline:none}
.inputbar .btn{border-radius:999px}

/* 你画我猜 */
#pn-root.wide{max-width:1080px}
.dg{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
@media (min-width:820px){ .dg{grid-template-columns:minmax(0,1fr) 310px;align-items:start} }
.dg-main{min-width:0}
.dg-stage{position:relative;width:100%;max-width:min(100%,58vh);aspect-ratio:1/1;margin:0 auto;
  background:#fff;border-radius:var(--r);overflow:hidden;touch-action:none;border:3px solid var(--stroke);
  box-shadow:0 8px 0 rgba(107,85,136,.14),var(--soft)}
.dg-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
.dg-stage.locked canvas{cursor:default}
/* 猜词者要能用手指在画布区域上下滑动页面；只有画家才禁用滚动 */
.dg-stage.locked,.dg-stage.locked canvas{touch-action:pan-y}
.dg-hint{display:flex;align-items:center;justify-content:center;gap:10px;min-height:46px;margin:2px 0 8px;
  font-size:23px;font-weight:900;letter-spacing:.22em;color:var(--ink);animation:qpop .32s var(--spring) both;
  /* 手机窄屏修复：大字距 + 不可收缩的 flex 子项会把这一行撑破容器（390 视口曾溢出到 396px、文档宽多 6px） */
  flex-wrap:wrap;max-width:100%;min-width:0}
.dg-hint .w{color:#f0a02a;min-width:0;word-break:break-word}
/* 窄屏收紧字号与字距：通常一行放得下，放不下也会换行而不是撑破 */
@media (max-width:430px){ .dg-hint{font-size:19px;letter-spacing:.12em;gap:8px} }
.dg-hint .u{color:#e6d5ee}
.dg-hint .tag{font-size:13px;font-weight:700;letter-spacing:0;color:var(--ink2);background:var(--card);
  border:2px solid var(--line);border-radius:999px;padding:4px 12px}
.dg-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:10px}
.dg-tools .sep{width:2px;height:24px;background:var(--line);margin:0 2px;border-radius:2px}
.swatch{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--stroke);padding:0;
  box-shadow:0 3px 0 rgba(107,85,136,.18);transition:transform .12s var(--spring)}
.swatch.sel{border-color:var(--acc);box-shadow:0 3px 0 rgba(255,143,184,.5);transform:scale(1.14) translateY(-2px)}
.swatch.eraser{background:#fff;position:relative}
.swatch.eraser::after{content:'🧽';position:absolute;inset:0;font-size:16px;line-height:28px;text-align:center}
.sizew{width:36px;height:36px;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:0}
.sizew i{display:block;background:currentColor;border-radius:50%}
.dg-side{display:flex;flex-direction:column;background:var(--card);border:2px solid var(--stroke);
  border-radius:var(--r);overflow:hidden;min-height:0;box-shadow:var(--soft)}
.dg-log{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;
  height:min(38vh,300px);-webkit-overflow-scrolling:touch}
@media (max-width:819px){ .dg-log{height:190px} }
.dg-msg{font-size:14px;line-height:1.45;word-break:break-word;color:var(--ink)}
.dg-msg .who{font-weight:900;margin-right:5px}
.dg-msg.ok{color:#1f8f68;font-weight:900}
.dg-msg.near{color:#e08a1e}
.dg-msg.sys{color:var(--ink2);font-style:italic}
.dg-input{display:flex;gap:8px;padding:8px;border-top:2px solid var(--line);background:var(--card2)}
.dg-input input{flex:1;min-width:0;padding:12px 16px;border-radius:999px;border:2px solid var(--stroke);
  background:var(--card);color:var(--ink);font-size:16px;outline:none}
.dg-input input:disabled{opacity:.6}
.dg-input .btn{border-radius:999px;padding:12px 18px}

/* 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(75,58,99,.42);backdrop-filter:blur(5px);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:3px solid var(--stroke);border-radius:var(--r);padding:22px;width:100%;max-width:420px;
  box-shadow:var(--pop);animation:qpop .3s var(--spring) both}

/* 计分板 */
.scoreboard{display:flex;flex-direction:column;gap:8px}
.sbrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r2);background:var(--card2);
  border:2px solid var(--line)}
.sbrow .rank{font-weight:900;color:var(--acc);width:22px}
.sbrow .em{font-size:22px}
.sbrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.sbrow .pts{font-weight:900;font-variant-numeric:tabular-nums}
.sbrow.top{background:#fff6da;border-color:var(--yellow);box-shadow:0 4px 0 rgba(255,216,107,.5)}
.sbrow.top .rank:before{content:"👑"}

/* 氛围小装饰：飘着的星星，二次元感 */
.land:after{content:"✨";position:absolute;left:18%;top:16vh;font-size:20px;animation:qfloat 3.2s ease-in-out infinite;opacity:.85}
.land:before{content:"💗";position:absolute;right:16%;top:26vh;font-size:18px;animation:qfloat 2.6s ease-in-out infinite .4s;opacity:.85}

@media (max-width:360px){ .player{width:calc(100% - 0px)} .modegrid{grid-template-columns:1fr} }

/* ===== 默契大考验 ===== */
.tac-q{margin-bottom:14px}
.tac-qtext{font-size:22px;font-weight:900;line-height:1.5;margin-top:6px;animation:qpop .34s var(--spring) both}
.tac-opts{display:flex;flex-direction:column;gap:10px}
.tac-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;
  border-radius:var(--r2);background:var(--card);border:2.5px solid var(--stroke);font-weight:800;font-size:16px;
  box-shadow:0 4px 0 var(--stroke);transition:transform .12s var(--spring),box-shadow .12s ease;
  animation:qpop .34s var(--spring) both}
.tac-opt:nth-child(2){animation-delay:.05s}.tac-opt:nth-child(3){animation-delay:.1s}.tac-opt:nth-child(4){animation-delay:.15s}
.tac-opt:active{transform:translateY(4px);box-shadow:0 0 0 var(--stroke)}
.tac-opt .k{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;
  background:var(--bg2);color:var(--acc);font-size:14px;font-weight:900;flex:0 0 auto}
.tac-opt .t{flex:1;min-width:0}
.tac-opt.chosen{background:linear-gradient(160deg,#ffb3cf,#ff8fb8);color:#fff;border-color:#e2679a;box-shadow:0 4px 0 #e2679a}
.tac-opt.chosen .k{background:#fff;color:#e2679a}
.tac-opt.dim{opacity:.45;box-shadow:none;transform:none}
.tac-wait{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:14px;font-weight:800;
  color:var(--ink2);animation:qpop .3s var(--spring) both}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:qdot .9s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes qdot{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}
.tac-picks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tac-pick{background:var(--card);border:2.5px solid var(--stroke);border-radius:var(--r);padding:14px 10px;text-align:center;
  box-shadow:var(--soft);animation:qslideL .38s var(--spring) both}
.tac-pick:nth-child(2){animation-name:qslideR}
.tac-pick.same{border-color:var(--acc);background:#fff5fa;box-shadow:0 4px 0 rgba(255,143,184,.45)}
.tac-pick .em{font-size:30px}
.tac-pick .nm{font-size:13px;font-weight:800;margin-bottom:6px}
.tac-pick .pick{font-size:16px;font-weight:900;color:var(--acc);word-break:break-word}
@keyframes qslideL{from{opacity:0;transform:translateX(-24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes qslideR{from{opacity:0;transform:translateX(24px) scale(.94)}to{opacity:1;transform:none}}
.tac-verdict{margin-top:14px;text-align:center;font-size:17px;font-weight:900;padding:12px;border-radius:var(--r2);
  animation:qpop .4s var(--spring) both}
.tac-verdict.ok{background:linear-gradient(160deg,#ffe3ef,#ffd0e4);color:#d1578f;border:2.5px solid var(--acc)}
.tac-verdict.no{background:var(--bg2);color:var(--ink2);border:2.5px dashed var(--line)}
.tac-hero{padding:26px 16px}
.tac-percent{font-size:64px;font-weight:900;line-height:1;color:var(--acc);text-shadow:0 4px 0 rgba(255,143,184,.25);
  animation:qpop .5s var(--spring) both}
.tac-percent span{font-size:26px;margin-left:2px}
.tac-word{font-size:13px;color:var(--ink2);margin-top:4px;letter-spacing:2px}

.mem-card{position:relative;aspect-ratio:1/1;padding:0;border:none;background:none;perspective:600px;cursor:pointer}
.mem-card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .4s var(--spring)}
.mem-card.on .inner{transform:rotateY(180deg)}
.mem-card.just .inner{animation:qflipIn .42s var(--spring) both}
@keyframes qflipIn{from{transform:rotateY(0deg) scale(.9)}to{transform:rotateY(180deg) scale(1)}}
.mem-card .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:clamp(22px,7vw,30px)}

  box-shadow:0 4px 0 rgba(107,85,136,.14)}
.mem-card.done{animation:qdone .5s var(--spring) both}
.mem-card.done .front{background:linear-gradient(160deg,#fff6da,#ffeeb8);border-color:var(--acc)}
@keyframes qdone{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
.mem-card:disabled{cursor:default}
.mem-hero{padding:22px 16px}
.mem-stars{font-size:40px;letter-spacing:4px;animation:qpop .5s var(--spring) both}

.mem-combo{margin-top:8px;font-size:14px;font-weight:900;color:var(--acc)}

/* 三渲二牌桌（翻牌）：DOM 卡片退化为透明命中层，视觉由 .mem-3d 画布提供 */

.mem-3d { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
.mem-board .mem-card { position: relative; z-index: 1; background: transparent !important; border-color: transparent !important; box-shadow: none !important; }

/* 三渲二棋盘（扫雷）：DOM 格子退化为透明命中层，视觉由 .mn-3d 画布提供 */

.mn-3d { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.mn-board .mn-cell { position: relative; z-index: 1; background: transparent !important; border-color: transparent !important; color: transparent !important; box-shadow: none !important; }

/* 三渲二选项卡片（默契大考验）：纯 CSS 实现（平面色块 + 硬边偏移投影 + 描边 + 顶部高光），不动布局 */
.tac-opts .tac-opt{
  border:2.5px solid #6b5588;
  background:linear-gradient(180deg,#fff7fb 0%,#fff7fb 34%,#ffeaf4 34%,#ffeaf4 100%);
  box-shadow:0 5px 0 #d9bfe0, 0 8px 14px rgba(75,58,99,.13);
  transition:transform .12s ease, box-shadow .12s ease;
}
.tac-opts .tac-opt .k{
  background:#ffd7e8 !important;color:#c0578c !important;
  border:2px solid #6b5588;box-shadow:0 2px 0 #e2aecb;
}
.tac-opts .tac-opt .t{color:#4b3a63 !important;font-weight:800}
.tac-opts .tac-opt.chosen{
  background:linear-gradient(180deg,#ffc2da 0%,#ffc2da 34%,#ff9dc3 34%,#ff9dc3 100%) !important;
  border-color:#b8538a !important;box-shadow:0 5px 0 #d76a9f, 0 8px 14px rgba(184,83,138,.22) !important;
}
.tac-opts .tac-opt.chosen .k{background:#fff !important;color:#e2679a !important;box-shadow:0 2px 0 #e2aecb !important}
.tac-opts .tac-opt.chosen .t{color:#fff !important}
.tac-opts .tac-opt:active{transform:translateY(5px);box-shadow:0 0 0 #d9bfe0 !important}

/* 三渲二游戏图标（大堂卡片）：平面色块 + 硬边偏移投影 + 描边，与其余三渲二画面统一 */
.gc-ico{
  display:inline-flex;width:54px;height:54px;align-items:center;justify-content:center;
  border-radius:16px;
  background:linear-gradient(180deg,#fffafd 0%,#fffafd 36%,#ffeff7 36%,#ffeff7 100%);
  border:2.5px solid var(--stroke);
  box-shadow:0 4px 0 rgba(107,85,136,.26), 0 7px 12px rgba(75,58,99,.10);
}

/* 阶段3：落地页与游戏内三渲二语言对齐（描边 + 硬边偏移投影 + 平面色阶） */
.field input{border:2.5px solid var(--stroke);background:linear-gradient(180deg,#fffdfe 0%,#fffdfe 45%,#fff5fa 45%,#fff5fa 100%);box-shadow:0 3px 0 rgba(107,85,136,.16);}
.emoji-row > *{border:2.5px solid var(--stroke);border-radius:14px;background:linear-gradient(180deg,#fffafd 0%,#fffafd 38%,#ffeff7 38%,#ffeff7 100%);box-shadow:0 3px 0 rgba(107,85,136,.22);}
.emoji-row > *.sel{box-shadow:0 0 0 3px var(--acc),0 3px 0 rgba(107,85,136,.22);}

/* 阶段3 第二批：联机卡片(.modecard)与小游戏卡片(.mini-card)统一到同一套三渲二语言 */
.modecard{border:2.5px solid var(--stroke);box-shadow:0 5px 0 rgba(107,85,136,.16),var(--soft);}
.modecard:active{transform:translateY(3px);box-shadow:0 0 0 var(--stroke);}

/* 阶段3 第三批：房间号展示区（.roomcode）三渲二化——描边 + 硬边投影 + 平面色阶 */
.roomcode{background:linear-gradient(180deg,#fffdfe 0%,#fffdfe 46%,#fff2f8 46%,#fff2f8 100%);border:2.5px solid var(--stroke);border-radius:var(--r2);box-shadow:0 4px 0 rgba(107,85,136,.18);}
.roomcode .code{color:#e2679a;}

/* 阶段3 第四批：房间内玩家卡 .player 与大厅卡片统一（深色描边 + 硬边偏移投影） */
.player{border:2.5px solid var(--stroke);box-shadow:0 4px 0 rgba(107,85,136,.16);}
.player.me{box-shadow:0 4px 0 rgba(255,143,184,.42);}
.players-grid .pickable{border:2.5px solid var(--stroke);box-shadow:0 4px 0 rgba(107,85,136,.16);}

/* 阶段四B：弱化大厅存在感——移除纯装饰（用覆盖而非删原规则，便于回退） */
.land:before,.land:after{content:none!important}
.modecard:before{display:none!important}

/* 阶段四B-2：把“大厅感”压到最低——只给落地页/等待页自身一层素色表面（作用域限定在 .land），
   html,body 的全局背景与所有游戏内视觉一行不动，可随时删掉本段回退 */
.land{background:linear-gradient(180deg,#fffdfe 0%,#fff6fa 100%);border-radius:var(--r2);
  padding:26px 18px 30px;max-width:420px;margin:0 auto;box-shadow:0 6px 0 rgba(107,85,136,.10)}

/* ===== 大厅重构 第1块：信息层级与留白（纯覆盖，可整段删除回退） ===== */
/* 1) 房号降级：配角不该比主角大（原 34px > 游戏名 18px） */
.roomcode{padding:4px 8px}
.roomcode .code{font-size:15px;letter-spacing:4px}
/* 2) 名册压缩成一条头像行，不再占掉首屏一整块 */
.players{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:2px}
.player{width:auto;flex:0 0 auto;flex-direction:row;gap:6px;padding:6px 10px;align-items:center}
.player .em{font-size:18px}
.player .nm{font-size:12px;font-weight:700}
.player .sc{font-size:10px}
/* 3) 游戏卡成为视觉重心：两列等高网格、名字全页最大、CTA 固定不跳动 */
.modegrid{grid-template-columns:1fr 1fr;gap:10px}
.modecard{padding:12px 12px 10px;display:flex;flex-direction:column;height:100%}
.modecard .gc-ico{font-size:34px}
.modecard .gc-nm{font-size:19px;margin-top:4px;line-height:1.2}
.modecard .gc-desc{font-size:11.5px;margin-top:3px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.modecard .gc-meta{min-height:0;margin-top:6px}
.modecard .go{margin-top:auto;padding-top:8px}

/* 大厅重构 第2块：砍噪声 + 小游戏区折叠 */
.game-head .muted,.mini-head .muted{display:none}
.mini-sec .mini-head{cursor:pointer;user-select:none}
.mini-sec .mini-head b:after{content:' ▾';font-size:11px;opacity:.7}
.mini-sec:not(.collapsed) .mini-head b:after{content:' ▴'}
.mini-sec.collapsed .mini-grid{display:none}

/* ===== 大厅质感（按实测数字改，不靠肉眼）===== */
/* 卡片原来 211px 高、桌面也只有两列 205px，又窄又高 -> 内容稀疏、留白巨大 */
.modegrid{grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px;max-width:900px;margin:0 auto}
.modecard{min-height:120px;padding:10px 12px 9px}
.modecard .gc-ico{font-size:26px}
.modecard .gc-nm{font-size:16.5px;margin-top:2px}
.modecard .gc-desc{font-size:11px;margin-top:2px;-webkit-line-clamp:2}
.modecard .gc-meta{margin-top:4px}
.modecard .go{margin-top:auto;padding-top:6px}
.modecard .go button,.modecard .go .btn{padding:5px 10px;font-size:12px;border-radius:10px}
.game-sec,.mini-sec{max-width:900px;margin:0 auto}
/* 卡片撑高的几个来源：描述两行、meta 行、折叠后仍占位的 settings 上边距 */
.modecard .settings{margin-top:0}
.modecard .settings:not(.open){padding-top:0}
.modecard .gc-desc{-webkit-line-clamp:1}
.modecard .gc-meta{min-height:0;line-height:1.15;margin-top:3px}
.modecard .row.mt8{margin-top:5px}
/* 实测：11 张卡都是 179px、名字都是单行 20px，撑高的是 .gc-ico 的 54px 方块（早先做成 54×54 留下的）*/
.modecard .gc-ico{width:36px;height:36px;font-size:20px}
.modecard .go{padding-top:4px}
.modecard .go button,.modecard .go .btn{padding:4px 9px;font-size:11.5px}
.modecard .gc-meta{font-size:10px}

/* ===== 响应式：开始页与大厅在桌面/大屏不再是一条 640 窄带 ===== */
/* 桌面：容器放宽，卡片网格自适应列数；手机保持单列窄容器 */
@media (min-width:820px){
  #pn-root{max-width:1040px}
  .land{max-width:560px}
  .modegrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .mini-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
}
@media (min-width:1400px){
  #pn-root{max-width:1200px}
  .modegrid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
}
/* 落地页：竖屏时上下留白收紧，避免内容孤零零飘在中间 */
@media (min-height:900px){ .land{padding-top:6vh} }
/* 名册卡片：一个人时不要撑成一整条空卡 */
.players{min-height:0}
.player.online-only{flex:0 0 auto}

/* ===== 视觉引导：开始页在桌面上垂直居中，整体不再孤零零挂在上方 ===== */
/* #pn-root 是 min-height:100% 的普通块；给落地页场景加一个居中容器 */
@media (min-height:760px){
  .land{margin:auto}
  #pn-root:has(> .land){display:flex;flex-direction:column}
}
.roster{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px}
.roster-label{flex:0 0 auto;font-size:12px}
.roster .players{flex:1 1 auto;flex-wrap:wrap}
/* 分区之间收一点，避免大段空白 */
.game-sec,.mini-sec{margin-top:14px}
.game-head,.mini-head{margin:0 0 8px 2px}

/* 名册行：头像靠左、操作靠右，横向不再空 */
.roster{padding:10px 12px;gap:8px}
.roster .players{flex:0 1 auto;flex-wrap:wrap;min-width:0}
.roster .btn.sm{padding:6px 10px}

/* 顶栏房号 chip：等宽字、可点复制 */
.chip.roomcode{cursor:pointer}
.chip.roomcode .code{letter-spacing:2px;font-family:ui-monospace,Menlo,monospace}

/* 名册行修形：一个人时不该出现横向滚动条；操作按钮真正靠右 */
.roster{display:flex;align-items:center;flex-wrap:nowrap;gap:8px}
.roster .players{flex:1 1 auto;overflow:visible;flex-wrap:wrap;min-width:0}
.roster .spacer{flex:1 1 auto}
.roster > .spacer + .btn{margin-left:auto}
/* 全局：名册不再是横向滚动容器 */
.players{overflow:visible}

/* ===== 视觉引导 第三轮：超宽屏利用 + 卡片底行收边 ===== */
@media (min-width:1700px){
  #pn-root{max-width:1320px}
  .modegrid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
}
/* 卡片底行（设置齿轮 + 开始）左齿轮右按钮，别在中间留一大段空 */
.modecard .row.mt8{display:flex;align-items:center;gap:8px}
.modecard .row.mt8 .settings-toggle{margin-right:auto}
.modecard .row.mt8 .btn{margin-left:auto;min-width:76px}
/* 分区标题与网格对齐，标题右侧不再孤零零 */
.game-head,.mini-head{display:flex;align-items:baseline;gap:8px}
/* 顶栏房号 chip 更醒目一点（它就是唯一的房号位） */
.chip.roomcode{font-weight:800;letter-spacing:1px}
</style>
</head>

    if (!all.length) return null;
    var pool = all.filter(function (q) { return _pv.used.indexOf(q.q) < 0; });
    if (!pool.length) { _pv.used = []; pool = all.slice(); }

    var g = host.g();
    if (q.type === 'pick') return (q.options || []).slice(0, 4);

      var p = host.player(id);
      return p ? p.name : '?';

      options: optionsFor(host, q),

    return local.rect;
  }
  function toNorm(cv, e) {
    var r = local.rect || measureRect(cv);
    if (!r) return [0, 0];
    return clampPt((e.clientX - r.left) / r.width * 1000, (e.clientY - r.top) / r.height * 1000);
  }
  function maskHtml(g, cur) {
    var len = cur.wordLen || 0;
    var hint = cur.hint || {};
    var out = [];
    for (var i = 0; i < len; i++) {
      out.push(hint[i] ? '<span class="w">' + esc(hint[i]) + '</span>' : '<span class="u">' + MASK + '</span>');
    }
    return out.join(' ');
  }

  /* ---------------- 画布 ---------------- */
  function resetIfNewGame(g) {
    var stamp = (g && g.startedAt) || 0;
    var round = (g && g.round) || 0;
    // 换轮必须清空！startedAt 只在开局写一次，只靠它判断会漏掉每一次换轮：
    // 画布带着上一轮的画继续用，另一端回放/新画的笔画又对不上，看起来就是「没清 + 显示错」。
    if (stamp !== local.startedAt || round !== local.round) {
      local.startedAt = stamp;
      local.round = round;
      local.strokes = [];
      local.byId = {};
      local.curId = null;
      local.myWord = '';
      local.canvas = null;
      local.ctx = null;
      local.w = local.h = 0;
      local.rect = null;
      local.painting = false;
      local.sent = 0;
      local.seq = 0;
    }
  }
  function ensureCanvas(ui) {
    if (local.canvas) return local.canvas;
    var c = ui.el('canvas');
    local.canvas = c;
    local.ctx = c.getContext('2d');
    return c;
  }
  /** 关键修复：只在画布已经进入文档、量得到真实尺寸时才设置后备缓冲区 */
  function sizeCanvas() {
    var cv = local.canvas;
    if (!cv || !local.ctx) return;
    var r = cv.getBoundingClientRect();
    if (!r.width || !r.height || r.width < 20) return; // 没挂载/不可见 → 保持原样，别写坏
    local.rect = { left: r.left, top: r.top, width: r.width, height: r.height }; // 顺手刷新矩形缓存
    var dpr = Math.min(root.devicePixelRatio || 1, 2);
    var W = Math.max(1, Math.round(r.width * dpr));
    var H = Math.max(1, Math.round(r.height * dpr));
    if (cv.width === W && cv.height === H && local.dpr === dpr && local.w === r.width && local.h === r.height) return;
    local.dpr = dpr;
    local.w = r.width; local.h = r.height;
    if (cv.width !== W || cv.height !== H) { // 赋 width/height 会清空画布并重置变换，所以只在真的变了时动
      cv.width = W; cv.height = H;
      local.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    redrawAll();
  }
  function clearCanvas() {
    if (local.ctx && local.w) local.ctx.clearRect(0, 0, local.w, local.h);
  }
  function styleCtx(c, st) {
    c.strokeStyle = st.color;
    c.fillStyle = st.color;
    c.lineWidth = st.w;
    c.lineCap = 'round';
    c.lineJoin = 'round';
  }
  /** 能画的只有「从 0 开始连续」的那一段。
   *  接收端是按 i0 落位的，缺号时 pts 中间会有洞 —— 拿洞里的 undefined 去画会抛异常，
   *  整笔就断在那里（这就是「补发了却还是画不全」的原因）。 */
  function denseLen(st) {
    var have = (st.have === undefined) ? st.pts.length : st.have;
    return Math.max(0, Math.min(have, st.pts.length));
  }
  /** 整条笔画重绘（中点二次贝塞尔平滑） */
  function paintStroke(st) {
    var c = local.ctx, pts = st.pts, n = denseLen(st);
    if (!c || !n || !local.w) return;
    var W = local.w, H = local.h;
    styleCtx(c, st);
    if (n === 1) {
      c.beginPath();
      c.arc(pts[0][0] / 1000 * W, pts[0][1] / 1000 * H, Math.max(1, st.w / 2), 0, 6.2832);
      c.fill();
      return;
    }
    c.beginPath();
    c.moveTo(pts[0][0] / 1000 * W, pts[0][1] / 1000 * H);
    for (var i = 1; i < n - 1; i++) {
      var ax = pts[i][0] / 1000 * W, ay = pts[i][1] / 1000 * H;
      var bx = pts[i + 1][0] / 1000 * W, by = pts[i + 1][1] / 1000 * H;
      c.quadraticCurveTo(ax, ay, (ax + bx) / 2, (ay + by) / 2);
    }
    c.lineTo(pts[n - 1][0] / 1000 * W, pts[n - 1][1] / 1000 * H);
    c.stroke();
  }
  /** 只画新增的一小段（实时跟手，不必整条重绘） */
  function paintTail(st, from) {
    var c = local.ctx, pts = st.pts, n = denseLen(st);
    if (!c || n < 2 || !local.w) return;
    var W = local.w, H = local.h;
    styleCtx(c, st);
    var start = Math.max(0, from - 1);
    c.beginPath();
    c.moveTo(pts[start][0] / 1000 * W, pts[start][1] / 1000 * H);
    for (var i = start + 1; i < n; i++) c.lineTo(pts[i][0] / 1000 * W, pts[i][1] / 1000 * H);
    c.stroke();
  }
  function redrawAll() {
    clearCanvas();
    for (var i = 0; i < local.strokes.length; i++) paintStroke(local.strokes[i]);
  }
  function addStroke(id, color, w, r) {
    var st = { id: id, color: color, w: w, r: r === undefined ? local.round : r, pts: [] };
    local.byId[id] = st;
    local.strokes.push(st);
    return st;
  }
  /** 兜底：任何一条墨迹到达时顺手检查别的笔是否还带着洞（例如「最后一块」正好丢了），
   *  有就再要一次补发。每笔最多要 6 次、400ms 冷却，不会打风暴。 */
  function sweepHoles(ui) {
    var now = Date.now();
    for (var id in local.byId) {
      if (!Object.prototype.hasOwnProperty.call(local.byId, id)) continue;
      var s = local.byId[id];
      if (!s || !s.pts || !s.owner) continue;
      var hole = -1;
      for (var q = (s.have || 0); q < s.pts.length; q++) if (s.pts[q] === undefined) { hole = q; break; }
      if (hole < 0) continue;
      if ((s.askTries || 0) >= 12) continue; // 补发本身也会丢，多要几次；上限防止打风暴
      if (s.askAt && now - s.askAt < 400) continue;
      s.askAt = now;
      s.askTries = (s.askTries || 0) + 1;
      if (ui.room && ui.room.askInk) ui.room.askInk(s.owner, id, s.have || 0);
    }
  }

  /** 应用房主发来的回放（刷新 / 中途加入）：按 i0 落位后重绘。
   *  注意：回放常常比界面切到游戏屏更早到达，那时屏幕还没挂载、onPrivate 收不到，
   *  所以 render() 也要兜一次 —— 否则刷新回来看到的是白板。 */
  function applyReplay(obj) {
    if (obj && obj.round) local.replayRound = obj.round;   // 本回合已经拿到回放（自愈判断用）
    if (!obj || !obj.replay || !obj.replay.length) return false;
    local.strokes = []; local.byId = {}; local.curId = null;
    for (var i = 0; i < obj.replay.length; i++) {
      var ch = obj.replay[i];
      if (!ch || !ch.s) continue;
      var st = local.byId[ch.id];
      if (!st) { st = addStroke(ch.id, ch.color, ch.w, ch.r); st.pts = []; }
      // 按 i0 落位：房主存的块可能是补发补进去的、顺序不保证，按位合并才稳
      for (var k = 0; k < ch.s.length; k++) st.pts[(ch.i0 || 0) + k] = ch.s[k];
    }
    for (var j = 0; j < local.strokes.length; j++) {
      var s2 = local.strokes[j];
      var dense = [];                      // 稀疏数组要压紧，画布只认连续点
      for (var q = 0; q < s2.pts.length; q++) if (s2.pts[q] !== undefined) dense.push(s2.pts[q]);
      s2.pts = dense;
    }
    redrawAll();
    return true;
  }

  function dropStroke(id) {
    delete local.byId[id];
    local.strokes = local.strokes.filter(function (s) { return s.id !== id; });
    redrawAll();
  }

  /* ---------------- 画笔交互 ---------------- */
  /* 周期性自愈：公共 broker 是 QoS0，补发包本身也可能丢。
     只要还有笔带着洞，就隔一会儿再要一次补发 —— 否则「最后一块」丢了以后没人再触发，洞会永远留着。 */
  if (typeof setInterval === 'function') {
    setInterval(function () {
      if (!local.ui || !local.byId) return;
      for (var id in local.byId) {
        if (!Object.prototype.hasOwnProperty.call(local.byId, id)) continue;
        var s = local.byId[id];
        if (!s || !s.pts || !s.owner || !s.pts.length) continue;
        for (var q = (s.have || 0); q < s.pts.length; q++) {
          if (s.pts[q] === undefined) { sweepHoles(local.ui); return; }
        }
      }
      // 整段回放的自愈：在作画回合里、我不是画家、本回合的回放一张都没拿到 → 找房主要一次。
      // 上面那段只处理"笔画里有洞"，处理不了"整段都没收到"（刷新/丢了一次私密消息就会这样）。
      var ui = local.ui, st = ui.state;
      if (!st || !st.g || !st.g.cur || st.g.cur.phase !== 'draw') return;
      var mine = ui.pid ? ui.pid() : null;
      if (!mine) return;
      if (local.replayRound === st.g.round) return;      // 本回合已经拿到过了
      if (st.g.cur.painter === mine) {
        if (local.myWord) return;                        // 画家手里有词就不用要（刷新后才会丢）
      } else if (local.strokes && local.strokes.length) return;   // 猜词者手里有笔迹就不用要
      local.askReplay = local.askReplay || {};
      var asked = local.askReplay[st.g.round] || 0;
      if (asked >= 3) return;                            // 最多要 3 次，别刷屏
      if (Date.now() - (local.askAt || 0) < 2500) return;
      local.askReplay[st.g.round] = asked + 1;
      local.askAt = Date.now();
      ui.send({ t: 'need_replay' });
    }, 1200);
  }

  function bindPaint(ui) {
    local.ui = ui;
    var cv = local.canvas;
    if (!cv || cv.dataset.paint) return;
    cv.dataset.paint = '1';
    var drawing = false, lastPt = null;

    function flush(force) {
      var st = local.byId[local.curId];
      if (!st) return;
      var now = Date.now();
      if (!force && now - local.lastFlush < 55) return;
      if (local.sent >= st.pts.length) return;
      local.lastFlush = now;
      var i0 = local.sent; // 本块第一个点在整笔中的下标：对端据此落位、发现缺号
      var chunk = st.pts.slice(i0);
      local.sent = st.pts.length;
      ui.sendInk({ t: 'stroke', id: st.id, r: st.r, color: st.color, w: st.w, i0: i0, s: chunk });
    }

    function down(e) {
      if (!local.painter) return;
      if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return; // 只认左键
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      measureRect(cv); // 每笔开头量一次就够，中途不再触发布局
      local.painting = true; // 落笔期间冻结 DOM 重建：否则画布被拆 → 指针捕获丢失 → 断笔
      var p = toNorm(cv, e);
      var st = addStroke('k' + (++local.seq) + 'r' + local.round, local.style.color, local.style.w, local.round);
      st.pts.push(p);
      local.curId = st.id;
      local.sent = 0;
      local.lastFlush = Date.now();
      drawing = true;
      lastPt = p;
      paintStroke(st); // 单点先点出来
    }
    function move(e) {
      if (!drawing || !local.painter) return;
      e.preventDefault();
      var evts = null;
      try { if (e.getCoalescedEvents) evts = e.getCoalescedEvents(); } catch (err) {}
      if (!evts || !evts.length) evts = [e]; // 规范允许返回空列表；空 = 丢点，必须回退
      var st = local.byId[local.curId];
      if (!st) return;
      for (var i = 0; i < evts.length; i++) {
        var p = toNorm(cv, evts[i]);
        if (lastPt && p[0] === lastPt[0] && p[1] === lastPt[1]) continue;
        st.pts.push(p);
        lastPt = p;
      }
      paintTail(st, st.pts.length - evts.length);
      flush(false);
    }
    function up(e) {
      if (!drawing) return;

      local.painting = false;
      if (e && e.preventDefault) e.preventDefault();
      var st = local.byId[local.curId];
      if (st) {
        var r = local.rect || measureRect(cv);
        if (st.pts.length === 1 && r) {
          // 单击点：补一个极近的点，避免只有一个孤点
          st.pts.push([st.pts[0][0], st.pts[0][1]]);

        }
        flush(true);
      }
      local.curId = null;
      // 落笔期间被 deferRender 跳过的状态更新，现在补上（挪出事件回调，别在派发中途改 DOM）
      if (ui._renderPending) setTimeout(function () { ui.flushRender(); }, 0);

    cv.addEventListener('pointerdown', down);
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    // 拖到画布外：只要还持有指针捕获就继续画（越界坐标会被 clamp 在画布内），别把笔画截断
    cv.addEventListener('pointerleave', function (e) {

    });

  }

  /* ---------------- 聊天记录 ---------------- */
  function chatHtml(g) {
    var list = (g && g.chat) || [];
    var out = '';
    for (var i = 0; i < list.length; i++) {
      var m = list[i];
      if (m.k === 'sys') out += '<div class="dg-msg sys">' + esc(m.text) + '</div>';
      else out += '<div class="dg-msg ' + esc(m.k || 'msg') + '"><span class="who" style="color:' + hueOf(m.id) + '">' + esc(m.name || '') + '</span>' + esc(m.text || '') + '</div>';
    }
    return out;
  }

  /* ---------------- 屏幕 ---------------- */
  PN.screens = PN.screens || {};
  PN.screens.drawgame = {
    name: 'drawgame',
    wide: true,

    /** 落笔期间冻结 DOM 重建（见 ui.js deferRender 注释）：保住画布的指针捕获，笔画才不会中途断 */
    deferRender: function () { return !!local.painting; },

    /** 重绘前抢救输入草稿 + 滚动位置（否则每来一条消息就丢焦点） */
    beforeRender: function () {
      var inp = document.querySelector('.dg-input input');
      if (inp) {
        local.draft = inp.value;
        local.hadFocus = document.activeElement === inp;
      }
      var log = document.querySelector('.dg-log');
      if (log) local.logAtBottom = (log.scrollTop + log.clientHeight) >= (log.scrollHeight - 24);
    },

    /** 挂载后：此时才有真实尺寸 → 定缓冲区、绑画笔、恢复输入框 */
    mounted: function () {

      if (cv && root.ResizeObserver) {

      }
      var log = document.querySelector('.dg-log');
      if (log && local.logAtBottom) log.scrollTop = log.scrollHeight;
      var inp = document.querySelector('.dg-input input');
      if (inp && !inp.disabled) {
        if (local.draft) inp.value = local.draft;
        if (local.hadFocus) {
          inp.focus();
          try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
        }
      }
      // 曾经这里把 data-hint 属性（转义过的 <span> 源码）塞回 textContent，
      // 猜词者屏幕上就会显示 '<span class="u">＿</span>' 这种源码，而且每揭一个字跟着变一次。
      // innerHTML 已经渲染好了，不需要再补一刀。
    },

    render: function (state, secret) {
      var ui = this;
      var C = PN.gameCommon;
      var g = state.g || {};
      var cur = g.cur || {};
      var me = ui.pid();
      var wrap = ui.el('div');
      ui.renderTopbar(wrap);
      resetIfNewGame(g);

      var phase = cur.phase;
      var label = phase === 'pick' ? '画家选词' : (phase === 'draw' ? '画画时间' : (phase === 'reveal' ? '答案揭晓' : '本局结束'));
      wrap.appendChild(ui.h(C.gameHeader(ui, state, '🎨 你画我猜', label,
        cur.deadline ? C.deadlineChip(cur.deadline) : '<span class="pill">第 ' + (g.round || 0) + '/' + ((state.settings.drawgame || {}).rounds || 6) + ' 回合</span>')));

      if (g.done || !phase) {
        wrap.appendChild(ui.h(C.scoreboard(state, g.winner, '🏆 灵魂画手大赛结束')));
        wrap.appendChild(ui.h(C.overButtons(ui, 'drawgame')));
        wrap.appendChild(ui.renderGameFooter());
        PN.wireOver(wrap, ui);
        return wrap;
      }

      var painter = cur.painter;
      var iAmPainter = painter === me;
      var pName = '';
      if (state.players) for (var i = 0; i < state.players.length; i++) if (state.players[i].id === painter) pName = state.players[i].name;

      /* ---------- 选词阶段 ---------- */
      if (phase === 'pick') {
        if (iAmPainter && secret && secret.words) {
          var cards = secret.words.map(function (w, idx) {
            return '<button class="btn primary" data-word="' + idx + '" style="font-size:22px;padding:16px">' + esc(w) + '</button>';
          }).join('');
          wrap.appendChild(ui.h('<div class="card center"><div class="pill">你是画家 🎨</div>' +
            '<div class="muted mt8">选一个你要画的词（' + (secret.drawSec || 90) + ' 秒）：</div>' +
            '<div class="grid2 mt16">' + cards + '</div></div>'));
          wrap.querySelectorAll('[data-word]').forEach(function (b) {
            b.addEventListener('click', function () {
              local.myWord = b.textContent;
              ui.send({ t: 'pick', i: Number(b.getAttribute('data-word')) });
            });
          });
        } else {
          wrap.appendChild(ui.h('<div class="card center"><div class="bigword">🎨</div><div class="muted">画家 <b>' + esc(pName) + '</b> 正在选词…</div></div>'));
        }
        wrap.appendChild(ui.renderGameFooter());
        return wrap;
      }

      /* ---------- 画布 + 聊天 双栏 ---------- */
      var dg = ui.el('div', 'dg');
      var main = ui.el('div', 'dg-main');

      var hintRow = ui.el('div', 'dg-hint');
      if (phase === 'reveal') {
        hintRow.innerHTML = '<span class="tag">答案</span><span class="w">' + esc(cur.reveal || local.myWord || '??') + '</span>';
      } else if (iAmPainter) {
        var w = local.myWord || (secret && secret.answer) || '??';
        hintRow.innerHTML = '<span class="tag">你要画</span><span class="w">' + esc(w) + '</span>';
      } else {
        hintRow.innerHTML = '<span class="tag">' + (cur.wordLen || 0) + ' 个字</span><span data-hint="' + esc(maskHtml(g, cur)) + '">' + maskHtml(g, cur) + '</span>';
      }
      main.appendChild(hintRow);

      var stage = ui.el('div', 'dg-stage' + (iAmPainter && phase === 'draw' ? '' : ' locked'));
      var c = ensureCanvas(ui);
      stage.appendChild(c);
      main.appendChild(stage);
      // 这里只量尺寸就够了：画布节点是复用的，位图还在，无需每次状态消息都整幅重绘
      // （笔画最多 900 段，聊天每来一条就全量重绘会明显卡）。真需要重绘时 sizeCanvas() 会自己做。
      sizeCanvas();
      // 刷新 / 中途加入：回放常常在界面切到游戏屏之前就到了（那时屏幕还没挂载、收不到 onPrivate），
      // 这里兜一次，否则刷新回来看到的是一片白板。
      if (secret && secret.replay && !local.strokes.length) applyReplay(secret);

      /* ---------- 画家工具条 ---------- */
      if (iAmPainter && phase === 'draw') {
        local.painter = true;
        var tools = ui.el('div', 'dg-tools');
        COLORS.forEach(function (col, idx) {
          var s = ui.el('button', 'swatch' + (idx === 2 ? ' eraser' : '') + (local.style.color === col ? ' sel' : ''));
          if (idx !== 2) s.style.background = col;
          s.title = idx === 2 ? '橡皮' : col;
          s.addEventListener('click', function () {
            local.style.color = col;
            tools.querySelectorAll('.swatch').forEach(function (x) { x.classList.remove('sel'); });
            s.classList.add('sel');
          });
          tools.appendChild(s);
        });
        tools.appendChild(ui.el('span', 'sep'));
        WIDTHS.forEach(function (wd) {
          var b = ui.el('button', 'btn ghost sizew' + (local.style.w === wd ? ' primary' : ''));
          var dot = ui.el('i');
          dot.style.width = dot.style.height = Math.max(4, wd) + 'px';
          b.appendChild(dot);
          b.addEventListener('click', function () {
            local.style.w = wd;
            tools.querySelectorAll('.sizew').forEach(function (x) { x.classList.remove('primary'); });
            b.classList.add('primary');
          });
          tools.appendChild(b);
        });

  UI.prototype.begin = function (name, emoji, join) {

        brokerIndex: brokerIndex,
        onStatus: function (s, d) {

        onRoster: function (list, kind, peerId) {

            //（公共 broker 抖一下、retained 还没到就为空）。以前 lastState 一空就 fresh()，

  UI.prototype.onEvent = function (ev) {
    // 换主后新房主手里的回放记录是空的：让它自己的屏幕把笔迹重报一遍（见 drawgame.resume）
    if (ev.t === 'recover_ink') {
      if (this.screen && this.screen.onRecover) this.screen.onRecover.call(this, { ink: true, round: ev.round });
      return;
    }
    if (ev.t === 'descAll') { this.toast('描述揭晓，开始投票！'); return; }
    if (ev.t === 'voteResult') { this.toast('投票结果出炉'); return; }
    if (ev.t === 'gameover') {
      this.toast(ev.msg || '本局结束！', 'good');
      if (ev.sfx) this.beep(ev.sfx);
      return;
    }
    if (ev.t === 'question') { this.toast('🃏 ' + (ev.q || '')); return; }
    if (ev.t === 'correct') { this.toast('✅ ' + (ev.text || '') + '！' + (ev.who ? ' ' + ev.who + ' 答对了' : ''), 'good'); this.beep('win'); return; }
    if (ev.t === 'reveal') { this.toast('答案：' + (ev.answer || ev.target || '') + (ev.clue ? '（线索：' + ev.clue + '）' : ''), 'good'); this.beep('win'); return; }
    if (ev.t === 'round') { this.toast(ev.msg || '新回合'); return; }
    if (ev.t === 'toast') { this.toast(ev.text || '', ev.kind); return; }

  UI.prototype.beep = function (kind) {

  UI.prototype.renderLobby = function (state) {

    var GC = PN.gameCommon;

      var isMini = sec.group === 'mini';

        if (isMini) {

        return GC.gameCard({
          kind: 'online', id: it.id, emoji: it.emoji, title: it.title, desc: it.desc,
          tags: it.tags, players: it.players,
          actions: '<div class="row mt8"><button class="btn sm ghost" data-act="cfg">⚙️</button>' +
            '<button class="btn primary sm go" data-act="start" ' + (self.isHost() ? '' : 'disabled') + '>' +
            (self.isHost() ? '开始' : '等房主开') + '</button></div>' +

      // 名册与「复制链接」并成一行，避免两条通栏横向全是空白。
      '<div class="card roster">' +
      '<div class="players">' + (playersHtml || '<span class="muted">还差一个人，把对方叫进来吧～</span>') + '</div>' +
      '<span class="spacer"></span>' +
      '<button class="btn sm" id="pn-copy">📋 复制链接</button>' +
      '<button class="btn sm" id="pn-share">📤</button>' +
      '</div>' +

    var miniSec = wrap.querySelector('.mini-sec');

    wrap.querySelectorAll('.mini-card').forEach(function (card) {

        var online = (self.state && self.state.players ? self.state.players : []).filter(function (p) { return p.online; }).length;

          var values = {};

          card.querySelectorAll('.cfg[data-key="' + ctl.dataset.key + '"]').forEach(function (x) { x.classList.remove('on'); });
          ctl.classList.add('on');

  UI.prototype.settingsHtml = function (mode, s) {
    var st = (s.settings && s.settings[mode]) || {};
    var rows = [];
    var seg = function (label, key, opts) {
      var cur = String(st[key]);
      return '<div class="setrow"><span>' + label + '</span><div class="seg">' + opts.map(function (o) {
        return '<button class="cfg ' + (String(o[0]) === cur ? 'on' : '') + '" data-key="' + key + '" data-val="' + o[0] + '">' + o[1] + '</button>';
      }).join('') + '</div></div>';
    };
    if (mode === 'cube') {
      rows.push(seg('局数', 'rounds', [[1, '1 个'], [2, '2 个'], [3, '3 个']]));
    } else     if (mode === 'tile2048') {
      rows.push(seg('局数', 'rounds', [[1, '1 局'], [2, '2 局'], [3, '3 局']]));
    } else if (mode === 'domino') {
      rows.push(seg('局数', 'rounds', [[1, '1 局'], [3, '3 局'], [5, '5 局']]));
    } else if (mode === 'soko') {
      rows.push(seg('关卡数', 'levels', [[3, '3 关'], [5, '5 关'], [10, '10 关全通']]));
    } else if (mode === 'mine') {
      rows.push(seg('难度', 'level', [[1, '9×9 · 10 雷'], [2, '12×12 · 24 雷'], [3, '15×15 · 40 雷']]));
      rows.push(seg('团队命数', 'lives', [[1, '1 条'], [3, '3 条'], [5, '5 条']]));
    } else if (mode === 'hop') {
      rows.push(seg('轮数', 'rounds', [[1, '1 轮'], [2, '2 轮'], [3, '3 轮'], [5, '5 轮']]));
      rows.push(seg('每人命数', 'lives', [[1, '1 条命'], [3, '3 条命'], [5, '5 条命']]));
    } else if (mode === 'gomoku') {
      rows.push(seg('棋盘', 'size', [[9, '9×9 快棋'], [13, '13×13'], [15, '15×15 标准']]));
    } else if (mode === 'codraw') {
      rows.push(seg('题数', 'rounds', [[2, '2 题'], [3, '3 题'], [4, '4 题']]));
      rows.push(seg('每题作画', 'sec', [[45, '45 秒'], [60, '60 秒'], [90, '90 秒']]));
    } else if (mode === 'memory') {
      rows.push(seg('对数', 'pairs', [[4, '4 对'], [6, '6 对'], [8, '8 对']]));
    } else if (mode === 'tacit') {
      rows.push(seg('题目数量', 'rounds', [[6, '6'], [8, '8'], [10, '10'], [12, '12']]));
    } else if (mode === 'drawgame') {
      rows.push(seg('总回合', 'rounds', [[3, '3'], [6, '6'], [9, '9']]));
      rows.push(seg('画画时长', 'drawSec', [[60, '60s'], [90, '90s'], [120, '120s']]));
    }
    return rows.join('');
  };

/* ===== 应用入口 ===== */
(function (root) {
  'use strict';
  var PN = root.PN = root.PN || {};

  /* ===== 迭代机制（阶段四）：版本对账 + 更新提示 =====
   * build 会把版本号写进产物（PN.VERSION / meta）并在根目录与 dist 生成 version.json。
   * 打开页面、以及切回前台时对一下：线上版本更新了就提示刷新（GitHub Pages 有缓存，
   * 不刷新拿不到新产物）。拿不到 version.json（比如离线、或只开 dist 里的文件）就静默跳过。 */
  var lastCheck = 0;
  function checkVersion(force) {
    if (typeof fetch !== 'function' || !PN.VERSION) return;
    var now = Date.now();
    if (!force && now - lastCheck < 60000) return;   // 一分钟最多查一次
    lastCheck = now;
    fetch('version.json?t=' + now, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.version || j.version === PN.VERSION) return;
        if (document.getElementById('pn-update')) return;
        var el = document.createElement('div');
        el.id = 'pn-update';
        el.className = 'update-tip';
        el.innerHTML = '<span>🎁 有新版本 <b>' + j.version + '</b>（你在用 ' + PN.VERSION + '）' +
          (j.builtAt ? ' · ' + String(j.builtAt).slice(5, 16).replace('T', ' ') : '') + '</span>' +
          '<button class="btn sm primary" id="pn-update-go">刷新看看</button>';
        document.body.appendChild(el);
        document.getElementById('pn-update-go').addEventListener('click', function () { location.reload(); });
      })
      .catch(function () {});                        // 静默失败：更新提示不该影响正常玩
  }
  PN.checkVersion = checkVersion;

  function boot() {
    var ui = new PN.UI();
    PN.app = ui;
    ui.renderLand();
    checkVersion(true);
    if (typeof document.addEventListener === 'function') {
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) checkVersion(false);   // 切回前台时顺手看一眼
      });
    }
    var wrapErr = function (e) {
      console.error(e);
      document.getElementById('pn-root').innerHTML =
        '<div class="land"><div class="biglogo">🛠️</div><h1>启动失败</h1>' +
        '<div class="sub">' + (e && e.message ? e.message : '未知错误') + '（刷新重试）</div></div>';
    };
    window.addEventListener('error', function (e) {
      // 只在致命阶段兜底，不打扰游戏内小错
      if (!PN.app || !PN.app.room) wrapErr(e.error || e);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof globalThis !== 'undefined' ? globalThis : this);
