<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0e1a">
<title>群友派对之夜</title>
<style id="pncss">/* ===== 群友派对之夜：手机优先、派对感深色主题 ===== */
:root{
  --bg:#0b0e1a; --bg2:#12162b; --card:#181d38; --card2:#1f2547;
  --ink:#eef1ff; --ink2:#9aa3c7; --line:rgba(255,255,255,.08);
  --acc:#ffd166; --acc2:#ff6b6b; --good:#52e3a4; --bad:#ff7b9c;
  --blue:#6ea8ff; --r:18px; --r2:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC",system-ui,sans-serif;
  height:100%;overscroll-behavior:none}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #27306b 0%, transparent 60%),
             radial-gradient(800px 500px at 90% 110%, #3b1d4f 0%, transparent 55%), var(--bg);
}
#pn-root{max-width:640px;margin:0 auto;min-height:100%;padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom)+70px)}
button{font:inherit;color:inherit;border:none;cursor:pointer;background:none}
input{font:inherit}
.hidden{display:none!important}

/* 顶部栏 */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:10px 2px;backdrop-filter:blur(10px);background:rgba(11,14,26,.72)}
.topbar .logo{font-size:20px}
.topbar .title{font-weight:800;font-size:17px;letter-spacing:.5px}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.chip b{color:var(--ink);font-family:ui-monospace,Menlo,monospace;letter-spacing:1.5px}
.chip:active{transform:scale(.96)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink2);display:inline-block}
.dot.ok{background:var(--good);box-shadow:0 0 8px var(--good)}
.dot.warn{background:var(--acc)}

/* 落地页 */
.land{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:12vh}
.biglogo{font-size:64px;animation:pop 1.6s ease infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(-6deg)}}
.land h1{margin:12px 0 4px;font-size:26px;letter-spacing:1px}
.land .sub{color:var(--ink2);font-size:13px;margin-bottom:28px}
.field{width:100%;max-width:340px;margin:0 auto 14px;text-align:left}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border-radius:var(--r2);border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;outline:none}
.field input:focus{border-color:var(--blue)}
.emoji-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0 10px}
.emoji-row .e{font-size:22px;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.emoji-row .e.sel{border-color:var(--acc);background:var(--card2);box-shadow:0 0 0 2px rgba(255,209,102,.25)}

/* 通用卡片/按钮 */
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;
  border-radius:var(--r2);background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#ffd166,#ff9f43);color:#3a2200;border:none;
  box-shadow:0 6px 20px rgba(255,159,67,.28)}
.btn.ghost{background:transparent}
.btn.warn{background:rgba(255,123,156,.14);border-color:rgba(255,123,156,.4);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt8{margin-top:8px}.mt16{margin-top:16px}

/* 大厅 */
.roomcode{display:flex;align-items:center;gap:10px;padding:6px}
.roomcode .code{font-size:34px;font-weight:900;letter-spacing:10px;font-family:ui-monospace,Menlo,monospace;
  color:var(--acc);text-shadow:0 0 24px rgba(255,209,102,.35)}
.players{display:flex;flex-wrap:wrap;gap:10px}
.player{width:calc(20% - 8px);min-width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 6px;border-radius:var(--r2);background:var(--card2);border:1px solid var(--line);position:relative}
.player .em{font-size:26px}
.player .nm{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .sc{font-size:10px;color:var(--ink2)}
.player.me{border-color:var(--acc)}
.player.host:after{content:"房主";position:absolute;top:-7px;right:-4px;font-size:9px;padding:2px 6px;
  border-radius:999px;background:var(--acc);color:#3a2200;font-weight:800}
.player.off{opacity:.38;filter:grayscale(.8)}
.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modecard{position:relative;padding:16px 14px;border-radius:var(--r);background:linear-gradient(165deg,var(--card),var(--bg2));
  border:1px solid var(--line);text-align:left;overflow:hidden}
.modecard .ico{font-size:30px}
.modecard .nm{font-weight:800;font-size:16px;margin-top:6px}
.modecard .blurb{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.5}
.modecard .go{margin-top:10px}
.settings{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.settings.open{display:block}
.setrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--ink2)}
.setrow .val{color:var(--acc);font-weight:700}
.seg{display:flex;gap:4px;background:var(--bg2);padding:3px;border-radius:10px}
.seg button{padding:6px 10px;font-size:12px;border-radius:8px;color:var(--ink2)}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]{width:120px;accent-color:var(--acc)}

/* 通用游戏屏 */
.ghead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 6px;gap:4px}
.gh-title{font-size:22px;font-weight:900}
.gh-phase{font-size:13px;color:var(--ink2)}
.pill{display:inline-flex;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);
  font-size:12px;color:var(--ink2)}
.timer{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:800}
.bigword{font-size:38px;font-weight:900;letter-spacing:4px;text-align:center;color:var(--acc);
  text-shadow:0 0 30px rgba(255,209,102,.35);margin:10px 0}
.center{text-align:center}
.muted{color:var(--ink2);font-size:13px}
.players-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pickable{padding:12px 14px;border-radius:var(--r2);background:var(--card2);border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px}
.pickable.sel{border-color:var(--acc);background:rgba(255,209,102,.12)}
.pickable .em{font-size:24px}
.dead{opacity:.35;filter:grayscale(1);text-decoration:line-through}

/* 日志/公告 */
.toasts{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;
  gap:8px;align-items:center;pointer-events:none;width:min(92vw,560px)}
.toast{background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);animation:slidein .25s ease}
.toast.good{border-color:var(--good)}.toast.bad{border-color:var(--bad)}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}

/* 描述/投票列表 */
.list{display:flex;flex-direction:column;gap:10px}
.listitem{background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px}
.listitem .who{font-size:12px;color:var(--ink2);margin-bottom:4px}
.listitem .what{font-size:15px;line-height:1.5;word-break:break-word}

/* 输入条 */
.inputbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(env(safe-area-inset-bottom)+10px);
  background:linear-gradient(transparent,rgba(11,14,26,.92) 30%);max-width:640px;margin:0 auto;display:flex;gap:8px}
.inputbar input{flex:1;padding:13px 16px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;outline:none}
.inputbar .btn{border-radius:999px}

/* 波长 */
.wave-bar{position:relative;height:56px;border-radius:16px;margin:18px 4px;
  background:linear-gradient(90deg,#3ec1ff,#8f7bff 40%,#ff7b9c 75%,#ffb03a)}
.wave-track{position:absolute;inset:0;touch-action:none}
.wave-knob{position:absolute;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);
  border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#111}
.wave-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);padding:0 2px}
.wave-labels b{color:var(--ink);font-size:15px}
.marker{position:absolute;top:-10px;bottom:-10px;width:4px;border-radius:2px;background:#fff;transform:translateX(-50%);
  box-shadow:0 0 10px #fff}

/* 画猜 */
#pn-root.wide{max-width:1080px}
.dg{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
@media (min-width:820px){ .dg{grid-template-columns:minmax(0,1fr) 310px;align-items:start} }
.dg-main{min-width:0}
.dg-stage{position:relative;width:100%;max-width:min(100%,58vh);aspect-ratio:1/1;margin:0 auto;
  background:#fff;border-radius:var(--r);overflow:hidden;touch-action:none;
  box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.08)}
.dg-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
.dg-stage.locked canvas{cursor:default}
.dg-hint{display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;margin:2px 0 8px;
  font-size:22px;font-weight:800;letter-spacing:.22em;color:var(--ink)}
.dg-hint .w{color:#ffd93d}
.dg-hint .u{color:rgba(255,255,255,.34)}
.dg-hint .tag{font-size:13px;font-weight:600;letter-spacing:0;color:var(--ink2);background:var(--card2);
  border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.dg-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:10px}
.dg-tools .sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.22);padding:0}
.swatch.sel{border-color:#fff;box-shadow:0 0 0 2px var(--acc);transform:scale(1.08)}
.swatch.eraser{background:#fff;position:relative}
.swatch.eraser::after{content:'🧽';position:absolute;inset:0;font-size:15px;line-height:26px;text-align:center}
.sizew{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0}
.sizew i{display:block;background:currentColor;border-radius:50%}
.dg-side{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;min-height:0}
.dg-log{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;
  height:min(38vh,300px);-webkit-overflow-scrolling:touch}
@media (max-width:819px){ .dg-log{height:190px} }
.dg-msg{font-size:14px;line-height:1.45;word-break:break-word;color:var(--ink)}
.dg-msg .who{font-weight:800;margin-right:5px}
.dg-msg.ok{color:var(--good)}
.dg-msg.near{color:#ffb03a}
.dg-msg.sys{color:var(--ink2);font-style:italic}
.dg-input{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line);background:var(--card2)}
.dg-input input{flex:1;min-width:0;padding:12px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;outline:none}
.dg-input input:disabled{opacity:.55}
.dg-input .btn{border-radius:999px;padding:12px 18px}

/* 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(5,7,16,.72);backdrop-filter:blur(4px);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;width:100%;max-width:420px}

/* 计分板 */
.scoreboard{display:flex;flex-direction:column;gap:8px}
.sbrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r2);background:var(--card2);
  border:1px solid var(--line)}
.sbrow .rank{font-weight:900;color:var(--acc);width:20px}
.sbrow .em{font-size:20px}
.sbrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbrow .pts{font-weight:800;font-variant-numeric:tabular-nums}
.sbrow.top{background:rgba(255,209,102,.12);border-color:rgba(255,209,102,.4)}

@media (max-width:360px){ .player{width:calc(25% - 8px)} .modegrid{grid-template-columns:1fr} }
</style>
</head>

      '<button class="btn sm" id="pn-share">📤</button>' +
      '</div>' +
      '<div class="card"><div class="muted" style="margin-bottom:10px">在房里的群友（' + (s.players || []).length + '）</div>' +
      '<div class="players">' + (playersHtml || '<div class="muted">还没人，快拉人！</div>') + '</div></div>' +
      '<div class="modegrid">' + modes.join('') + '</div>' +
      '<div class="row mt16" style="justify-content:center;gap:8px">' +
      '<button class="btn ghost sm" id="pn-edit">✏️ 改昵称</button>' +
      (self.isHost() ? '<button class="btn warn sm" id="pn-reset">清零积分</button><button class="btn warn sm" id="pn-disband">解散房间</button>' : '<button class="btn warn sm" id="pn-leave">离开</button>') +
      '</div>' +
      '</div>'
    ));
    $('#pn-copy').addEventListener('click', function () { self.copyLink(); });
    $('#pn-share').addEventListener('click', function () { self.share(); });
    $('#pn-edit').addEventListener('click', function () { self.editProfile(); });
    var reset = $('#pn-reset'); if (reset) reset.addEventListener('click', function () { if (confirm('清零所有人积分？')) self.send({ t: 'resetScores' }); });
    var dis = $('#pn-disband'); if (dis) dis.addEventListener('click', function () { if (confirm('解散房间？所有人都要重进')) { self.room.leave(true); location.reload(); } });
    var lv = $('#pn-leave'); if (lv) lv.addEventListener('click', function () { self.room.leave(false); location.reload(); });
    var cards = wrap.querySelectorAll('.modecard');
    cards.forEach(function (card) {
      var mode = card.dataset.mode;
      card.querySelector('[data-act="cfg"]').addEventListener('click', function () {
        var cfg = $('#cfg-' + mode);
        if (cfg) cfg.classList.toggle('open');
      });
      card.querySelector('[data-act="start"]').addEventListener('click', function () {
        self.send({ t: 'start', mode: mode });
      });
      card.querySelectorAll('.cfg').forEach(function (ctl) {
        ctl.addEventListener('click', function () {
          var raw = ctl.dataset.val;
          var v;
          if (raw === 'true') v = true; else if (raw === 'false') v = false; else if (!isNaN(Number(raw))) v = Number(raw); else v = raw;
          var values = {};
          values[ctl.dataset.key] = v;
          self.send({ t: 'settings', values: values });
          card.querySelectorAll('.cfg[data-key="' + ctl.dataset.key + '"]').forEach(function (x) { x.classList.remove('on'); });
          ctl.classList.add('on');
        });
      });
    });
    return wrap;
  };

  UI.prototype.settingsHtml = function (mode, s) {
    var st = (s.settings && s.settings[mode]) || {};
    var rows = [];
    var seg = function (label, key, opts) {
      var cur = String(st[key]);
      return '<div class="setrow"><span>' + label + '</span><div class="seg">' + opts.map(function (o) {
        return '<button class="cfg ' + (String(o[0]) === cur ? 'on' : '') + '" data-key="' + key + '" data-val="' + o[0] + '">' + o[1] + '</button>';
      }).join('') + '</div></div>';
    };
    if (mode === 'undercover') {
      rows.push(seg('卧底人数', 'numUnder', [[1, '1 个'], [2, '2 个']]));
      rows.push(seg('加白板', 'blank', [[false, '关'], [true, '开']]));
      rows.push(seg('描述方式', 'textMode', [[true, '打字'], [false, '开口说']]));
      rows.push(seg('每轮时长', 'roundSec', [[90, '90s'], [180, '180s'], [300, '300s']]));
    } else if (mode === 'wavelength') {
      rows.push(seg('总局数', 'rounds', [[4, '4'], [6, '6'], [8, '8'], [10, '10']]));
    } else if (mode === 'mostlikely') {
      rows.push(seg('总题数', 'rounds', [[6, '6'], [8, '8'], [10, '10'], [12, '12']]));
      rows.push(seg('每题时长', 'eachSec', [[20, '20s'], [30, '30s'], [45, '45s']]));
    } else if (mode === 'drawgame') {
      rows.push(seg('总回合', 'rounds', [[3, '3'], [6, '6'], [9, '9']]));
      rows.push(seg('画画时长', 'drawSec', [[60, '60s'], [90, '90s'], [120, '120s']]));
    }
    return rows.join('');
  };

  UI.prototype.editProfile = function () {
    var self = this;
    this.root.appendChild(this.h(
      '<div class="overlay"><div class="modal">' +
      '<div class="center" style="font-weight:800;margin-bottom:14px">✏️ 改昵称</div>' +
      '<div class="field"><input id="pn-ename" maxlength="12" value="' + this.me().name + '"></div>' +
      '<div class="row mt16"><button class="btn ghost block" id="pn-ecancel">取消</button>' +
      '<button class="btn primary block" id="pn-esave">保存</button></div>' +
      '</div></div>'
    ));
    $('#pn-ecancel').addEventListener('click', function () { document.querySelector('.overlay').remove(); });
    $('#pn-esave').addEventListener('click', function () {
      var name = $('#pn-ename').value.trim() || '神秘群友';
      self.room.me.name = name;
      self.local('name', name);
      self.send({ t: 'setProfile', name: name, emoji: self.me().emoji });
      document.querySelector('.overlay').remove();
      self.render();
    });
  };

  PN.UI = UI;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ===== src/app.js ===== */
/* ===== 应用入口 ===== */
(function (root) {
  'use strict';
  var PN = root.PN = root.PN || {};

  function boot() {
    var ui = new PN.UI();
    PN.app = ui;
    ui.renderLand();
    var wrapErr = function (e) {
      console.error(e);
      document.getElementById('pn-root').innerHTML =
        '<div class="land"><div class="biglogo">🛠️</div><h1>启动失败</h1>' +
        '<div class="sub">' + (e && e.message ? e.message : '未知错误') + '（刷新重试）</div></div>';
    };
    window.addEventListener('error', function (e) {
      // 只在致命阶段兜底，不打扰游戏内小错
      if (!PN.app || !PN.app.room) wrapErr(e.error || e);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
