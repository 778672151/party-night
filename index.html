<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fff4f9">
<title>两个人的游戏厅</title>
<style id="pncss">/* ===== 两个人的游戏厅：二次元 Q 弹可爱风 =====
   设计要点：马卡龙奶油底 + 白色圆角卡片 + 二次元粗描边 +「实体按钮」按压回弹（Q 弹）+ 轻微光泽。 */
:root{
  /* 马卡龙奶油色板 */
  --bg:#fff4f9; --bg2:#ffe9f3; --card:#ffffff; --card2:#fff7fb;
  --ink:#4b3a63; --ink2:#a08cb8;
  --line:#ffd7e8; --stroke:#6b5588;
  --acc:#ff8fb8; --acc2:#8ad7ff; --good:#5fd6a8; --bad:#ff8fa3;
  --blue:#8ad7ff; --yellow:#ffd86b; --purple:#c9a7ff;
  --r:26px; --r2:18px;
  --pop:0 6px 0 rgba(107,85,136,.18), 0 14px 26px rgba(255,143,184,.22);   /* 立体贴纸感 */
  --soft:0 6px 18px rgba(255,143,184,.18);
  --spring:cubic-bezier(.34,1.56,.64,1);                                   /* 过冲回弹：Q 弹的关键 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Yuanti SC","圆体-简","Hiragino Maru Gothic ProN","HarmonyOS Sans SC","PingFang SC","MiSans",system-ui,sans-serif;
  height:100%;overscroll-behavior:none;font-weight:600}
body{
  /* 奶油粉底 + 淡淡的二次元网点 */
  background:
    radial-gradient(closest-side, rgba(255,255,255,.75), transparent) 0 0/26px 26px,
    radial-gradient(closest-side, rgba(255,214,232,.55), transparent) 13px 13px/26px 26px,
    radial-gradient(900px 520px at 50% -12%, #ffe3f1 0%, transparent 62%),
    radial-gradient(760px 480px at 92% 108%, #e6f6ff 0%, transparent 58%),
    var(--bg);
}
#pn-root{max-width:640px;margin:0 auto;min-height:100%;padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom)+70px)}
button{font:inherit;color:inherit;border:none;cursor:pointer;background:none}
input{font:inherit}
.hidden{display:none!important}

/* 顶部栏 */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:10px 2px;backdrop-filter:blur(10px);background:rgba(255,244,249,.78)}
.topbar .logo{font-size:20px;animation:qfloat 2.6s var(--spring) infinite}
.topbar .title{font-weight:900;font-size:17px;letter-spacing:.5px}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;
  background:var(--card);border:2px solid var(--line);font-size:12.5px;color:var(--ink2);
  box-shadow:0 3px 0 rgba(107,85,136,.10)}
.chip b{color:var(--ink);font-family:ui-monospace,Menlo,monospace;letter-spacing:1.5px}
.chip:active{transform:translateY(2px) scale(.97)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink2);display:inline-block}
.dot.ok{background:var(--good);box-shadow:0 0 8px var(--good)}
.dot.warn{background:var(--yellow)}

/* 落地页 */
.land{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:10vh}
.biglogo{font-size:72px;animation:qbounce 2.2s var(--spring) infinite;filter:drop-shadow(0 8px 14px rgba(255,143,184,.35))}
@keyframes qbounce{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-10px) scale(1.06) rotate(-5deg)}60%{transform:translateY(0) scale(.97)}}
@keyframes qfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.land h1{margin:10px 0 4px;font-size:27px;letter-spacing:1px;font-weight:900;
  background:linear-gradient(135deg,#ff8fb8,#c9a7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.land .sub{color:var(--ink2);font-size:13px;margin-bottom:26px}
.field{width:100%;max-width:340px;margin:0 auto 14px;text-align:left}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;padding:13px 16px;border-radius:var(--r2);border:2px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;outline:none;box-shadow:inset 0 2px 0 rgba(107,85,136,.04)}
.field input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,143,184,.18)}
.emoji-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0 10px}
.emoji-row .e{font-size:22px;padding:8px;border-radius:14px;background:var(--card);border:2px solid var(--line);
  box-shadow:0 3px 0 rgba(107,85,136,.10)}
.emoji-row .e.sel{border-color:var(--acc);background:#fff0f6;box-shadow:0 3px 0 rgba(255,143,184,.45);transform:translateY(-2px)}

/* 通用卡片 / 按钮：按钮是「实体贴纸」，按下沉下去再弹回来 = Q 弹 */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;
  box-shadow:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;
  border-radius:999px;background:var(--card);border:2px solid var(--stroke);font-weight:800;font-size:15px;
  box-shadow:0 4px 0 var(--stroke);transition:transform .12s var(--spring),box-shadow .12s ease}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--stroke)}
.btn.primary{background:linear-gradient(160deg,#ffb3cf,#ff8fb8);color:#fff;border-color:#e2679a;
  box-shadow:0 4px 0 #e2679a,0 10px 18px rgba(255,143,184,.35)}
.btn.primary:active{box-shadow:0 0 0 #e2679a}
.btn.ghost{background:rgba(255,255,255,.7);border-color:var(--line);box-shadow:0 3px 0 rgba(107,85,136,.10);color:var(--ink2)}
.btn.warn{background:#fff0f3;border-color:#ffb8c6;color:#e2607a;box-shadow:0 4px 0 #ffb8c6}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:999px;box-shadow:0 3px 0 var(--stroke)}
.btn.sm.ghost{box-shadow:0 3px 0 rgba(107,85,136,.10)}
.btn:disabled{opacity:.45;pointer-events:none;box-shadow:none}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt8{margin-top:8px}.mt16{margin-top:16px}

/* 大厅 */
.roomcode{display:flex;align-items:center;gap:10px;padding:6px}
.roomcode .code{font-size:34px;font-weight:900;letter-spacing:10px;font-family:ui-monospace,Menlo,monospace;
  color:var(--acc);text-shadow:0 3px 0 rgba(255,143,184,.28)}
.players{display:flex;flex-wrap:wrap;gap:10px}
.player{width:calc(50% - 5px);display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:12px 6px;border-radius:var(--r2);background:var(--card2);border:2px solid var(--line);position:relative;
  animation:qpop .34s var(--spring) both}
@keyframes qpop{from{opacity:0;transform:scale(.86) translateY(6px)}60%{opacity:1;transform:scale(1.03)}to{transform:scale(1)}}
.player .em{font-size:30px}
.player .nm{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .sc{font-size:11px;color:var(--ink2)}
.player.me{border-color:var(--acc);background:#fff0f6;box-shadow:0 4px 0 rgba(255,143,184,.35)}
.player.host:after{content:"房主";position:absolute;top:-8px;right:-4px;font-size:9px;padding:2px 7px;
  border-radius:999px;background:var(--yellow);color:#7a5a00;font-weight:900;border:2px solid var(--stroke)}
.player.off{opacity:.45;filter:grayscale(.7)}
.modegrid{display:grid;grid-template-columns:1fr;gap:12px}
.modecard{position:relative;padding:18px 16px;border-radius:var(--r);background:var(--card);
  border:2px solid var(--stroke);text-align:left;overflow:hidden;box-shadow:var(--pop);animation:qpop .4s var(--spring) both}
.modecard:before{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,143,184,.22),transparent)}
.modecard .ico{font-size:34px;animation:qfloat 3s var(--spring) infinite}
.modecard .nm{font-weight:900;font-size:18px;margin-top:6px}
.modecard .blurb{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.55}
.modecard .go{margin-top:12px}
.settings{display:none;margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.settings.open{display:block;animation:qpop .3s var(--spring) both}
.setrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--ink2)}
.setrow .val{color:var(--acc);font-weight:800}
.seg{display:flex;gap:4px;background:var(--bg2);padding:3px;border-radius:999px}
.seg button{padding:6px 12px;font-size:12px;border-radius:999px;color:var(--ink2);font-weight:800}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:0 2px 0 rgba(255,143,184,.35);transform:scale(1.04)}
input[type=range]{width:120px;accent-color:var(--acc)}

/* 通用游戏屏 */
.ghead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 0 6px;gap:4px}
.gh-title{font-size:23px;font-weight:900}
.gh-phase{font-size:13px;color:var(--ink2)}
.pill{display:inline-flex;padding:4px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line);
  font-size:12px;color:var(--ink2)}
.timer{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:900}
.timer.hot{animation:qwiggle .5s var(--spring) infinite}
@keyframes qwiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bigword{font-size:40px;font-weight:900;letter-spacing:4px;text-align:center;color:var(--acc);
  text-shadow:0 3px 0 rgba(255,143,184,.28);margin:10px 0;animation:qpop .4s var(--spring) both}
.center{text-align:center}
.muted{color:var(--ink2);font-size:13px}
.players-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pickable{padding:12px 14px;border-radius:var(--r2);background:var(--card);border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px;font-weight:800}
.pickable.sel{border-color:var(--acc);background:#fff0f6;transform:translateY(-2px);box-shadow:0 4px 0 rgba(255,143,184,.35)}
.pickable .em{font-size:26px}
.dead{opacity:.4;filter:grayscale(1);text-decoration:line-through}

/* 提示条 */
.toasts{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;
  gap:8px;align-items:center;pointer-events:none;width:min(92vw,560px)}
.toast{background:var(--card);border:2px solid var(--stroke);padding:10px 18px;border-radius:999px;font-size:14px;
  font-weight:800;box-shadow:0 5px 0 rgba(107,85,136,.16),var(--soft);animation:qdrop .32s var(--spring)}
.toast.good{border-color:var(--good);color:#1f8f68}
.toast.bad{border-color:var(--bad);color:#d1576f}
@keyframes qdrop{from{opacity:0;transform:translateY(-14px) scale(.9)}70%{opacity:1;transform:translateY(2px) scale(1.02)}to{transform:scale(1)}}

/* 列表 */
.list{display:flex;flex-direction:column;gap:10px}
.listitem{background:var(--card2);border:2px solid var(--line);border-radius:var(--r2);padding:12px 14px}
.listitem .who{font-size:12px;color:var(--ink2);margin-bottom:4px}
.listitem .what{font-size:15px;line-height:1.5;word-break:break-word}

/* 输入条 */
.inputbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(env(safe-area-inset-bottom)+10px);
  background:linear-gradient(transparent,var(--bg) 34%);max-width:640px;margin:0 auto;display:flex;gap:8px}
.inputbar input{flex:1;padding:13px 18px;border-radius:999px;border:2px solid var(--stroke);
  background:var(--card);color:var(--ink);font-size:16px;outline:none}
.inputbar .btn{border-radius:999px}

/* 你画我猜 */
#pn-root.wide{max-width:1080px}
.dg{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
@media (min-width:820px){ .dg{grid-template-columns:minmax(0,1fr) 310px;align-items:start} }
.dg-main{min-width:0}
.dg-stage{position:relative;width:100%;max-width:min(100%,58vh);aspect-ratio:1/1;margin:0 auto;
  background:#fff;border-radius:var(--r);overflow:hidden;touch-action:none;border:3px solid var(--stroke);
  box-shadow:0 8px 0 rgba(107,85,136,.14),var(--soft)}
.dg-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
.dg-stage.locked canvas{cursor:default}
/* 猜词者要能用手指在画布区域上下滑动页面；只有画家才禁用滚动 */
.dg-stage.locked,.dg-stage.locked canvas{touch-action:pan-y}
.dg-hint{display:flex;align-items:center;justify-content:center;gap:10px;min-height:46px;margin:2px 0 8px;
  font-size:23px;font-weight:900;letter-spacing:.22em;color:var(--ink);animation:qpop .32s var(--spring) both}
.dg-hint .w{color:#f0a02a}
.dg-hint .u{color:#e6d5ee}
.dg-hint .tag{font-size:13px;font-weight:700;letter-spacing:0;color:var(--ink2);background:var(--card);
  border:2px solid var(--line);border-radius:999px;padding:4px 12px}
.dg-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:10px}
.dg-tools .sep{width:2px;height:24px;background:var(--line);margin:0 2px;border-radius:2px}
.swatch{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--stroke);padding:0;
  box-shadow:0 3px 0 rgba(107,85,136,.18);transition:transform .12s var(--spring)}
.swatch.sel{border-color:var(--acc);box-shadow:0 3px 0 rgba(255,143,184,.5);transform:scale(1.14) translateY(-2px)}
.swatch.eraser{background:#fff;position:relative}
.swatch.eraser::after{content:'🧽';position:absolute;inset:0;font-size:16px;line-height:28px;text-align:center}
.sizew{width:36px;height:36px;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:0}
.sizew i{display:block;background:currentColor;border-radius:50%}
.dg-side{display:flex;flex-direction:column;background:var(--card);border:2px solid var(--stroke);
  border-radius:var(--r);overflow:hidden;min-height:0;box-shadow:var(--soft)}
.dg-log{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;
  height:min(38vh,300px);-webkit-overflow-scrolling:touch}
@media (max-width:819px){ .dg-log{height:190px} }
.dg-msg{font-size:14px;line-height:1.45;word-break:break-word;color:var(--ink)}
.dg-msg .who{font-weight:900;margin-right:5px}
.dg-msg.ok{color:#1f8f68;font-weight:900}
.dg-msg.near{color:#e08a1e}
.dg-msg.sys{color:var(--ink2);font-style:italic}
.dg-input{display:flex;gap:8px;padding:8px;border-top:2px solid var(--line);background:var(--card2)}
.dg-input input{flex:1;min-width:0;padding:12px 16px;border-radius:999px;border:2px solid var(--stroke);
  background:var(--card);color:var(--ink);font-size:16px;outline:none}
.dg-input input:disabled{opacity:.6}
.dg-input .btn{border-radius:999px;padding:12px 18px}

/* 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(75,58,99,.42);backdrop-filter:blur(5px);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:3px solid var(--stroke);border-radius:var(--r);padding:22px;width:100%;max-width:420px;
  box-shadow:var(--pop);animation:qpop .3s var(--spring) both}

/* 计分板 */
.scoreboard{display:flex;flex-direction:column;gap:8px}
.sbrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r2);background:var(--card2);
  border:2px solid var(--line)}
.sbrow .rank{font-weight:900;color:var(--acc);width:22px}
.sbrow .em{font-size:22px}
.sbrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.sbrow .pts{font-weight:900;font-variant-numeric:tabular-nums}
.sbrow.top{background:#fff6da;border-color:var(--yellow);box-shadow:0 4px 0 rgba(255,216,107,.5)}
.sbrow.top .rank:before{content:"👑"}

/* 氛围小装饰：飘着的星星，二次元感 */
.land:after{content:"✨";position:absolute;left:18%;top:16vh;font-size:20px;animation:qfloat 3.2s ease-in-out infinite;opacity:.85}
.land:before{content:"💗";position:absolute;right:16%;top:26vh;font-size:18px;animation:qfloat 2.6s ease-in-out infinite .4s;opacity:.85}

@media (max-width:360px){ .player{width:calc(100% - 0px)} .modegrid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="pn-root">
  <div class="loading"><div class="logo">🧸</div><div>两个人的游戏厅</div><div class="sub">正在连线…</div></div>
</div>

    var code = (location.hash || '').replace('#', '').toUpperCase();
    var wantJoin = join || !!code;
    var brokerIndex = Number(this.local('broker')) || 0;
    var build = function (c) {
      // 房号写回地址栏：这样「开房的人」刷新页面也能回到同一局（以前只有点链接进来的人有 #房号，
      // 开房的人一刷新就掉回落地页，还得手动再输房号），顺便让随时复制的链接都带着房号。
      try { history.replaceState(null, '', '#' + c); } catch (e) { try { location.hash = c; } catch (e2) {} }
      self.room = new PN.Room({
        code: c,
        identity: { id: id, name: name, emoji: emoji },
        brokerIndex: brokerIndex,
        onStatus: function (s, d) {
          self.conn = s === 'connected' ? 'connected' : (s === 'connecting' ? 'connecting' : 'off');
          if (s === 'connected') { self.local('broker', String(self.room.brokerIndex)); if (self.state && self.state.mode !== 'lobby') self.render(); }
          if (s === 'disconnected') self.render();
        },
        onRoster: function (list, kind, peerId) {
          if (kind === 'join' && peerId && self.room && self.room.isHost && self.host) {
            self.host.dispatch({ t: '_joined', id: peerId }, peerId);
          }
          if (self.room && self.room.isHost && self.host) {
            // 大厅：刷新名单；对局中：只刷新在线状态（否则掉线的人会让全桌干等人）
            self.host.dispatch({ t: self.state && self.state.mode === 'lobby' ? 'hi' : '_syncOnline' }, self.pid());
          }
        },
        onHost: function (isHost) {
          if (isHost) {
            if (!self.host) self.host = new PN.Host(self.room, function (state) { self.state = state; self.render(); });
            if (self.room.lastState && self.room.lastState.players) self.host.adopt(self.room.lastState);
            else self.host.fresh(id, name, emoji);
          }
          self.render();
        },
        onState: function (state) {
          self.state = state;
          if (!self.room.isHost && state.hostId !== self.pid()) self.state = state;
          self.render();
        },
        onAction: function (action, from) { if (self.host && self.room.isHost) self.host.dispatch(action, from); },
        onEvent: function (ev) { self.onEvent(ev); },
        onPeer: function (msg, from) { if (self.screen && self.screen.onPeer) self.screen.onPeer.call(self, msg, from); },
        onInk: function (msg, from) {
          // 房主旁听墨迹：留一份给中途加入的人回放（自己的笔迹也会走这里，见 room.sendInk）
          if (!self.room.isHost || !self.host || !self.state) return;
          var g = PN.games[self.state.mode];
          if (g && g.onInk) g.onInk(self.host, msg, from);
        },
        onPrivate: function (obj, from) {
          if (obj.kind === 'secret') {
            self.secrets[obj.mode] = self.secrets[obj.mode] || {};
            // 同一个 mode 下会收到多种私密消息（发词 / 白板猜词 / 请求上报），必须合并而不是覆盖：
            // 覆盖会当场抹掉玩家自己的词和身份 —— 白板词卡变空白、房主迁移时 onRecover 读不到角色而无法上报。
            var prevSec = self.secrets[obj.mode].mine || {};
            var nextSec = obj.obj || {};
            var mergedSec = {}, mk;
            for (mk in prevSec) if (Object.prototype.hasOwnProperty.call(prevSec, mk)) mergedSec[mk] = prevSec[mk];
            for (mk in nextSec) if (Object.prototype.hasOwnProperty.call(nextSec, mk)) mergedSec[mk] = nextSec[mk];
            self.secrets[obj.mode].mine = mergedSec;
            if (obj.obj && obj.obj.recover && self.screen && self.screen.onRecover) {
              self.screen.onRecover.call(self, obj.obj);
            }
          }
          if (obj.kind === 'reveal' && self.screen && self.screen.onReveal) self.screen.onReveal.call(self, obj.obj);
          if (self.screen && self.screen.onPrivate) self.screen.onPrivate.call(self, obj, from);
          self.render();
        }
      });
      self.room.start().then(function () {
        self.setScreen('lobby', PN.screens.lobby);
      });
    };
    if (wantJoin) {
      var c = code || '';
      if (!c) {
        var answer = prompt('输入 4 位房号（群友发你的）', '');
        if (!answer) return;
        c = answer.toUpperCase();
      }
      // 房号本身就是房间标识，探不到也照样能进——你要是第一个到的，你自动就是房主。
      // 这里以前拿 3 秒 probe 的结果决定要不要 confirm 问「没找到房间，要自己开一个吗？」，
      // 但公共 broker 的冷连接实测要 6~7 秒，3 秒必然超时 —— 结果每个点链接进来的人
      // 都被这句吓一跳，点「取消」还会被踢回落地页。改成直接进场，只给一句过渡提示。
      self.renderWaiting('正在进入房间 ' + c + '…');
      build(c);
    } else {
      var gen = function (n) { for (var i = 0; i < n; i++) { var c = PN.randCode(4); if (c !== location.hash.slice(1).toUpperCase()) return c; } return PN.randCode(4); };
      var c = gen(8);
      self.renderWaiting('正在建房…');
      PN.Room.probe(c, brokerIndex, 2500).then(function (meta) { if (meta) build(gen(40)); else build(c); });
    }
  };

  UI.prototype.onEvent = function (ev) {
    // 换主后新房主手里的回放记录是空的：让它自己的屏幕把笔迹重报一遍（见 drawgame.resume）
    if (ev.t === 'recover_ink') {
      if (this.screen && this.screen.onRecover) this.screen.onRecover.call(this, { ink: true, round: ev.round });
      return;
    }
    if (ev.t === 'descAll') { this.toast('描述揭晓，开始投票！'); return; }
    if (ev.t === 'voteResult') { this.toast('投票结果出炉'); return; }
    if (ev.t === 'gameover') {
      this.toast(ev.msg || '本局结束！', 'good');
      if (ev.sfx) this.beep(ev.sfx);
      return;
    }
    if (ev.t === 'question') { this.toast('🃏 ' + (ev.q || '')); return; }
    if (ev.t === 'correct') { this.toast('✅ ' + (ev.text || '') + '！' + (ev.who ? ' ' + ev.who + ' 答对了' : ''), 'good'); this.beep('win'); return; }
    if (ev.t === 'reveal') { this.toast('答案：' + (ev.answer || ev.target || '') + (ev.clue ? '（线索：' + ev.clue + '）' : ''), 'good'); this.beep('win'); return; }
    if (ev.t === 'round') { this.toast(ev.msg || '新回合'); return; }
    if (ev.t === 'toast') { this.toast(ev.text || '', ev.kind); return; }
  };
  UI.prototype.beep = function (kind) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      var ctx = this._ac || (this._ac = new AC());
      if (ctx.state === 'suspended') ctx.resume();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      var t0 = ctx.currentTime;
      // 可爱的音色：三角波/正弦 + 指数包络（「啵」的弹性来自快速上滑 + 干脆收尾）
      if (kind === 'win') {
        o.type = 'triangle';
        [523.25, 659.25, 783.99].forEach(function (f, i) { o.frequency.setValueAtTime(f, t0 + i * 0.09); });
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
        o.start(t0); o.stop(t0 + 0.36);
      } else {
        o.type = 'sine';
        o.frequency.setValueAtTime(420, t0);
        o.frequency.exponentialRampToValueAtTime(900, t0 + 0.07);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.13, t0 + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
        o.start(t0); o.stop(t0 + 0.18);
      }
    } catch (e) {}
  };

  /* ===== 大厅 ===== */
  PN.screens = PN.screens || {};
  PN.screens.lobby = {
    name: 'lobby',
    render: function (state, secret) { return UI.prototype.renderLobby.call(this, state); }
  };
  // 注：屏幕的 render 由 UI.render 用 .call(ui, ...) 调用，所以这里 this 就是 UI 实例

  UI.prototype.renderLobby = function (state) {
    var self = this;
    this.clear();
    var wrap = this.el('div');
    this.root.appendChild(wrap); // 先挂载：下面用 $('#...') 全局查元素
    this.renderTopbar(wrap);
    var s = state;
    var sorted = (s.players || []).slice().sort(function (a, b) { return b.score - a.score; });
    // 点链接进来却一个人都没有、自己还成了房主：多半是网络把这位群友分到了另一台公共服务器
    // （客户端连不上主 broker 会自动换备用，而备用和主用的是两套话题空间）。给一句人话提示。
    var lonely = !!location.hash && (s.players || []).length <= 1 && s.hostId === this.pid();
    var playersHtml = sorted.map(function (p) {
      return '<div class="player ' + (p.id === self.pid() ? 'me' : '') + (p.id === s.hostId ? ' host' : '') + (p.online ? '' : ' off') + '">' +
        '<span class="em">' + (p.emoji || '🙂') + '</span>' +
        '<span class="nm">' + p.name + '</span>' +
        '<span class="sc">' + (p.score || 0) + ' 分</span>' +
        '</div>';
    }).join('');
    var modes = [];
    var cfgOpen = this._cfgOpen || (this._cfgOpen = {}); // 展开状态记在实例上，重建后还能保持
    for (var k in PN.games) if (Object.prototype.hasOwnProperty.call(PN.games, k)) {
      var g = PN.games[k];
      modes.push(
        '<div class="modecard" data-mode="' + k + '">' +
        '<div class="ico">' + g.emoji + '</div>' +
        '<div class="nm">' + g.name + '</div>' +
        '<div class="blurb">' + g.blurb + '</div>' +
        '<div class="row mt8"><button class="btn sm ghost" data-act="cfg">⚙️</button>' +
        '<button class="btn primary sm go" data-act="start" ' + (self.isHost() ? '' : 'disabled') + '>' + (self.isHost() ? '开始' : '等房主开') + '</button></div>' +
        '<div class="settings' + (cfgOpen[k] ? ' open' : '') + '" id="cfg-' + k + '">' + this.settingsHtml(k, s) + '</div>' +
        '</div>'
      );
    }
    wrap.appendChild(this.h(
      '<div>' + // 必须包一层：h() 只保留第一个顶层元素
      '<div class="roomcode card row">' +
      '<div><div class="muted" style="font-size:11px">房号（发给对方）</div><div class="code">' + this.room.code + '</div></div>' +
      '<div style="flex:1"></div>' +
      '<button class="btn sm" id="pn-copy">📋 复制链接</button>' +
      '<button class="btn sm" id="pn-share">📤</button>' +
      '</div>' +
      (lonely ? '<div class="card center"><div class="muted">进房了却一个人都没有？公共服务器偶尔会因为网络限制把你分到另一台，<b>刷新一下</b>一般就能看到对方了。</div></div>' : '') +
      '<div class="card"><div class="muted" style="margin-bottom:10px">在房里的人（' + (s.players || []).length + '）</div>' +
      '<div class="players">' + (playersHtml || '<div class="muted">还差一个人，把对方叫进来吧～</div>') + '</div></div>' +
      '<div class="modegrid">' + modes.join('') + '</div>' +
      '<div class="row mt16" style="justify-content:center;gap:8px">' +
      '<button class="btn ghost sm" id="pn-edit">✏️ 改昵称</button>' +
      (self.isHost() ? '<button class="btn warn sm" id="pn-reset">清零积分</button><button class="btn warn sm" id="pn-disband">解散房间</button>' : '<button class="btn warn sm" id="pn-leave">离开</button>') +
      '</div>' +
      '</div>'
    ));
    $('#pn-copy').addEventListener('click', function () { self.copyLink(); });
    $('#pn-share').addEventListener('click', function () { self.share(); });
    $('#pn-edit').addEventListener('click', function () { self.editProfile(); });
    var reset = $('#pn-reset'); if (reset) reset.addEventListener('click', function () { if (confirm('清零所有人积分？')) self.send({ t: 'resetScores' }); });
    var dis = $('#pn-disband'); if (dis) dis.addEventListener('click', function () { if (confirm('解散房间？所有人都要重进')) { self.room.leave(true); self.exitToLand(); } });
    var lv = $('#pn-leave'); if (lv) lv.addEventListener('click', function () { self.room.leave(false); self.exitToLand(); });
    var cards = wrap.querySelectorAll('.modecard');
    cards.forEach(function (card) {
      var mode = card.dataset.mode;
      card.querySelector('[data-act="cfg"]').addEventListener('click', function () {
        var cfg = $('#cfg-' + mode);
        self._cfgOpen[mode] = !self._cfgOpen[mode];
        if (cfg) cfg.classList.toggle('open', self._cfgOpen[mode]);
      });
      card.querySelector('[data-act="start"]').addEventListener('click', function () {
        self.send({ t: 'start', mode: mode });
      });
      card.querySelectorAll('.cfg').forEach(function (ctl) {
        ctl.addEventListener('click', function () {
          var raw = ctl.dataset.val;
          var v;
          if (raw === 'true') v = true; else if (raw === 'false') v = false; else if (!isNaN(Number(raw))) v = Number(raw); else v = raw;
          var values = {};
          values[ctl.dataset.key] = v;
          self.send({ t: 'settings', mode: mode, values: values }); // 必须带上模式：设置存在 settings[模式] 下
          card.querySelectorAll('.cfg[data-key="' + ctl.dataset.key + '"]').forEach(function (x) { x.classList.remove('on'); });
          ctl.classList.add('on');
        });
      });
    });
    return wrap;
  };

  UI.prototype.settingsHtml = function (mode, s) {
    var st = (s.settings && s.settings[mode]) || {};
    var rows = [];
    var seg = function (label, key, opts) {
      var cur = String(st[key]);
      return '<div class="setrow"><span>' + label + '</span><div class="seg">' + opts.map(function (o) {
        return '<button class="cfg ' + (String(o[0]) === cur ? 'on' : '') + '" data-key="' + key + '" data-val="' + o[0] + '">' + o[1] + '</button>';
      }).join('') + '</div></div>';
    };
    if (mode === 'drawgame') {
      rows.push(seg('总回合', 'rounds', [[3, '3'], [6, '6'], [9, '9']]));
      rows.push(seg('画画时长', 'drawSec', [[60, '60s'], [90, '90s'], [120, '120s']]));
    }
    return rows.join('');
  };

  UI.prototype.editProfile = function () {
    var self = this;
    // 必须挂在 #pn-root 外面：render() 会 root.innerHTML='' ，挂里面的话
    // 任何人进房/改设置都会把弹窗连同你正在输入的昵称一起抹掉。
    document.body.appendChild(this.h(
      '<div class="overlay"><div class="modal">' +
      '<div class="center" style="font-weight:800;margin-bottom:14px">✏️ 改昵称</div>' +
      '<div class="field"><input id="pn-ename" maxlength="12" value="' + this.me().name + '"></div>' +
      '<div class="row mt16"><button class="btn ghost block" id="pn-ecancel">取消</button>' +
      '<button class="btn primary block" id="pn-esave">保存</button></div>' +
      '</div></div>'
    ));
    $('#pn-ecancel').addEventListener('click', function () { document.querySelector('.overlay').remove(); });
    $('#pn-esave').addEventListener('click', function () {
      var name = $('#pn-ename').value.trim() || '神秘群友';
      self.room.me.name = name;
      self.local('name', name);
      self.send({ t: 'setProfile', name: name, emoji: self.me().emoji });
      document.querySelector('.overlay').remove();
      self.render();
    });
  };

  PN.UI = UI;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ===== src/app.js ===== */
/* ===== 应用入口 ===== */
(function (root) {
  'use strict';
  var PN = root.PN = root.PN || {};

  function boot() {
    var ui = new PN.UI();
    PN.app = ui;
    ui.renderLand();
    var wrapErr = function (e) {
      console.error(e);
      document.getElementById('pn-root').innerHTML =
        '<div class="land"><div class="biglogo">🛠️</div><h1>启动失败</h1>' +
        '<div class="sub">' + (e && e.message ? e.message : '未知错误') + '（刷新重试）</div></div>';
    };
    window.addEventListener('error', function (e) {
      // 只在致命阶段兜底，不打扰游戏内小错
      if (!PN.app || !PN.app.room) wrapErr(e.error || e);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
